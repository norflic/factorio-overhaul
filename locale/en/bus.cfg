[mod-setting-name]
fo-war-bus=Master plan: product bus by belt

[mod-setting-description]
fo-war-bus=When on, a team links a distant output chest to the dock of a module that consumes the same item with a long belt (up to 220 tiles, undergrounds at obstacles), where the earlier dock link (40 tiles) does not reach, instead of having its NPCs carry it. The rule (producer-consumer graph, k belts) picks the item and the pair; the [FO-BUS] journal line gives each decision and its reason. Off, only the earlier dock link remains.
