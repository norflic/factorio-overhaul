[item-description]
fo-commande-outil=Drag over an ore patch: your team settles it right away.\nShift + drag: priority link in the area.\nRight button: cancel the orders in the area.

fo-cmd-gisement=Drag over an ore patch: your team settles it right away.\nRight button: cancel the orders in the area.\nShortcut: Shift + A.
fo-cmd-amelioration=Drag over an area: your team's buildings there that have a higher version are upgraded first.\nRight button: cancel the orders in the area.\nShortcut: Shift + Z.
fo-cmd-liaison=First drag: point A (start). Second drag: point B (destination). Both are linked first.\nRight button: cancel the orders in the area.\nShortcut: Shift + E.
fo-cmd-bastion=Drag over an area: your team's stocked turrets are placed there first, as on an attacked spot.\nRight button: cancel the orders in the area.\nShortcut: Shift + R.

