[item-description]
fo-vein-quartz=Age 10 ore. Melted in the arc furnace, it makes the crystal puller's crucible.
fo-quartz-crucible=Fused quartz. Lost at every ingot pull, as in a real fab.
fo-silicon-ingot=A single crystal of silicon. Sawn at the lapidary, it makes 40 wafers.
fo-photomask=The chip pattern on glass, with a tungsten absorber. Wears out in lithography.
fo-etched-wafer=An exposed, etched and diced wafer: the chips of the etched processor.
fo-crystal-laser=The resonance lens finally serves a laser. The heart of the crystal lithograph.

[fluid-name]
