fo-quartz-crucible=Fused quartz crucible
fo-silicon-ingot=Czochralski pulling
fo-wafer-sawing=Wafers sawn from the ingot
fo-etched-wafer=Lithography and etching
fo-etched-processor=Etched processor

[technology-name]
fo-chip-foundry=Chip foundry

[technology-description]
fo-chip-foundry=Vein quartz becomes a crucible, pure silicon becomes an ingot and then sawn wafers; the crystal lithograph etches the wafers, and the etched processor is mounted on two printed circuit boards. The clean room remains.
