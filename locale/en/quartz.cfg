[entity-description]
fo-vein-quartz=Veins of milky white quartz in sheaves of prisms. Two veins placed at the edge of a crystal plain, 400 to 800 tiles from the start. Any drill can mine it, and so can a hand (slowly).
fo-crystal-puller=Pulls a monocrystalline silicon ingot from a bath of pure silicon, in a quartz crucible lost at every pull (Czochralski process).
fo-crystal-lithograph=Exposes, etches and dices silicon wafers. The ultraviolet comes from a crystal laser, by frequency conversion in the cut crystal.

