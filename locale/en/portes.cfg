[mod-setting-name]
fo-war-portes=NPCs: gates before expanding

[mod-setting-description]
fo-war-portes=When on, factions and your team wait before adding building sites and trips when their NPCs are overwhelmed: when too few NPCs are free or free tasks pile up, no new order that adds trips (a belt is still allowed); never more open building sites at once than the base size supports; only one more unit when transport is strained or the shortage is measured. Surviving, repairing and protecting are never held back. Off by default; the [FO-PORTES] log line says what is held back and why.
