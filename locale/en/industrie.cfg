[mod-setting-name]
fo-war-industrie=NPC: industrialize

[mod-setting-description]
fo-war-industrie=NPC teams evaluate their need (defense, rebuilding, recruits, what the planner will consume) and invest all the rest of their stock, instead of keeping a percentage of it for no reason; your team no longer holds its growth iron reserve while that need is covered. Under a HQ threat the previous rule applies. Off by default. Turning it off mid-game restores the old rules.
