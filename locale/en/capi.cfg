[mod-setting-name]
fo-war-capi=NPCs: capitalize

[mod-setting-description]
fo-war-capi=Factions (not your team) reinvest what they produce: they cover their ore patches with drills, open new ones, place as many furnaces as their ore can feed, build assembler rows and labs. Only acts when NPC automation is on. Off by default. Turning it off mid-game stops new orders; what is built stays.
