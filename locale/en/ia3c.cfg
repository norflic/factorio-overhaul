[mod-setting-name]
fo-war-ia3-cerveau=NPCs: needs-driven brain (IA3-c trial)

[mod-setting-description]
fo-war-ia3-cerveau=Trial of the new NPC brain, for factions and your team. No more goal ladder: each team runs several projects at once based on what it LACKS (short of iron: it crafts furnaces, mines iron with several NPCs and smelts it; it stops collecting the stone and coal it has in excess; it searches for what it cannot find). Factions do real research with labs placed next to their chest, according to their character. Can be switched on during a game (each team then moves to the new brain, keeping its research); a team that took it keeps it even if the setting is switched off. Off by default until the trial is measured.

