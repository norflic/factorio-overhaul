[mod-setting-name]
fo-war-relais=NPCs: relay for hand-made chains

[mod-setting-description]
fo-war-relais=A chain the brain has ordered, whose item the NPCs already craft by hand (at least 0.25 NPC of load), passes the saturated-transport gate: that hand crafting is what saturates the NPCs. The site, rank, budget and power gates remain. Unchecked: the gate holds the chain while the transport is saturated.
