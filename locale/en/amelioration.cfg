[mod-setting-name]
fo-war-amelioration=NPCs: upgrade their buildings by block (furnaces, drills, assemblers)

[mod-setting-description]
fo-war-amelioration=NPCs (factions and your team) upgrade their furnaces, drills and assemblers BLOCK BY BLOCK (blueprint module, outpost, HQ quarter): a whole block goes up one level before any single building goes up two, within the limits of stock, center cap and footprint. Your team only upgrades the buildings of its own projects, paid from its chest. Off: one building per think around the HQ (previous rule).
