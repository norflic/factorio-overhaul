fo-war-degradation=Teams: space out non-urgent work when the game is loaded
fo-war-vapeur-tampon=Teams: refill the power plant coal also when steam drops

[mod-setting-description]
fo-war-degradation=When the queue of heavy jobs grows (large factory), work that is not pressing, the thinking of far and calm factions and the power plant feed survey, is spaced out in steps (up to three times rarer). Defence, power and your own team are never slowed. Off: the previous pace.
fo-war-vapeur-tampon=The power plant coal chest is refilled urgently not only when it falls under the consumption threshold, but also when the steam in the engines falls under 30% (back at 60%) and the chest is under three quarters of its target. Off: only consumption triggers.
