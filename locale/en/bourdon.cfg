[entity-name]
fo-bourdon=The Bourdon
fo-bourdon-flamme=Knell flame

[entity-description]
fo-bourdon=Levitating cathedral bell, age 15. It tolls The Knell: a shock wave that flattens everything hostile to it.

[controls]
fo-bourdon-glas=The Bourdon: toll The Knell towards the cursor

[fo-bourdon]
aide=DEMONSTRATION: brings The Bourdon down next to you (free), then calls it back. "retirer" sends it away. It obeys the remote put in your hand.
aide-glas=DEMONSTRATION: The Bourdon tolls The Knell towards what the cursor aims at, otherwise the nearest enemy; if too far, it goes there first.
demo=DEMONSTRATION: The Bourdon comes down (free, not production). The remote in your hand gives it orders; /fo-glas or Ctrl + Shift + G makes it toll.
vient=The Bourdon weighs anchors and comes.
retire=The Bourdon rises away.
impossible=The Bourdon cannot come down here.
absent=No Bourdon: /fo-bourdon brings it down.
route=The Bourdon sets off: it will toll on arrival.
sonne=The Knell: the clapper draws back.
sonne-seul=The Knell, no target: the clapper draws back.
recharge=The Bourdon is still ringing: __1__ s.
