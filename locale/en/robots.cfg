[entity-description]
fo-robot-workshop=Builds age 3 robot KITS (the Steam Trotter); each kit becomes a robot next to the machine while army points remain (cap: 12 + 6 x your centre's age). One chest and one inserter per ingredient, never a mixed chest. Placeholder visual (tinted assembler). Productivity modules are refused: the kit fills one slot.

[item-name]
fo-robot-workshop=Automaton workshop
fo-robot-kit-steam-trotter=Steam Trotter kit
fo-robot-order=Robot order tool
fo-robot-rally=Rally tool

[item-description]
fo-robot-kit-steam-trotter=Parts of a Steam Trotter. The workshop sweep turns it into a robot as soon as there is room under the army cap; otherwise the kit waits in the machine's output, which stops on its own.
fo-robot-order=Drag (left button): choose your robots. Shift + drag: attack-move the chosen robots to the area. Drag with the right button: attack what is framed. Shift + right button: move to the area. A plain click gives a small area.
fo-robot-rally=Click or drag: the centre of the area becomes the rally point of the open workshop. The tool is then returned.

[technology-name]
fo-robot-automata=Steam automata

[technology-description]
fo-robot-automata=Unlocks the automaton workshop and the Steam Trotter, the mod's first robot (age 3). Placeholder visual.

[mod-setting-name]
fo-war-robots=Robots: build and command
fo-war-robots-cap=Robots: army cap (points)

[mod-setting-description]
fo-war-robots=On: robot workshops turn their kits into robots while army points remain, and player orders are served. Off: no robot is created or commanded (a kit stays in the machine's output, which stops); existing robots stay.
fo-war-robots-cap=Robot army cap, in points, per force (small robot 1, medium 2, large 4, giant 12). 0 = automatic: 12 + 6 x the command centre's age (30 at age 3, 102 at age 15). A dead robot frees its points.

