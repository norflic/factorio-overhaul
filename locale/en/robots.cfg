[entity-description]
fo-robot-workshop=Builds the robot kits of ages 3 to 6 (Steam Trotter, Scalehide, Coiler); each kit becomes a robot next to the machine while army points remain. 3 x 3, 2 modules. One chest and one inserter per ingredient, never a mixed chest.
fo-robotics-bay=Builds the robot kits of ages 7 to 9 (Needle, Bellwether, Chamfer). 5 x 5, 4 modules. One chest and one inserter per ingredient.
fo-robot-dock=Builds the robot kits of ages 10 to 12 (Trowel, Finback, Levite) and the 10 segments of each giant. 7 x 7, 4 modules.
fo-robot-gantry=Assembles a giant: 10 dock segments plus the final assembly (120 s). 11 x 11, 6 modules, 30 MW. Up to 1, 2 then 3 giants per force at ages 13, 14 and 15.

