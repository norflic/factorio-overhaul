[item-description]
fo-robot-kit-steam-trotter=Parts of a "Steam Trotter" robot (age 3). The factory sweep turns it into a robot as soon as there is room under the army cap; otherwise the kit waits in the machine's output, which stops by itself.
fo-robot-order=Drag (left button): choose your robots. Shift + drag: attack-move the chosen robots to the area. Drag with the right button: attack what is framed. Shift + right button: move to the area. A plain click gives a small area.
fo-robot-rally=Click or drag: the centre of the area becomes the rally point of the open workshop. The tool is then returned.
fo-robot-kit-scalehide=Parts of a "Scalehide" robot (age 5). The factory sweep turns it into a robot as soon as there is room under the army cap; otherwise the kit waits in the machine's output, which stops by itself.
