[technology-description]
fo-robot-automata=Unlocks the automata workshop and the Steam Trotter, the mod's first robot (age 3).
fo-robot-heavy=Unlocks the Scalehide, a heavy assault robot (age 5).
fo-robot-coil=Unlocks the Coiler, an area-fire robot against swarms (age 6).
fo-robot-bay=Unlocks the assembly hall and the Needle, a long-range shooter (age 7).
fo-robot-bellwether=Unlocks the Bellwether, which heals nearby robots (age 8).
fo-robot-mender=Unlocks the Mender, a small workshop healer (age 4).
fo-robot-skitter=Unlocks the Skitter, a fast workshop scout (age 5).
fo-robot-lancer=Unlocks the Lancer, a heavy anti-armour bay shooter (age 8).
fo-robot-mortar=Unlocks the Chamfer, area artillery with range 45 (age 9).
fo-robot-dock=Unlocks the piloting dock and the Trowel, an engineer robot (age 10).
fo-robot-finback=Unlocks the Finback, a fast assault robot (age 11).
fo-robot-levite=Unlocks the Levite, a heavy assault robot (age 12).
fo-robot-gantry=Unlocks the gantry, the segments and the Toroid, the first giant (age 13).
fo-robot-gantry-heliast=Unlocks the Heliast, an artillery giant (age 14).
fo-robot-gantry-crowned=Unlocks the Crowned, the final giant (age 15).
fo-servo-mechanisms=Unlocks the servo motor, the optical sensor and the programmable controller (age 7).
fo-robot-guidance=Unlocks the guidance core (age 10).
fo-magnetic-drive=Unlocks the magnet actuator, the Nd:YAG rod and the laser module (age 12).

[mod-setting-name]
fo-war-robots=Robots: build and command
fo-war-robots-cap=Robots: army cap (points)

[mod-setting-description]
fo-war-robots=On: robot workshops turn their kits into robots while army points remain, and player orders are served. Off: no robot is created or commanded (a kit stays in the machine's output, which stops); existing robots stay.
fo-war-robots-cap=Robot army cap, in points, per force (small robot 1, medium 2, large 4, giant 12). 0 = automatic: 12 + 6 x the command centre's age (30 at age 3, 102 at age 15). A dead robot frees its points.

