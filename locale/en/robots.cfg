desc-scalehide=Robot "Scalehide" (age 5): a sloped carapace with ember cracks, slow heavy assault.
name-coiler=Coiler
desc-coiler=Robot "Coiler" (age 6): insulators and an electric arc: area fire against swarms.
name-needle=Needle
desc-needle=Robot "Needle" (age 7): a tripod with a crystal tip: long-range shooter (36 tiles).
name-bellwether=Bellwether
desc-bellwether=Robot "Bellwether" (age 8): glass bulbs: does not shoot, heals every robot around it in pulses (radius 12, up to 30).
name-mender=Mender
desc-mender=Variant "Mender" (age 4): a small workshop Bellwether: does not shoot, heals nearby robots in pulses (radius 8, up to 6).
name-skitter=Skitter
desc-skitter=Variant "Skitter" (age 5): a lightened Steam Trotter: fast scout (0.22 tile per tick), tight fire at 22 tiles, light armour.
name-lancer=Lancer
desc-lancer=Variant "Lancer" (age 8): a heavier Needle: one slow, heavy physical shot at 42 tiles, which loses less to armoured carapaces than a burst.
name-chamfer=Chamfer
desc-chamfer=Robot "Chamfer" (age 9): an octagonal hull and a mortar: area artillery, range 45, cannot fire within 12 tiles.
name-trowel=Trowel
desc-trowel=Robot "Trowel" (age 10): a dome and a tool arm: shoots, revives construction ghosts within 20 tiles and repairs buildings.
name-finback=Finback
desc-finback=Robot "Finback" (age 11): a white arrowhead: fast assault.
name-levite=Levite
desc-levite=Robot "Levite" (age 12): a body on two floating rings: heavy assault (it walks: trial RB0 E5 showed a reduced mask also crosses walls).
name-toroid=Toroid
desc-toroid=Robot "Toroid" (age 13): a six-legged giant, sphere and torus: experimental assault, range 100.
name-heliast=Heliast
desc-heliast=Robot "Heliast" (age 14): a giant with golden wings and a dish: experimental artillery, area fire, range 100.
name-crowned=Crowned
desc-crowned=Robot "Crowned" (age 15): a giant on a floating base with a crown: final experimental, range 100.
heal-pulse=Heal: __1__ robot(s) healed

