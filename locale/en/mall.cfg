[mod-setting-name]
fo-war-mall=Master plan: centralized mall
fo-war-mall-s2-debit=Mall: also count plates by measured output

[mod-setting-description]
fo-war-mall=When on, each team (factions and your team) picks early, from the terrain alone, a sector near the HQ (no water, no ore, no building) and reserves it for the mall: the master plan no longer places isolated modules there. The mall will group the assembler rows on a shared input bus. The [FO-MALL] log line gives the chosen sector, or the cause when none fits, and when the team is ready (a power plant producing, iron and copper smelted automatically, no crisis, an assembler). Turned off during a game, the reservation is given back.
fo-war-mall-s2-debit=When on, a plate counts as automated for the mall state from 30 plates per minute produced, in addition to a finished field or smelter. When off: only a finished field or smelter counts.
