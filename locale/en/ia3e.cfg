[mod-setting-name]
fo-war-ia3e=NPCs: automate what keeps coming back

[mod-setting-description]
fo-war-ia3e=Factions measure the time their NPCs spend by hand on each item (tours, smelting, mining, crafting) and, when a machine pays back in under 20 minutes (5 under threat), ask the master plan for an electric smelter (drills and belts on the ore patch) or an assembler row, with their steam plant. An open research goes first (unless the module serves it). Your team does not automate. Turning it off mid-game stops new requests; built modules stay.
