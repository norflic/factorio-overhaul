[mod-setting-name]
fo-war-acier=NPC: automated steel foundry

[mod-setting-description]
fo-war-acier=Steel is made by a row of furnaces that grows with demand (an iron plate input belt, an output belt to a buffer chest), like the assembler rows. As soon as such a finished foundry produces at least what the team asks for, no NPC loads a steel furnace by hand any more (resumed if the output drops below half; never cut in survival mode). On by default. Turning it off gives steel back to the NPC smelting trips.
