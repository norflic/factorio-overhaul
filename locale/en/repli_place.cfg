[mod-setting-name]
fo-war-repli-place=Master plan: fallback spot for a module without a lot

[mod-setting-description]
fo-war-repli-place=When on, a module (smelter, factory, labs, drills) that the master plan cannot place in any lot of the lattice, once the lattice can no longer grow, is placed in a free and safe window near the HQ or its deposit instead of being abandoned. Off: the project is refused as before. On by default; the [FO-REPLI-PLACE] log line gives why the plan failed and the spot found.
