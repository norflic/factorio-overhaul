[mod-setting-name]
fo-pvp-difficulty=Factions: difficulty (attacks against you)

[mod-setting-description]
fo-pvp-difficulty=Do the AI factions attack you on their own?\n- Peaceful: never, unless you destroy something of theirs (ceasefire broken).\n- Easy: after a 45 min grace period, small attacks, at most one every 15 min per faction.\n- Normal: after a 30 min grace period, at most one attack every 8 min per faction.\n- Hard: after 18 min, larger attacks, every 5 min.\n- Merciless: after 10 min, massive attacks, every 3 min.\nThe grace period starts when the war starts and depends on each faction's character (the conqueror attacks earlier, the builder later). Can be changed during the game.

[string-mod-setting]
fo-pvp-difficulty-peaceful=Peaceful
fo-pvp-difficulty-easy=Easy
fo-pvp-difficulty-normal=Normal
fo-pvp-difficulty-hard=Hard
fo-pvp-difficulty-merciless=Merciless

