[mod-setting-name]
fo-pvp-difficulty=Factions: difficulty (attacks against you)
fo-war-autostart=Factions: start the war when the game starts
fo-war-factions=Factions: number
fo-war-soldiers=Factions: maximum soldiers
fo-war-workers=Factions: maximum workers

[mod-setting-description]
fo-pvp-difficulty=Do the AI factions attack you on their own?\n- Peaceful: never, unless you destroy something of theirs (ceasefire broken).\n- Easy: after a 45 min grace period, small attacks, at most one every 15 min per faction.\n- Normal: after a 30 min grace period, at most one attack every 8 min per faction.\n- Hard: after 18 min, larger attacks, every 5 min.\n- Merciless: after 10 min, massive attacks, every 3 min.\nThe grace period starts when the war starts and depends on each faction's character (the conqueror attacks earlier, the builder later).\nAgainst a defended base, a faction only attacks with enough soldiers (Easy: cautious, can be deterred; Normal to Merciless: it masses its troops for up to 20, 30 or 45 min, more and more reckless). On Hard and Merciless, the factions coordinate their assaults. Can be changed during the game.
fo-war-autostart=When checked, the AI factions' war starts on its own a few seconds after the game starts, around your spawn point (headquarters about 480 tiles away), with the numbers below. Only once per game: /fo-war stop does not restart it. Unchecked: nothing happens, the /fo-war start command is still available.
fo-war-factions=Number of AI factions started automatically, or by "/fo-war start" without a number (2 to 4).
fo-war-soldiers=Maximum soldiers per faction, automatic start (5 to 100).
fo-war-workers=Maximum workers (NPCs) per faction (1 to 60), reachable from epoch 1: each recruit is paid from the HQ stock (a pistol, 10 magazines, 10 iron plates plus one per NPC already there) and is hired only if the team has work for it (see "Recruit if at most N NPCs are idle"). Can be changed during a game for a war started automatically or by "/fo-war start" without a worker count.

