intro=[FO-PVP] Difficulty: __1__. The factions will attack you on their own: first possible declaration of war in __2__ min.
intro-peaceful=[FO-PVP] Difficulty: __1__. The factions will only attack you if you destroy something of theirs.
resumed=[FO-PVP] New setting "faction difficulty": __1__. Any grace period starts now (Settings > Mod settings > Map).
changed=[FO-PVP] Faction difficulty: __1__.
warn=[FO-PVP] __1__ will declare war on you in __2__ min.
declare=[FO-PVP] __1__ declares war on you: its troops will attack your installations!
declare-provoked=[FO-PVP] __1__ declares war on you in retaliation!
attack=[FO-PVP] __1__ launches an attack against you: __2__ soldiers heading to __3__.
truce=[FO-PVP] __1__ recalls its troops and restores the ceasefire.
inherited=[FO-PVP] __1__ was already at war with you and stays so (hostility predating this setting).
