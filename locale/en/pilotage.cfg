[mod-setting-name]
fo-war-armee-famille=NPCs: army reserved share
fo-war-plafonds=NPCs: machine safety caps

[mod-setting-description]
fo-war-armee-famille=When on, ammunition and soldier equipment form one "army" family that keeps its share (the capitalisation's defence + army shares) of the material stock against the faction's other projects: while the family has an unserved need, other projects see the stock minus that share; the first soldiers and the ammunition reserve go first. Your own team's army does not benefit (it is still served after its economy). When off, the stock is served in the old order, with no reserved share.
fo-war-plafonds=When on, a faction never places more than 192 furnaces, 96 chain machines or 96 pack machines for a single item (a safeguard against runaway growth: the player's game needs less than half that); at the cap, the refusal is written to the log. When off, only the demand-relative caps remain.
