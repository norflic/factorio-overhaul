[controls]
fo-dezoom-down=Zoom out beyond the mouse wheel (one more step)
fo-dezoom-up=Step back in (hands control back to the mouse wheel at step 0)

[fo-dezoom]
cran=Extended zoom-out: step __1__ of __2__ (view about __3__% of the mouse wheel limit)
normal=Extended zoom-out: finished, the mouse wheel is in control again
