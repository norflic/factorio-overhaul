[entity-description]
fo-crystal-lithograph=Exposes silicon wafers through the photomask, with ultraviolet light drawn from the cut crystal. Placeholder look (tinted vanilla assembler) until its model is made.
fo-data-center=Produces your force's COMPUTE: it draws power (10 MW), cooling water and wears out one blade every 5 minutes. Compute cannot be stored: while the center runs, your labs research faster. Placeholder look (tinted vanilla assembler) until its model is made.

