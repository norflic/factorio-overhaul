[technology-description]
fo-chip-foundry=Silicon wafer lithography, cutting into logic, memory and cache dies, and a processor assembled from those dies.
fo-data-centers=RAM, motherboard, server blade and data center. Compute cannot be stored: it speeds up research while the centers run.
fo-gpu-computing=Graphics cards and accelerator blades: 4 times the compute per center.
fo-regolith-degassing=Heating ilmenite releases its trapped helium-3; the degassed ilmenite then smelts in the arc furnace.
fo-quantum-computing=Qubit chips, helium-3 dilution stage and quantum processor: 20 times the compute of a classic center.
