fo-degassed-ilmenite-smelting=Degassed ilmenite smelting

[recipe-description]
fo-compute-classic=100 compute units per second. 10 water per second, one server blade worn out every 5 minutes, 10 MW.
fo-compute-accelerated=400 compute units per second. 10 water per second, one accelerator blade worn out every 5 minutes, 10 MW.
fo-compute-quantum=2,000 compute units per second. 10 water and 0.5 helium-3 per second, one quantum processor worn out every 10 minutes, 10 MW.

[technology-name]
fo-chip-foundry=Chip foundry
fo-data-centers=Data centers
fo-gpu-computing=Accelerated computing
fo-regolith-degassing=Regolith degassing
fo-quantum-computing=Quantum computing

[technology-description]
fo-chip-foundry=Silicon wafer lithography, cutting into logic, memory and cache dies, and a processor assembled from those dies.
fo-data-centers=SMT line, fiber, rack integration bay, chiller, cooling tower and the modular data center. Compute cannot be stored: it speeds up research while the centers run.
fo-gpu-computing=Graphics cards and GPU racks: 4 times the compute of a CPU rack, but 3 memory shares each.
fo-regolith-degassing=Heating ilmenite releases its trapped helium-3; the degassed ilmenite then smelts in the arc furnace.
fo-quantum-computing=Dilution refrigerator, quantum lab, quantum rack and the large data center's dilution cooling.
