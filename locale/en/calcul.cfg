[recipe-description]
fo-compute-classic=100 compute units per second. 10 water per second, one server blade worn out every 5 minutes, 10 MW.
fo-compute-accelerated=400 compute units per second. 10 water per second, one accelerator blade worn out every 5 minutes, 10 MW.
fo-compute-quantum=2,000 compute units per second. 10 water and 0.5 helium-3 per second, one quantum processor worn out every 10 minutes, 10 MW.

[technology-name]
