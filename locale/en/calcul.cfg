[item-description]
fo-photomask=Circuit pattern on glass, tungsten absorber. Wears out during lithography.
fo-etched-wafer=Exposed, etched and doped wafer: dies still joined together.
fo-crystal-laser=The resonance lens finally drives a laser: the lithograph's light source.
fo-logic-die=Compute core cut from an etched wafer: the processor-to-be.
fo-dram-die=Main-memory die, cut from an etched wafer.
fo-sram-die=Cache memory die, fast and costly, bonded next to the processor.
fo-heat-sink=Aluminium fins on a copper base: without it, a chip burns.
fo-memory-module=DRAM dies on a printed board: the servers' main memory.
fo-motherboard=Printed boards, circuits and the crystal clock that drives everything else.
fo-server-blade=Data center rack (CPU): 100 units/s, needs 1 memory share. 1,000 kW, 1,000 kW of heat. No longer wears out (compute v2).
fo-graphics-card=Four logic dies and their memory, cooled, under titanium shielding: thousands of computations in parallel.
fo-gpu-blade=Data center rack (GPU, age 11): 400 units/s, needs 3 memory shares. 2,500 kW, 2,500 kW of heat.
fo-degassed-ilmenite=Heated ilmenite that has released its trapped gases, helium-3 among them. Smelts in the arc furnace.
fo-qubit-chip=Etched superconducting circuits: qubits, which only live a hair above absolute zero.
fo-dilution-stage=Helium-3 / helium-4 mixing cryostat: reaches a few thousandths of a degree.
fo-quantum-processor=Qubit chips inside their dilution stage, steered by classic logic dies.

[fluid-name]
fo-photoresist=Photoresist
fo-helium-3=Helium-3

