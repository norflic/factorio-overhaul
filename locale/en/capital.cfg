[mod-setting-name]
fo-war-capital=NPCs: upgrade their buildings and advance epochs
fo-war-remplacer=NPCs: replace their furnaces and assemblers with the next machine up

[mod-setting-description]
fo-war-capital=Factions (not your team) place their command center near their HQ, then upgrade their leveled buildings and their center (the next epoch) when it is worth the cost, paid from their HQ chest the way you pay. Off by default: when on, it currently slows the factions' research. Turning it off mid-game stops new upgrades; upgraded buildings stay.
fo-war-remplacer=NPCs (factions and your team) replace their furnaces and assemblers in place with the next machine up as soon as it is unlocked (stone furnace to steel furnace, for example), paid from their chest; the old machine goes back to it. Touches no center or turret and never asks for research. Turning it off stops new replacements.
