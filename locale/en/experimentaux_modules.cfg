[item-description]
fo-xp-module-portee-1=Goes into the grid of an experimental giant. Attack range, depending on the giant that carries it (a module is always worth the same share of its value: stronger on a young giant, weaker on an old one): Cairn +__1__ %, Stylus +__2__ %, Waterspout +__3__ %, Ixion +__4__ %, Sunflower +__5__ %. Range modules add up, to +__6__ % in total. A target only this extra range reaches is marked with a violet sight line.
fo-xp-module-portee-2=Goes into the grid of an experimental giant. Attack range, depending on the giant that carries it (a module is always worth the same share of its value: stronger on a young giant, weaker on an old one): Cairn +__1__ %, Stylus +__2__ %, Waterspout +__3__ %, Ixion +__4__ %, Sunflower +__5__ %. Range modules add up, to +__6__ % in total. A target only this extra range reaches is marked with a violet sight line.
fo-xp-module-portee-3=Goes into the grid of an experimental giant. Attack range, depending on the giant that carries it (a module is always worth the same share of its value: stronger on a young giant, weaker on an old one): Cairn +__1__ %, Stylus +__2__ %, Waterspout +__3__ %, Ixion +__4__ %, Sunflower +__5__ %. Range modules add up, to +__6__ % in total. A target only this extra range reaches is marked with a violet sight line.
fo-xp-module-puissance-1=Goes into the grid of an experimental giant. Damage of each strike, depending on the giant that carries it (a module is always worth the same share of its value: stronger on a young giant, weaker on an old one): Cairn +__1__ %, Stylus +__2__ %, Waterspout +__3__ %, Ixion +__4__ %, Sunflower +__5__ %. Power modules add up, to +__6__ % in total. The giant flares crimson with every strike.
fo-xp-module-puissance-2=Goes into the grid of an experimental giant. Damage of each strike, depending on the giant that carries it (a module is always worth the same share of its value: stronger on a young giant, weaker on an old one): Cairn +__1__ %, Stylus +__2__ %, Waterspout +__3__ %, Ixion +__4__ %, Sunflower +__5__ %. Power modules add up, to +__6__ % in total. The giant flares crimson with every strike.
