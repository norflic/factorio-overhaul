fo-war-ia3-comportement=NPCs: visible behaviours (fear, detours, escorts)

[mod-setting-description]
fo-war-ia3-comportement=NPCs remember dangerous places (enemies seen, attacks, deaths), choose routes that avoid them and vary from one trip to the next, stop or turn aside when they see an enemy on their way, run to the nearest turret or HQ when wounded or out of ammo, and do not go back alone where comrades died. Faction soldiers patrol, guard, escort and clear nests close to the routes. A short state is shown above the NPC at every change. Off: previous behaviour.

