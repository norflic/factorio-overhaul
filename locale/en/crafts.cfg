[recipe-description]
fo-blast-furnace-steel=Coke steel: 4 iron instead of 5, plus slag.
fo-sand=Stone crushed into sand.
fo-slag-cement=Blast furnace slag, crushed with stone.
fo-cement-concrete=10 concrete for 4 cement, 6 sand and water, without iron ore.
fo-arc-steel=Arc furnace steel: 3 iron and 1 graphite for 1 steel.
fo-wound-electric-engine=A coil replaces the lubricant: an electric engine without fluid (departs from the X0 scenario, where it only replaced a third).
fo-titanium-composite=PLACEHOLDER: biopolymer (age 8) is not in the game yet, plastic replaces it.
fo-titanium-lds=2 low density structures for 1 composite and 4 copper.
fo-slag-landfill=Outside the X0 scenario: slag you have no use for is packed into landfill.
fo-sorel-concrete=Outside the X0 scenario: magnesium oxychloride cement. Uses up the magnesium chloride and caustic soda left by brine.
fo-hydrocracking=Outside the X0 scenario: brine hydrogen cracks heavy oil better than water.
fo-glass=4 sand melted into 1 glass, in any furnace.
fo-steam-cracking=Petroleum gas and steam: ethylene.
fo-polyethylene=3 plastic for 20 ethylene and 1 coal (vanilla: 2 plastic for 20 gas).
fo-flare-ethylene=Burns 100 ethylene, producing nothing.
fo-flare-hydrogen=Burns 100 hydrogen, producing nothing.
fo-flare-chlorine=Burns 100 chlorine, producing nothing.
fo-flare-brine=Burns 100 brine, producing nothing.
fo-flare-titanium-tetrachloride=Burns 100 tetrachloride, producing nothing.
fo-methane-reforming=50 methane and 100 steam: 200 hydrogen and 50 carbon dioxide.
fo-slag-carbonation=Carbon dioxide from reforming turns slag into cement.
fo-flare-carbon-dioxide=Burns 100 carbon dioxide, producing nothing.
fo-metallurgical-silicon=4 sand and 1 graphite in the arc furnace.
fo-pure-silicon=2 metallurgical silicon purified by 30 hydrogen.
fo-silicon-wafer=One pure silicon sawn into 4 wafers.
fo-cleanroom-processor=A wafer replaces 10 of the 20 green circuits (departs from scenario X0, which gave 2 processors: the processor is the age 10 currency).
fo-siemens-silicon=Scenario X3: chlorine loops (2 lost per craft); less metallurgical silicon, more hydrogen.
fo-iron-concentrate=8 iron ores for 1 concentrate.
fo-copper-concentrate=8 copper ores for 1 concentrate.
fo-tungsten-concentrate=8 tungsten ores for 1 concentrate.
fo-iron-plate-r8=One concentrate smelted in the arc furnace: a billet, i.e. 8 plates.
fo-copper-plate-r8=One concentrate smelted in the arc furnace: a billet, i.e. 8 plates.
fo-tungsten-plate-r8=One concentrate smelted in the arc furnace: a billet, i.e. 8 plates.
fo-iron-plate-r8-unpacking=One billet cut into 8 iron plates.
fo-copper-plate-r8-unpacking=One billet cut into 8 copper plates.
fo-tungsten-plate-r8-unpacking=One billet cut into 8 tungsten plates.
fo-asphalt=10 heavy oil and 5 sand: 10 asphalt.

