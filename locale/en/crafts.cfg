[item-description]
fo-slag=Blast furnace by-product. Crushed into cement, or packed into landfill.
fo-cement=Slag cement. Makes concrete with sand and water.
fo-sand=Crushed stone. Used for cement concrete and electrical steel.
fo-graphite=Coke annealed in the arc furnace. Used for electric steel and titanium composite.
fo-magnetic-steel=Silicon steel for coils.
fo-enameled-wire=Insulated copper wire for coils.
fo-coil=Heart of the wound electric engine.
fo-titanium-composite=Titanium, graphite and binder: makes low density structures.
fo-glass=Sand melted in a furnace. Used for pressure gauges.
fo-manometer=Measures the pressure of boilers and columns: flare stack, steam cracker.

