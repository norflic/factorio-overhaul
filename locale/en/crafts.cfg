[item-description]
fo-slag=Blast furnace by-product. Crushed into cement, or packed into landfill.
fo-cement=Slag cement. Makes concrete with sand and water.
fo-sand=Crushed stone. Used for cement concrete and electrical steel.
fo-graphite=Coke annealed in the arc furnace. Used for electric steel and titanium composite.
fo-magnetic-steel=Silicon steel for coils.
fo-enameled-wire=Insulated copper wire for coils.
fo-coil=Heart of the wound electric engine.
fo-titanium-composite=Titanium, graphite and binder: makes low density structures.
fo-glass=Sand melted in a furnace. Used for pressure gauges.
fo-manometer=Measures the pressure of boilers and columns: flare stack, steam cracker.
fo-metallurgical-silicon=Sand reduced with graphite in the arc furnace.
fo-pure-silicon=Silicon purified with hydrogen (or with chlorine, Siemens process).
fo-silicon-wafer=A slice of pure silicon: the cleanroom turns it into processors with half the green circuits.
fo-iron-concentrate=8 iron ores concentrated: the arc furnace turns it into a billet.
fo-copper-concentrate=8 copper ores concentrated: the arc furnace turns it into a billet.
fo-tungsten-concentrate=8 tungsten ores concentrated: the arc furnace turns it into a billet.
fo-iron-plate-r8=Worth 8 iron plates: cut by hand or in an assembler.
fo-copper-plate-r8=Worth 8 copper plates: cut by hand or in an assembler.
fo-tungsten-plate-r8=Worth 8 tungsten plates: cut by hand or in an assembler.
fo-asphalt=A floor of heavy oil and sand: fast to walk on (like concrete) and better for vehicles.

