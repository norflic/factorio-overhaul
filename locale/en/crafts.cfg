[technology-description]
fo-coking=Age 2 (Forge): the coke oven bakes coal into coke.
fo-blast-furnace=Age 2 (Forge): coke steel, thriftier with iron; its slag is packed into landfill.
fo-crushing=Age 2 (Forge): the crusher makes sand and slag cement.
fo-cement-concrete=Age 3 (Steam): concrete without iron ore.
fo-arc-smelting=Age 6 (Electricity): the arc furnace, graphite and electric steel.
fo-electrical-steel=Age 6 (Electricity): electrical steel, enameled wire, coil and wound electric engine.
fo-titanium-alloys=Age 11 (Titanium): titanium plate makes composite, and composite makes low density structures.
fo-glassworks=Age 3 (Steam): melted sand gives glass, and glass gives pressure gauges.
fo-flaring=Age 4 (Oil): the flare stack burns a surplus fluid so that no factory jams.
fo-steam-cracking=Age 4 (Oil): the steam cracker makes ethylene, and ethylene a plastic thriftier with gas.
fo-brine-byproducts=Age 11 (Titanium): brine hydrogen, caustic soda and magnesium chloride find a use (hydrocracking, Sorel concrete); flare recipes for brine fluids.

[fluid-name]
fo-ethylene=Ethylene
