[entity-description]
fo-blast-furnace=Makes steel with coke: 4 iron plates and 1 coke for 1 steel, plus slag. Placeholder visual (tinted, enlarged vanilla steel furnace) until its model is made; no levels yet.
fo-crusher=Crushes stone into sand and slag into cement. Placeholder visual (tinted, reduced vanilla assembler) until its model is made; no levels yet.
fo-coil-winder=Enamels copper wire and winds coils. Placeholder visual (tinted, reduced vanilla assembler) until its model is made; no levels yet.
fo-flare-stack=Burns a fluid you have no use for (pick the fluid's recipe). Placeholder visual (tinted, reduced vanilla assembler) until its model is made; no levels.
fo-steam-cracker=Cracks petroleum gas with steam into ethylene. Placeholder visual (tinted vanilla chemical plant) until its model is made; no levels yet.
fo-reformer=Steam-reforms methane: lots of hydrogen and some carbon dioxide. Placeholder visual (tinted vanilla chemical plant) until its model is made; no levels yet.
fo-cleanroom=Makes silicon wafers and processors. Placeholder visual (tinted, enlarged vanilla assembler) until its model is made; no levels yet.

