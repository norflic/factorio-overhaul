[mod-setting-name]
fo-factions=Factions in the war
fo-team-npc-max=NPCs per faction
fo-player-team-npc-max=NPCs in your team
fo-npc-start=Starting NPCs of a team
fo-agents-max=Guard: maximum agents
fo-path-issue-per-tick=Path requests per tick

[mod-setting-description]
fo-factions=Number of AI factions started by "/fo-war start" without arguments (2 to 4).
fo-team-npc-max=Maximum headcount of each AI faction. Reachable from epoch 1: only the faction's stock slows the growth (each recruit costs a pistol, 10 magazines and 10 iron plates plus one per NPC already there). Also applies during a game to a war started without a worker count.
fo-player-team-npc-max=Maximum headcount of your team (team chest). Same rule as the factions: recruits are paid with the chest contents.
fo-npc-start=NPCs granted when a team is founded (a faction's HQ, or placing your team chest), within the maximum headcount.
fo-agents-max=Performance guard: beyond this number of characters driven by the mod (NPCs and companions), no team recruits any more.
fo-path-issue-per-tick=Path requests sent to the engine each tick by the whole mod (smooths bursts). The limit of requests in progress remains "fo-path-max-inflight".
