[mod-setting-name]
fo-player-team-npc-max=NPCs in your team
fo-npc-start=Starting NPCs of a team
fo-agents-max=Guard: maximum agents
fo-path-issue-per-tick=Path requests per tick
fo-recruit-idle-max=Recruit if at most N NPCs are idle

[mod-setting-description]
fo-player-team-npc-max=Maximum headcount of your team (team chest). Same rule as the factions: recruits are paid with the chest contents, and only when the team has work for them.
fo-npc-start=NPCs granted when a team is founded (a faction's HQ, or placing your team chest), within the maximum headcount.
fo-agents-max=Performance guard: beyond this number of characters driven by the mod (NPCs and companions), no more paid recruits. NPCs granted at founding and the emergency hire of an empty team are still allowed.
fo-path-issue-per-tick=Path requests sent to the engine each tick by the whole mod (smooths bursts). The limit of requests in progress remains "fo-path-max-inflight".
fo-recruit-idle-max=A team (a faction or yours) recruits only if at most this many of its NPCs have no task: a recruit without work would stay idle and cost iron taken from the army or from your chest. 0: recruit when everyone is working. 60: no brake, only the stock slows growth.
