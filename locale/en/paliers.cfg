[mod-setting-name]
fo-war-paliers=NPCs: grow in steps after stability

[mod-setting-description]
fo-war-paliers=When on, factions and your team only grow their demand (idle stock becomes a demand) after 5 minutes in a row with no shortage, no crisis and free hands, then wait for a new placement before the next step; any placement restarts the count. Off by default: the previous growth (a little more at each decision while stock sits idle). A variant to compare over several seeds before making it the rule.
