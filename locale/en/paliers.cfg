[mod-setting-name]
fo-war-paliers=NPCs: grow in steps after stability

[mod-setting-description]
fo-war-paliers=When on, factions and your team only grow their demand (idle stock becomes a demand) after 5 minutes in a row with no shortage, no crisis and free hands, then wait for a new placement before the next step; any placement restarts the count. On by default since 0.6.60; when off, the previous growth applies (a little more at each decision while stock sits idle).
