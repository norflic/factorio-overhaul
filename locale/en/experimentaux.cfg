[entity-description]
fo-xp-mat-foudre=Experimental of age 6, placed defence. The head charges, then an arc jumps from target to target (three targets at most). Uses electricity.
fo-xp-geode=Experimental of age 7, thrown attacker. The ground spits a line of violet spikes running to the target: it opens a wall without coming close.
fo-xp-sarracenie=Experimental of age 8, placed defence. Three urns lob three arcing acid jets; the puddles eat away the passing wave.
fo-xp-demi-vie=Experimental of age 9, single use. It rushes the nearest enemy and melts down on the spot: green fireball, long-lasting contaminated zone.
fo-xp-veilleuse=Experimental of age 13, placed defence. The captive sun drops an arcing bead: magenta flash, glass plate.

[item-description]
fo-xp-mat-foudre=Placed defence of age 6 (Automata workshop). Electric arc that jumps from target to target.
fo-xp-geode=Capsule of age 7 (Assembly hall): throw it, the Geode lands there and heads for the nearest enemy.
fo-xp-sarracenie=Placed defence of age 8 (Assembly hall). Three acid jets, puddles that eat away.
fo-xp-demi-vie=Capsule of age 9 (Assembly hall), single use: throw it, the Half-Life rushes the nearest enemy and melts down on the spot.
fo-xp-veilleuse=Placed defence of age 13 (Experimental gantry). An arcing bead of plasma that bursts.

