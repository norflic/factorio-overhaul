[entity-description]
fo-xp-mat-foudre=Experimental of age 6, placed defence. The head charges, then an arc jumps from target to target (three targets at most). Uses electricity.
fo-xp-geode=Experimental of age 7, thrown attacker. The ground spits a line of violet spikes running to the target: it opens a wall without coming close.
fo-xp-sarracenie=Experimental of age 8, placed defence. Three urns lob three arcing acid jets; the puddles eat away the passing wave.
fo-xp-demi-vie=Experimental of age 9, single use. It rushes the nearest enemy and melts down on the spot: green fireball, long-lasting contaminated zone.
fo-xp-veilleuse=Experimental of age 13, placed defence. The captive sun drops an arcing bead: magenta flash, glass plate.
fo-xp-cairn=Experimental giant of age 10. The Sweep: a radar sector marks up to 8 targets, then each antenna fires a blue arc at its mark (the shot is shared). It floats: nothing stops it.
fo-xp-stylet=Experimental giant of age 11. The Writing: the tip touches the ground, a right-angled circuit runs under the enemy base; each node fires a blue-white pillar.
fo-xp-trombe=Experimental giant of age 12. The Freeze: the ground whitens over 44 tiles, machines and enemies stop, then ice spikes burst them.
fo-xp-ixion=Experimental giant of age 13, the wheel of fire. The Trench: a burning crack runs to the target and beyond, geysers erupt all along.
fo-xp-tournesol=Experimental giant of age 14. The Hearth: its mirrors face the sun and return a white-gold beam that leaves molten glass. At night it does not fire.

[item-description]
fo-xp-mat-foudre=Placed defence of age 6 (Automata workshop). Electric arc that jumps from target to target.
fo-xp-geode=Capsule of age 7 (Assembly hall): throw it, the Geode lands there and heads for the nearest enemy.
fo-xp-sarracenie=Placed defence of age 8 (Assembly hall). Three acid jets, puddles that eat away.
fo-xp-demi-vie=Capsule of age 9 (Assembly hall), single use: throw it, the Half-Life rushes the nearest enemy and melts down on the spot.
fo-xp-veilleuse=Placed defence of age 13 (Experimental gantry). An arcing bead of plasma that bursts.
fo-xp-cairn=Giant of age 10: 10 segments assembled at the Piloting dock. One more giant only under the giant cap. Placed like a spider; you receive the remote.
fo-xp-stylet=Giant of age 11: 10 segments assembled at the Piloting dock. Giant cap. You receive the remote when placing it.
fo-xp-trombe=Giant of age 12: 10 segments assembled at the Piloting dock. Giant cap. You receive the remote when placing it.
fo-xp-ixion=Giant of age 13: 10 segments assembled at the Experimental gantry. Giant cap. You receive the remote when placing it.
fo-xp-tournesol=Giant of age 14: 10 segments assembled at the Experimental gantry. Giant cap. You receive the remote when placing it.
fo-xp-segment-cairn=One tenth of the Cairn, made at the Piloting dock.
fo-xp-segment-stylet=One tenth of the Stylus, made at the Piloting dock.
fo-xp-segment-trombe=One tenth of the Waterspout, made at the Piloting dock.
fo-xp-segment-ixion=One tenth of Ixion, made at the Piloting dock.
fo-xp-segment-tournesol=One tenth of the Sunflower, made at the Piloting dock.

