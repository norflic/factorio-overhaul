[mod-setting-name]
fo-war-rapatriement=Master plan: bring far outputs home by belt

[mod-setting-description]
fo-war-rapatriement=When on, a far output chest (ore field, smelter, site) 56 tiles or more from the HQ is linked by a long belt to a buffer chest placed near the input chests that consume its item: inserter, belt, inserter, buffer. The NPC no longer carries the far leg (output to HQ); it only empties the buffer, near the HQ, when the HQ stock is low. The line is a master plan project, decided by price (NPC work saved against parts and building, payback within 120 min). The fallback is the old one: belt cut or buffer full, the output rises to the collection threshold and the NPC takes over. Also requires the industry master setting. The [FO-RAPATRIEMENT] log line gives each line requested, finished, cut or refused, with its cause, and the NPC trips saved per hour.
