[mod-setting-name]
fo-war-exclusion=NPCs: items excluded from demand

[mod-setting-description]
fo-war-exclusion=List of item names (separated by commas or spaces, for example "decider-combinator, lab") that factions and your team never make, place or ask for: an excluded item appears in no sink and no option of the capitalisation, and every refusal is written in the [FO-EXCLU] log line. Orders already open run to completion. Empty by default: nothing is excluded.
