[mod-setting-name]
fo-war-enveloppe=Master plan: open districts ahead
fo-war-quartiers=Master plan: district depot

[mod-setting-description]
fo-war-enveloppe=When on, a team prepares its next district (3 × 3 lots) BEFORE its modules run out of room: a pole linked to the grid, two depot chests and a cleared central lot, streets included. It opens when the free lots of the districts already open fall below the anticipated need (lots taken by modules in 15 min, scaled to 10 min ahead, between 2 and 4), with at least one idle NPC, no hold from the priority stack and no survival mode. On by default; the [FO-ENVELOPPE] log line gives each decision and its reason. When off, nothing new opens; a district already started finishes its build.
fo-war-quartiers=When on, the two depot chests of an open district are filled from the HQ with the items most requested by its modules' input chests; a "fill" trip for an input chest of that district then takes from the depot, when it holds the whole batch, instead of a round trip to the HQ. On by default; the [FO-QUARTIER] log line lists the depot items every 5 min. Without an open district (previous setting), nothing changes.
