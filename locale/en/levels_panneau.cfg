[mod-setting-name]
fo-levels-panneau="Evolution" panel: opening

[mod-setting-description]
fo-levels-panneau=When does the "Evolution" panel of a building with levels open?\n- On click (default): when you click the building (left click, walls and laser turrets included). Opened with the building's interface, it closes with it. Hovering opens nothing. U upgrades the hovered building without opening the panel; Shift+U opens or closes the panel of the hovered building.\n- On hover: as soon as the cursor passes over the building (or with U), and it stays displayed (previous behaviour).\nSet by each player, can be changed during the game.

[string-mod-setting]
fo-levels-panneau-clic=On click on the building
fo-levels-panneau-survol=On hover (previous behaviour)

[controls]
fo-level-panel=Open or close the "Evolution" panel of the hovered building
fo-level-open=Open the "Evolution" panel of the clicked building
