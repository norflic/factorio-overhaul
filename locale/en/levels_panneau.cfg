[mod-setting-name]
fo-levels-panneau="Evolution" panel: opening

[mod-setting-description]
fo-levels-panneau=When does the "Evolution" panel of a building with levels open?\n- On click (default): when you open the building's interface (left click), and it closes with it. Hovering opens nothing. U upgrades the hovered building without opening the panel; Shift+U opens or closes the panel of the hovered building (walls and other buildings without an interface).\n- On hover: as soon as the cursor passes over the building (or with U), and it stays displayed (previous behaviour).\nSet by each player, can be changed during the game.

[string-mod-setting]
fo-levels-panneau-clic=On click (building interface)
fo-levels-panneau-survol=On hover (previous behaviour)

[controls]
fo-level-panel=Open or close the "Evolution" panel of the hovered building
