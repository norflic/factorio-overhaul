[entity-description]
fo-titan-ravageur=Allied assault mega-robot: a slender biped with an orb head and blade-wings. It EVOLVES with its force's age: plates, mass, hit points, and one more weapon per tier: gatling grapeshot (six-projectile burst), short-area crystal blades (tier 2), the giants' area salvo (tier 4), resonance: doubled rate of fire (tier 6). It floats: nothing stops it.
fo-titan-ecorcheur=Enemy titan: a flayed fleshy biped with an arm-cannon, spawned by the oldest nests. Its era follows the game's age: heavier, better armoured, brighter; bite, then arm-cannon shot (era II), then BROOD (era III and later): when an enemy is in range, Flayed crawl out of its belly sac and join its pack.
fo-titan-ecorche-rodeur=Mutant biter brooded by the Flayer: slim, long-legged, the fastest of the line.
fo-titan-ecorche-porteur=Mutant biter brooded by the Flayer: squat, its back laden with crystals and plates, the toughest of the line.
fo-titan-ecorche-hurleur=Mutant biter brooded by the Flayer: a huge gaping head; its howl strikes everything around it.

[item-description]
fo-titan-ravageur=Titan of age 13: 10 segments assembled at the Piloting Dock. Giants cap. Placed at the tier of your force's age, it evolves at every age reached. The remote is handed to you when placed.
fo-titan-segment-ravageur=One tenth of the Ravager, made at the Piloting Dock.

[item-name]
