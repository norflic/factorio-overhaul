[entity-description]
fo-titan-juggernaut=Allied titan of the giants family: a heavy bipedal Jaeger on thruster-driven digitigrade legs. It EVOLVES with its force's age: armour plates, mass, hit points, and one more weapon per tier: energy claws (short area), rotary cannon with annular focusing (tier 2), the giants' area salvo (tier 4), resonance: doubled rate of fire (tier 6). It floats: nothing stops it.
fo-titan-sentinelle=Allied hexapod titan hovering on its thrusters, a singularity at its heart. It EVOLVES with its force's age: plates, mass, hit points, and one more weapon per tier: singularity ray (area damage and slowdown of everything moving around it), annular cannon (tier 2), the giants' area salvo (tier 4), resonance: doubled rate of fire (tier 6).
fo-titan-leviathan=Allied serpentine titan floating above the ground, frontal vortex and escort drones in orbit. It EVOLVES with its force's age: plates, mass, hit points, and one more weapon per tier: drone salvo (2 drones, 3 from tier 4), frontal vortex as a cannon (tier 3), the giants' area salvo (tier 5), resonance: doubled rate of fire (tier 6).
fo-titan-kaiju=Enemy titan: a colossal cyber-organic reptile with crystal spines. Its era follows the game's age: heavier, better armoured, brighter; bite, then area claws (era II), then the maw-cannon pulse (era III and later).

[item-description]
fo-titan-juggernaut=Titan of age 10: 10 segments assembled at the Piloting Dock. Giants cap. Placed at the tier of your force's age, it evolves at every age reached. The remote is handed to you when placed.
fo-titan-segment-juggernaut=One tenth of the Juggernaut, made at the Piloting Dock.
fo-titan-sentinelle=Titan of age 11: 10 segments assembled at the Piloting Dock. Giants cap. Placed at the tier of your force's age, it evolves at every age reached. The remote is handed to you when placed.
fo-titan-segment-sentinelle=One tenth of the Sentinel, made at the Piloting Dock.
fo-titan-leviathan=Titan of age 12: 10 segments assembled at the Piloting Dock. Giants cap. Placed at the tier of your force's age, it evolves at every age reached. The remote is handed to you when placed.
fo-titan-segment-leviathan=One tenth of the Leviathan, made at the Piloting Dock.

