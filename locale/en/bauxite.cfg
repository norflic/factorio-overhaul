[entity-name]
fo-bauxite=Bauxite
fo-reduction-cell=Fused-salt reduction cell
fo-ht-pylon=High-voltage pylon

[entity-description]
fo-bauxite=Brick-ochre pisolites of the red desert climate, more than 300 tiles from the start. Any drill can mine it.
fo-reduction-cell=Electrolysis of molten alumina on a graphite anode (Hall-Héroult process). 6 MW: the hungriest machine of age 6. Placeholder look (tinted electric furnace) until its own model.
fo-ht-pylon=Carries power over 64 tiles but powers nothing around it: a transmission pylon. Placeholder look (tinted big electric pole).

[item-name]
fo-bauxite=Bauxite
fo-alumina=Alumina
fo-red-mud=Red mud
fo-aluminium-plate=Aluminium plate

[item-description]
fo-bauxite=Aluminium ore (age 6). Lime-sintered in the chemical plant: alumina and red mud.
fo-alumina=Aluminium oxide. The fused-salt reduction cell turns it into aluminium.
fo-red-mud=Sintering by-product. Two outlets: cement (crusher) or iron (arc furnace).
fo-aluminium-plate=Light and conductive: aluminium-steel conductor pylons.

[recipe-name]
fo-lime-sinter-alumina=Lime sintering of bauxite
fo-hall-heroult=Fused-salt electrolysis (Hall-Héroult)
fo-red-mud-cement=Red mud cement
fo-red-mud-iron=Iron from red mud
fo-ht-pylon-aluminium=Aluminium-steel conductor pylon

[technology-name]
fo-high-voltage=High voltage
fo-aluminium=Aluminium

[technology-description]
fo-high-voltage=The high-voltage pylon carries power 64 tiles on a single wire.
fo-aluminium=Lime-sintered bauxite gives alumina; the fused-salt reduction cell turns it into aluminium. Red mud is never wasted: cement or iron. The aluminium-steel conductor pylon saves steel and copper (the classic way stays).
