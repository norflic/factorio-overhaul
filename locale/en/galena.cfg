[technology-description]
fo-lead-processing=Galena from distant patches gives lead; lead and steel give lead shielding.
fo-galena-roasting=Galena roasted with oxygen in the arc furnace: more lead per ore, and sulfur.
fo-thorium=Thorium oxide from monazite becomes the fuel of the molten salt reactor (160 MW); spent salt is reprocessed.
