[entity-description]
fo-galena=Lead sulfide in grey cubes with a metallic lustre. Regular patches, more than 300 tiles from the start. Every mining drill can mine it.
fo-molten-salt-reactor=Burns thorium salt cells: 160 MW of heat, no neighbour bonus. Temporary look (tinted vanilla nuclear reactor) until its own model; no levels yet.

