[item-description]
fo-galena=Lead ore (age 9). Smelts in a furnace: 2 galena make 1 lead plate.
fo-lead-plate=Heavy, soft metal of age 9 (Atom).
fo-lead-shielding=Lead and steel: radiation shielding. Used by the molten salt reactor.
fo-thorium-salt-cell=Fuel of the molten salt reactor: 32 GJ.
fo-spent-salt=What is left of a thorium salt cell. Reprocessed in a centrifuge: thorium oxide and uranium 238.

