[fo-levels-taille]
resize-line=Size: __1__ → __2__ (grows in place, the building keeps its contents)
regrid-line=Off the grid since a mod update (__1__): the upgrade puts it back on the grid at __2__, half a tile away at most (it keeps its contents)
room-free=Room: free around the building (green square on the ground).
room-free-moved=Room: the usual spot is taken; the building will grow towards the __1__ (green square on the ground).
room-blocked=Room: not enough (orange outline on the ground). In the way: __1__
reason-no-room=Not enough room for size __1__: clear the outlined area. In the way: __2__
dir-n=north
dir-s=south
dir-e=east
dir-w=west
dir-ne=north-east
dir-nw=north-west
dir-se=south-east
dir-sw=south-west
points-moved=Output or pipe: at this position, __1__ would no longer be served (the drill output or the pipe connection would move to another tile). Clear another position, or remove it.
migration-kept=Mod update: __1__ building(s) could not take their new size for lack of room. They keep working, straddling the grid (sprites overlap by half a tile). To upgrade them: clear the outline shown by the upgrade, or pick them up and place them again. __2__
migration-stacked=Mod update: __1__ pair(s) of stacked buildings found (bug fixed in 0.4.3: upgrading an off-grid building placed the new one on top of the old one). Nothing was removed: pick up the one you do not want to keep. __2__
free-button=Clear the space
free-tooltip=Marks what is in the orange outline for deconstruction (by construction robots, or by hand) and places ghosts to rebuild it shifted. The building grows by itself as soon as the space is clear; the cost is paid at that moment.
free-cancel-button=Cancel the growth
free-pending=Growth pending: __1__ obstacle(s) marked for deconstruction, __2__ ghost(s) to build, __3__ to remove by hand. It happens as soon as the orange outline is clear (time left: __4__ min at most).
free-started=Clearing the space for __1__ (__2__): __3__ obstacle(s) marked for deconstruction (robots, or by hand), __4__ ghost(s) placed to rebuild them shifted. The building will grow as soon as the orange outline is clear.
free-signalled=To remove by hand (the mod cannot place them again, red outline): __1__
free-wall-open=A wall line could not be closed again around the cleared space: check it.
free-wired=__1__ marked obstacle(s) carry circuit wires: reconnect them after they are rebuilt.
free-done=Space cleared: __1__ has grown ([gps=__2__,__3__]).
free-no-resources=The space around __1__ is clear, but the cost is missing: the request keeps waiting (30 min at most).
free-cancelled=Growth cancelled: __1__ deconstruction mark(s) removed, __2__ ghost(s) removed.
free-expired=Growth abandoned (30 min without a clear space): __1__ deconstruction mark(s) removed, __2__ ghost(s) removed.
free-gone=Growth cancelled (the building is gone or changed): __1__ deconstruction mark(s) removed, __2__ ghost(s) removed.
free-kept=__1__ ghost(s) kept: what they replace is already deconstructed, robots will rebuild it shifted.
free-refused-room-free=The space is already clear: upgrade directly.
free-refused-already=A growth request is already pending for this building.
free-refused-too-many=Too many obstacles for one click: clear some of them by hand.
free-refused-other=The space cannot be cleared here (see the reason in the panel).
