[mod-setting-name]
fo-war-petrole=NPCs: go to oil

[mod-setting-description]
fo-war-petrole=Factions and your team can build what hands cannot make: pumpjacks on an oil field, a refinery, chemical plants, an offshore pump (a pond is placed at the field when no shore is close, as for the power plant), pipes and poles to their grid. They then look for oil when their research needs it and build their site there for plastic, sulfur and the chemical science pack. On by default; turning it off mid-game stops new requests, built sites stay.
