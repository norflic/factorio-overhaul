[mod-setting-name]
fo-war-petrole=NPCs: go to oil

[mod-setting-description]
fo-war-petrole=Factions (not your team) can build what hands cannot make: pumpjacks on an oil field, a refinery, chemical plants, an offshore pump, pipes and poles to their grid. They then look for oil when their research needs it and build their site there. Off by default: not yet proven up to the chemical pack. Turning it off mid-game stops new requests; built sites stay.
