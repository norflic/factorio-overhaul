[mod-setting-name]
fo-war-nids=Factions: destroy the nests that threaten them

[mod-setting-description]
fo-war-nids=A faction whose army is large and idle enough (a garrison stays at the HQ) destroys the biter nest it knows from its scouts that threatens its HQ and outposts the most, especially one that already destroyed buildings or killed soldiers. After a failure or a retreat it waits 5, 10, 20 then 40 minutes before going back with more soldiers. Off: only nests close to routes are cleaned, as before.
