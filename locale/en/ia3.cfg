[mod-setting-name]
fo-war-ia3-recherche=Factions: research first (IA3-a trial)

[mod-setting-description]
fo-war-ia3-recherche=Trial of the new NPC brain. Factions craft their science packs from the start, with a priority set by their character (the technocrat researches before arming, the conqueror the other way round), never craft the packs of a research they cannot pay for (chemical pack without oil), and never touch the plates of their next iron outpost. Read when each faction is founded. Off by default until the trial is measured.
