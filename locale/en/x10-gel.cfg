[mod-setting-name]
fo-war-gel=NPCs: freeze faction factories far from you

[mod-setting-description]
fo-war-gel=To make the game run faster, faction outposts and furnaces (not your team's) that no player can see (more than 256 tiles away) stop, and their production is counted as if they were running: ore taken from the deposit, coal burned, plates in their chests, pollution. They restart as soon as a player comes near (224 tiles), or a faction is attacked, loses a building, is threatened or sends its army out. Off: everything runs in the engine, as before.
