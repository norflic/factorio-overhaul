[recipe-description]
fo-dc-chilled-water=The data center's cooling: 10 chilled water per second, returned as warm water. Each cooling rack then removes 2,000 kW.
fo-dc-liquid-nitrogen=Large data center only: 5 liquid nitrogen per second. Each cooling rack then removes 5,000 kW.
fo-dc-dilution=Large data center only: chilled water and dilution mixture. Only this cooling makes quantum racks compute.

