[entity-description]
fo-crystal-puller=Pulls a monocrystalline silicon ingot from a bath of pure silicon (Czochralski process). Placeholder visual (tinted centrifuge).
fo-wire-saw=Saws the ingot into thin wafers with a diamond wire, water and crystal powder. Placeholder visual (tinted assembler).
fo-plasma-etcher=Plasma-etches and dopes exposed wafers: they become dies, still joined together. Placeholder visual (tinted assembler).
fo-die-prober=Dices the etched wafer and tests every die: logic, DRAM, SRAM or NAND flash. Placeholder visual (tinted assembler).
fo-packaging-line=Packages dies: processors and flash drives. Placeholder visual (tinted assembler).
fo-smt-line=Places components on printed boards: motherboards, RAM modules, switches, graphics cards. Placeholder visual (tinted assembler).
fo-fiber-tower=Draws glass into optical fiber. Placeholder visual (tinted centrifuge).
fo-rack-integrator=Builds the data center RACKS: CPU, memory, storage, network, cooling, GPU, quantum. Placeholder visual (tinted assembler).
fo-chiller=Chills water for the data centers. Placeholder visual (tinted assembler).
fo-cooling-tower=Rejects the data centers' heat: warm water becomes water again, 2 % evaporates. Placeholder visual (tinted assembler).
fo-data-center=MODULAR data center: insert racks (6 slots). CPUs and GPUs compute, memory feeds them, storage and network cap the output, cooling removes the heat. Needs chilled water (returned as warm water) and power for every rack. Compute cannot be stored: it speeds up your force's research. Placeholder visual.
fo-data-center-2=Large data center: 12 rack slots, twice the passive cooling, liquid nitrogen (age 12) and dilution for quantum racks (age 13). Placeholder visual (tinted assembler).
fo-dilution-fridge=Mixes helium-3 and helium-4 cooled by nitrogen: the cold that qubits need. Placeholder visual (tinted centrifuge).
fo-quantum-lab=Makes qubit chips and quantum processors. Placeholder visual (tinted centrifuge).
fo-data-center-power=Power drawn by the racks of a data center.

