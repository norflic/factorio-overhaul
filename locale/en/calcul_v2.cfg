[item-description]
fo-silicon-ingot=A single silicon crystal, slowly pulled from the melt.
fo-exposed-wafer=Resist-coated wafer exposed through the photomask: the pattern still has to be etched.
fo-nand-die=Memory die that keeps its data without power.
fo-flash-drive=NAND dies on a board: storage for the racks.
fo-optical-fiber=Glass drawn into a thread: light carries the data.
fo-network-switch=Connects the servers to each other and to the rest of the base.
fo-memory-rack=Data center rack. Offers 4 memory shares (a CPU needs 1, a GPU 3). 300 kW, 300 kW of heat.
fo-storage-rack=Data center rack. Raises the internal compute cap by 600 units/s (200 without). 300 kW, 300 kW of heat.
fo-network-rack=Data center rack. Raises the compute export to the force by 1,000 units/s (300 without). 200 kW, 200 kW of heat.
fo-cooling-rack=Data center rack. Removes 2,000 kW of heat while the center runs on chilled water (5,000 on liquid nitrogen). 150 kW.
fo-quantum-rack=Data center rack (age 13). 2,000 units/s, but only in a large data center on dilution cooling, each one driven by a CPU rack. 1,500 kW, 500 kW of heat.

