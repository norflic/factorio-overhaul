[mod-setting-name]
fo-war-rangee-dyn=NPCs: growing assembler rows

[mod-setting-description]
fo-war-rangee-dyn=An assembler row placed by capitalization keeps room for its full size and grows in place when demand rises (same belts, same input, same output) instead of opening a new island; copper cable rows output on both belt lanes. On by default. Turning it off only affects new rows.
