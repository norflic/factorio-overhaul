[mod-setting-name]
fo-war-electrique=Teams: switch to electric as soon as possible

[mod-setting-description]
fo-war-electrique=As soon as a power plant is finished and the electric mining drill and a pole can be crafted, teams no longer place burner drills (no extension, no new outpost; only exception: the coal of a stopped power plant). Burner fields switch to electric one whole field at a time, as fast as the power margin allows, and the power of the planned electric drills is requested from the power plant before they are placed. Off: the previous behaviour.
