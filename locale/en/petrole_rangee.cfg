fo-war-petrole-champ=NPCs: equip every well of an oil field

[mod-setting-description]
fo-war-petrole-champ=A finished oil site keeps growing while reachable wells remain in its field: a pumpjack on every well, a straight collector crossing the field, straight or L-shaped branches, and one main line to the site's crude pipe. An impossible well (water, cliff, no room) is written to the log with its cause. Off: no new extension is requested (placed work stays).
