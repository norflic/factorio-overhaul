[mod-setting-name]
fo-war-barils=NPCs: fluids judged on their barrels
fo-war-soupape=NPCs: fluid tank relief valve
fo-war-quotas-pieces=NPCs: module quotas follow the machines built

[mod-setting-description]
fo-war-barils=When on, the stock of each fluid the factions judge (shortage, net need, obtainable fluid) counts the full barrels in their chest: 50 fluid units per barrel, read from the game's fill and empty recipes. When off, a fluid has no stock. The [FO-BARILS] journal line states the counted units when they change.
fo-war-soupape=When on, if the tank of a fluid produced by a finished site (refinery, chemical plants) stays above 90% full for 5 measures in a row (every 30 seconds) while no machine of the site consumes it, a surplus recipe (fluid to item, for example solid fuel) takes fluid from the tank, at most what its machine does in the elapsed time, and puts the items in the site's output chest while it has room. The upstream chain starts again. When off, a full tank stops the chain. The [FO-SOUPAPE] journal line states the opening, each conversion and the closing.
fo-war-quotas-pieces=When on, the input and output quotas of a build-plan module (chest sizes, ingredients carried by the NPCs) are recomputed when machines of the module are missing: the flow taken into account is the nominal flow times the share of machines built. When off, the quota always follows the template's nominal flow. The [FO-QUOTAS] journal line states each recomputation.
