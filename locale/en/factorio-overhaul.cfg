[mod-setting-description]
fo-debug-render=Shows each agent's state and draws its paths on the ground.
fo-companion-steer-period=How often (in ticks) a moving agent corrects its heading. 1 = every tick (most expensive).
fo-companion-brain-period=How often (in ticks) an agent makes a decision.
fo-path-max-inflight=Maximum number of this mod's pathfinding requests in flight. The engine accepts only 10 new requests per tick, biters included.

