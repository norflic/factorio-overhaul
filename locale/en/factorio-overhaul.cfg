[technology-description]
fo-tungsten-processing=Smelting tungsten (ore mined with electric drills).
fo-methane-processing=Cracking methane into petroleum gas. Methane also fuels flamethrowers (+50% stream damage).
fo-heavy-weapons=Next-generation ammunition, turrets and walls.
fo-siege-weapons=Cannon turret, mortar, grenade launcher and their ammunition.
fo-arc-and-acid=Arc turret, acid sprayer and arc gun.
fo-railgun=Railgun and tungsten slugs.

