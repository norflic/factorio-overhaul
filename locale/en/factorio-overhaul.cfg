[item-description]
fo-tungsten-ore=Hard ore: only electric mining drills can extract it.
fo-tungsten-plate=Dense metal for armor-piercing ammo, armored walls and productivity modules.
fo-resonance-crystal=Exotic fuel: +50% acceleration and +30% top speed for vehicles.
fo-tungsten-rounds-magazine=Pierces the armor of armored biters.
fo-explosive-rounds-magazine=Every round explodes (area damage).
fo-incendiary-rounds-magazine=Sets targets on fire. Useless against pyro biters.
fo-plasma-rounds-magazine=Physical and laser damage: partly ignores armor.
fo-heavy-machine-gun=Double fire rate, range 22. Slows its wielder more.
fo-mortar-shell=Mortar ammunition. Area explosion.
fo-tungsten-cannon-shell=Piercing shell: goes through several targets.
fo-launcher-grenade=Grenade fired by the grenade launcher.
fo-rail-slug=Magnetic tungsten slug: pierces everything over 40 tiles.
fo-arc-cell=Charged battery for the arc gun.
fo-grenade-launcher=Lobs grenades up to 24 tiles.
fo-railgun=A slow shot that pierces a whole line of enemies.
fo-arc-gun=Short-range electric arc that hits a group.

