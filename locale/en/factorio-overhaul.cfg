[entity-description]
fo-team-chest=Place it near your base: your companions become workers that mine, craft and build with its contents.
fo-companion=Autonomous companion (R&D prototype).
fo-faction-hq=Headquarters of an AI faction. Destroying it wipes the faction out.
fo-heavy-gun-turret=3×3 turret: range 24, fire rate and damage ×1.5.
fo-heavy-laser-turret=3×3 laser turret: range 32, damage ×2. Very power hungry.
fo-reinforced-wall=3.4× sturdier than a stone wall.
fo-armored-wall=10× sturdier than a stone wall, insulated against electricity.
fo-cannon-turret=Fires tank shells up to 32 tiles. Heavy, slow hits: the answer to armored biters.
fo-mortar-turret=Lobbed shells up to 46 tiles, area explosion. Blind under 14 tiles: keep it protected.
fo-tesla-turret=An electric arc that strikes every enemy around the target. Deadly against swarms, nearly useless against storm biters.
fo-acid-sprayer=Sulfuric acid jet: corrodes and slows. Pyro biters, immune to fire, cannot resist it.
fo-command-center=The town hall of your base. Its level caps every building's level (2 × command center level). To raise it, every building family you own needs one building at the epoch's top level. Upgrades are instant and draw from its storage first: feed it with your factory.

