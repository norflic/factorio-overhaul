[mod-setting-name]
fo-war-fonderie-tapis=Teams: belt-fed field smelters (coal by belt)

[mod-setting-description]
fo-war-fonderie-tapis=The smelters of the teams' ore fields are belt-fed columns: one ore lane and one coal lane, one inserter per furnace, plates on a belt to a row of chests at the end. Coal arrives by belt from drills placed on the nearest coal patch, using underground belts only once research has unlocked them. No more coal chests to fill between two furnaces (unless no coal is reachable: one chest at the head of the column). A game created before this version keeps the old chest-fed smelters.
