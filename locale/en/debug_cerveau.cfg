[shortcut-name]
fo-dbg-cerveau=“Brain” view (AI decisions)

[shortcut-description]
fo-dbg-cerveau=Shows on the map and in a panel the zones a team's brain manages, their real state, what the AI knows about them and its decisions.

[controls]
fo-dbg-cerveau=“Brain” view (open or close)

[mod-setting-name]
fo-dbg-cerveau-textes=Brain view: texts on the map
fo-dbg-cerveau-ecarts-seuls=Brain view: only zones with a gap

[mod-setting-description]
fo-dbg-cerveau-textes=Writes above each zone on the map the production, the measured and target rate, the stop cause and what the AI knows about it.
fo-dbg-cerveau-ecarts-seuls=Draws only the zones where the AI is wrong, has not re-read them for a long time or never reads them.

