am-note-niveau=Chosen per building family (Capital), never per zone: the brain does not say which zone will be upgraded first.
am-note-tapis=A finished drill line whose belt saturates moves to the next unlocked belt, replaced in place.
am-note-machine=What is often done by hand is given to a machine, per product (automation).
am-note-liaison=Only from one module to another: the input dock is linked to the output chest of the same item.
am-note-charbon_tapis=Today a zone's coal is carried by the NPCs (refuel task). No rule replaces it with a belt coming from a drill.
am-note-bras_repartiteur=The splitter is only placed when some templates are built. No rule replaces an inserter with a splitter.
