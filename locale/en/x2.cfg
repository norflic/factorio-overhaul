fo-cryostat=Vacuum-insulated titanium vessel: it keeps liquid nitrogen around a coil.
fo-superconductors=Monazite from the black sands: concentrate, leaching, solvent extraction, yttrium, superconducting tape, coil. Also unlocks the cryogenic unit, the extraction column, the sintering furnace, the coil winder and water electrolysis.
