[item-description]
fo-monazite-ore=Honey and red-brown monazite grains mixed with magnetite. Concentrated before leaching.
fo-monazite-concentrate=8 monazite ores. Leached with sulfuric acid.
fo-rare-earth-concentrate=Rare earths dissolved out of monazite. Separated by solvent.
fo-thorium-oxide=By-product of monazite leaching. Fuel of the molten salt reactor (not in the game yet): store it.
fo-neodymium=By-product of solvent extraction. Used for permanent magnets.
fo-yttrium=The rare earth of superconducting tape.
fo-superconducting-tape=Yttrium barium copper oxide tape.
fo-permanent-magnet=Neodymium iron magnet.
fo-cryostat=Vacuum-insulated vessel. TEMPORARY DEVIATION: plastic replaces the scenario's biopolymer (age 8, not in the game yet).
fo-superconducting-coil=Age 12 (Superconductors) material: it pays for that age's levels.

