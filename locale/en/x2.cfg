[entity-description]
fo-monazite=Heavy sand of the black sands, rich in rare earths and thorium. Every drill can mine it.
fo-cryogenic-unit=Distills air into liquid nitrogen and liquid oxygen. Placeholder look (tinted vanilla refinery) until its model is made; no levels for now.
fo-extraction-column=Separates rare earths by solvent: neodymium and yttrium. Placeholder look (tinted vanilla chemical plant) until its model is made; no levels for now.
fo-sintering-furnace=Sinters superconducting tape and permanent magnets. Placeholder look (tinted vanilla assembler) until its model is made; no levels for now.
fo-coil-winder=Winds superconducting tape into coils. Placeholder look (tinted, scaled-down vanilla assembler) until its model is made; no levels for now.

