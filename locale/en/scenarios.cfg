codex-1=Day 1. The Ark-5 is a wreck; its core still holds. The onboard gravimeters show anomalies nothing can explain: did the crash damage them?
codex-2=Four beacons answer on the Convoy frequency. The other crews survived, and they are arming.
codex-3=The heat balance does not close: Erebus radiates more heat than its star gives it. Something heats the planet from below.
codex-4=Erebus oil is young: it is still forming, a few kilometres beneath our feet. The Ark's geologists refuse to believe it.
codex-5=The geothermal flux is forty times too strong. The mantle is heated from within, as if by a heart.
codex-6=Magnetic storms do not follow the winds: they follow the gravimetric anomalies. Our grids attract them.
codex-7=The crystals sing with no source. The Azure League publishes a hypothesis: Erebus is crossing a dark matter caustic.
codex-8=Erebus life breathes the methane exhaled by a heated subsoil. Everything here feeds on the same heat.
codex-9=Irradiated copper emits positrons: we have trapped our first speck of antimatter. The Scarlet Order already sees a weapon in it.
codex-10=An etched crystal lattice oscillates with no power: a time crystal. The Amber Dynasty sees eternity in it.
codex-11=The breccia inclusions are far too dense: strange matter, from a meteorite something pulled in. The Emerald Consortium wants to transmute everything.
codex-12=The haloscope finally detects the axion field. The Caustic has a tide, and that tide follows the rotation of the core.
codex-13=Antimatter in bulk, strangelets in vats: the Caustic tolerates only one great disturbance. A doctrine must be chosen: the Oath.
codex-14=The Ark's orbital archives finally speak: the Convoy came to anchor a Gate on the black hole at the Core. Without it, no one goes home.
codex-15=The Core awakens. Rifts open across the plain, guarded by nests no one has ever seen. The Gate is built here, or nowhere.
threat-1=small biters; the factions give you a grace period.
threat-2=first faction patrols around the base.
threat-3=bigger biter raids, drawn by the pollution of steam.
threat-4=first organised faction attacks (Normal); isolated oil outposts are targeted.
threat-5=armored and igneous biters in the ash: ordinary bullets bounce off, bring tungsten.
threat-6=storm biters, drawn by electric grids.
threat-7=reinforced storm biters; the Azure League covets the crystal flats.
threat-8=swamp broods that multiply fast; the swamp is poisonous.
threat-9=the Scarlet Order seeks the ultimate weapon.
threat-10=better armed faction troopers.
threat-11=family nests farther out and bigger around the craters.
threat-12=the factions catch up with your epoch, depending on difficulty.
threat-13=the sworn rival of your doctrine attacks more.
threat-14=meteor showers; the factions race to the Gate.
threat-15=the Core Tide: the final siege.
act-1=Survive
act-2=The planet is wrong
act-3=Taming the new physics
act-4=The truth and the Gate
