[mod-setting-name]
fo-war-echelon=NPC: scale factories

[mod-setting-description]
fo-war-echelon=The module that makes an item other construction sites are short of is served first at the reserve (it needed that very item to be built and queued behind every older site), and a site that has waited more than 2 minutes for an item becomes a demand for machine production, without waiting for three hand-crafting episodes. On by default. Turning it off restores the old rules.
