[mod-setting-name]
fo-war-mega-fonderie=Teams: mega-smelters (ore bus and smelting blocks)

[mod-setting-description]
fo-war-mega-fonderie=On an ore patch large enough to fill at least two belt lines, teams (factions and your team) decide a mega-smelter: bands of electric drills mining in bulk, a multi-line ore bus, and a rectangular block of furnaces dedicated to smelting, one column per bus line. The decision, its size (lines, columns, furnaces) and every refusal with its cause are written to the [FO-MEGA] log. This version only decides and sizes; placing the block will come next.
