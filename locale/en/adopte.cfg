[mod-setting-name]
fo-war-adopte=Team: adopt machines you place

[mod-setting-description]
fo-war-adopte=Your team's NPCs service the burner furnaces you place by hand, provided they are isolated (no inserter, belt or drill next to them) and close to the team chest: their smelting trips load, empty (plates go to the chest) and refuel them. A machine that later gets an inserter, belt or drill is given back to you. Nothing is ever demolished. Off: no more adoption.
