[mod-setting-name]
fo-war-ia3-marche=NPCs: nobody waits, nobody grabs (IA3-b)

[mod-setting-description]
fo-war-ia3-marche=The NPCs of the factions and of your team organise themselves: a free NPC takes the most useful task it can do, even outside its pole (the pole guides it, it no longer forbids it); a task that has been taken reserves its materials in the chest, nobody takes them away; when a plate is missing, several NPCs mine the ore and smelt it at the HQ. Read at the first think of each team.
