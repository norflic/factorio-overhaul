[mod-setting-name]
fo-war-sonde-30=Master plan: 30 x 30 ore probe
fo-war-sites-10=Factions: sites probed in 10 x 10 windows
fo-war-defrichage-prev=Master plan: preventive 50 x 50 clearing
fo-war-place-simple=Master plan: simple placement fallback

[mod-setting-description]
fo-war-sonde-30=When on, the area probed for ore around a lattice lot grows from 24 x 24 to 30 x 30 (the lattice itself does not change). A lot with no ore of its own but next to an ore field is no longer given to factories (assembler lines, mall, labs): it stays open to smelters and drills. The [FO-SONDE] log line names each lot on the edge of a field. On by default since 0.6.65.
fo-war-sites-10=When on, faction site prospecting also rereads, in 10 x 10 windows, a chunk that has fewer than 24 resource tiles: a field cut by the border of two chunks is kept. Whatever was found per chunk is still found. The [FO-SITES-10] log line names each field kept this way. On by default since 0.6.65.
fo-war-defrichage-prev=When on, a lot to clear near the HQ is cleared in advance over 50 x 50 (four quarters), one lot at a time per team, at the lowest priority of the board, under the heavy-work budget, never while a project is clearing. The lot is surveyed again at the end. The [FO-DEFRICHAGE-PREV] log line names each lot. On by default since 0.6.65.
fo-war-place-simple=When on, if the master plan finds no place for a module (drills and power plant excepted) in any lot it tries, it tries the smallest rule before growing the lattice: up to 6 lots in lattice spiral order, margin 0, no other option, same allowed lot states. The [FO-PLACE-SIMPLE] log line gives the outcome. On by default since 0.6.65.
