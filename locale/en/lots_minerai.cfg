[mod-setting-name]
fo-war-lots-minerai=Master plan: keep ore lots for ore

[mod-setting-description]
fo-war-lots-minerai=When on, a module without a resource (assembler line, mall, labs) no longer falls back to an ore lot of the lattice when no free lot takes it: the lattice grows instead. Smelters and drills keep their fallback onto ore. Off by default: the [FO-LOTS-MINERAI] log line first measures how many resource-less modules sit on ore.
