[technology-description]
fo-titanium-processing=Crater-field ilmenite and brine: concentrate, slag, chlorination, Kroll reduction, titanium plate. Also unlocks the coke oven, arc furnace, electrolyzer and ore concentrator.
fo-wet-tungsten=Caustic soda and hydrogen from brine dissolve tungsten ore: 4 plates for 5 ores.
