[entity-description]
fo-ilmenite=Titanium ore of the crater fields. Hard ore: only electric drills can mine it.
fo-brine=Brine from the crater floors: chlorine, caustic soda, magnesium. Never runs dry (at least 20 % yield).
fo-coke-oven=Bakes coal into coke. Placeholder visual (tinted vanilla assembler) until its model is made; no levels yet.
fo-arc-furnace=Smelts ilmenite concentrate and remelts titanium sponge. Placeholder visual (tinted, enlarged vanilla assembler) until its model is made; no levels yet.
fo-electrolyzer=Electrolyses brine and magnesium chloride. Placeholder visual (tinted vanilla chemical plant) until its model is made; no levels yet.
fo-ore-concentrator=Concentrates ilmenite ore (8 to 1). Placeholder visual (tinted, shrunk vanilla assembler) until its model is made; no levels yet.
fo-kroll-reactor=Reduces titanium tetrachloride with magnesium into titanium sponge. Placeholder visual (tinted, enlarged vanilla centrifuge) until its model is made; no levels yet.

