[item-description]
fo-ilmenite-ore=Black iron-titanium oxide with a cream leucoxene crust. Concentrate it before smelting.
fo-ilmenite-concentrate=8 ilmenite ores. Smelt it in an arc furnace with coke.
fo-titanium-slag=Titanium-rich slag. Chlorinate it in a chemical plant.
fo-titanium-sponge=Raw titanium from the Kroll reactor. Remelt it in an arc furnace.
fo-titanium-plate=Material of age 11 (Titanium): it pays for the levels of this age.
fo-caustic-soda=By-product of brine electrolysis. Used by hydrometallurgical tungsten.
fo-magnesium-chloride=By-product of brine and of the Kroll reactor. Electrolyses into magnesium and chlorine.
fo-magnesium=Reducing agent of the Kroll reactor, recycled in a loop.
fo-coke=Baked coal. Reducing agent for ilmenite smelting and chlorination; fuel.

