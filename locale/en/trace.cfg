[mod-setting-name]
fo-debug-trace-carte=Debug: faction decisions on the map

[mod-setting-description]
fo-debug-trace-carte=Also places the factions' map tags on YOUR map: one per module decided or built (product icon, rank, reason), at most 12 per faction, oldest removed. Your team's tags are always on your map. Off by default; turning it off removes these copies at the next decision.
