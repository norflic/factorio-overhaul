[fo-mm]
module-desc-speed=Modules in the same machine MULTIPLY: speed × (1 + bonus) per module, energy × (1 + 60 % of the bonus) per module, up to the game cap (× 328.67). At the cap, energy only pays for the useful part of the modules: it stays below the gain.
module-desc-productivity=Modules in the same machine MULTIPLY: productivity × (1 + bonus) per module, energy × (1 + 60 % of the bonus) per module, speed × (1 + penalty), up to the game cap (× 328.67).
module-desc-effectivity=Modules in the same machine MULTIPLY speed, energy and productivity, up to the game cap (× 328.67); energy never goes below 20 %.
effect-speed=speed
effect-consumption=energy
effect-productivity=productivity
complement-name=Hidden complement (__1__, __2__ hundredths)
complement-desc=Internal module of the multiplicative rule: never in an inventory.
beacon-name=Complement beacon (hidden)
beacon-desc=Internal entity: carries, for one machine, the gap between the product of its modules and their sum.
panel-title=Modules (multiplied)
panel-speed=Speed: × __1__.__2__ (__3__)
panel-energy=Energy: × __1__.__2__ (__3__)
panel-prod-add=Productivity: __1__ % (added)
panel-prod-mult=Productivity: __1__ % (multiplied)
panel-cap=Game cap reached: × 328.67
panel-cap-gap=Game cap reached: × 328.67. Energy only pays for the useful part of the modules (the gap is kept).
panel-note=Computed from the machine's own modules. Beacons placed around it add their effects on top.
panel-tooltip=__1__ module(s) in the machine; each module multiplies speed, energy and productivity.
