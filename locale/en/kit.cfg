[mod-setting-name]
fo-war-kit-genereux=Factions: generous starting kit (tests)

[mod-setting-description]
fo-war-kit-genereux=Off (default): a faction starts with the same kit as your team (empty chest, no furnace, only armed workers) and gathers everything else itself. On: the old generous kit (12 drills, 8 furnaces, 4 chests, 150 coal, 200 iron plates, 60 copper, 80 stone, 40 magazines), for tests. Read when a HQ is founded: no effect on a game in progress.
