[technology-description]
fo-perimeter-barrier=Short-field electric posts that ring a base: an enemy crossing the line is struck and slowed. Requires the Bastion IV plasma artillery and superconductors.
fo-bastion-1=First turret of the Bastion line: a steel machine gun fed with magazines (age 1).
fo-bastion-2=The Bastion line changes mode: a focused laser beam, powered by the grid (age 2).
fo-bastion-3=The Bastion line changes mode: electric arcs that jump from target to target (age 3).
fo-bastion-4=The Bastion line changes mode: area plasma artillery, the last technology of age 4.
fo-singularity-launcher=Singularity launcher and its charges: a field that holds and eats enemies.
fo-field-projector=Field projector (armor equipment) and its remote: repulsive wave and ring of plasma flames.
fo-orbital-strike=Orbital strike beacon: the cataclysmic weapon, locked behind the last technology of age 4.
