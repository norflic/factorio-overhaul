fo-singularity-launcher=Singularity launcher
fo-singularity-charge=Singularity charge
fo-field-projector=Field projector
fo-field-projector-remote=Field projector remote
fo-orbital-strike=Orbital strike beacon

[item-description]
fo-singularity-launcher=Fires a charge that opens a singularity field: enemies caught in the field are held (speed down to 15%) and eaten by electric damage for 6 seconds. The field holds, it does not pull.
fo-singularity-charge=Charge for the singularity launcher: resonance crystal and battery. One per shot.
fo-field-projector=Active defense equipment (armor grid). Triggered by its remote: a wave that pushes back and slows every enemy within 9 tiles, then a ring of plasma flames around the wearer for 8 seconds. Beware: the ring burns anyone who walks into it.
fo-field-projector-remote=Triggers every field projector of the worn armor.
fo-orbital-strike=Cataclysmic weapon. Throws a beacon at the targeted position; three seconds later the orbital strike falls: flash, scorch and three damage circles (8, 16 and 24 tiles). Spares your own force. One every ten seconds.

