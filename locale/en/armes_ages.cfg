[entity-description]
fo-perimeter-barrier=Age 4, perimeter weapon: a one-tile electric post that discharges an arc on any enemy crossing its field (3.5 tiles): area electric damage and a 35% slowdown. Without power the barrier is off. A line of posts at most 5 tiles apart makes a continuous enclosure.
fo-bastion-1=Age 1, kinetic fire: steel machine gun fed with magazines, range 20, fire rate and damage ×1.25. The first mode of the Bastion line.
fo-bastion-2=Age 2, focused laser: continuous cyan beam, range 28, damage ×3 for 1.2 MJ per shot. The attack mode changes: no more ammunition, energy instead.
fo-bastion-3=Age 3, chain arcs: the arc strikes the target, jumps to its neighbours (60%), then to their neighbours (35%). Deadly against swarms.
fo-bastion-4=Age 4, plasma artillery: a guided orb that explodes in an area (radius 5), range 36, 6-tile dead zone, 6 MJ per shot. The siege mode of the line.

