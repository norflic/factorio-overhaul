[fo-robots]
placed-refused=Kit refusé : le plafond d'armée est atteint (ou les robots sont éteints). Kit rendu : __1__.
name-steam-trotter=Trotte-Vapeur
unit-name=__1__ (robot)
unit-desc=Robot « __1__ » (âge __2__) : __3__.
alert-loss=Robot perdu : __1__
loss-summary=Pertes de robots : __1__, vers (__2__, __3__).
chosen=Robots choisis : __1__.
chosen-none=Aucun robot dans la zone : sélection vidée.
none-chosen=Aucun robot choisi : glissez d'abord (bouton gauche) autour de vos robots.
ordered-attack=Marche-attaque : __1__ robot(s) en route.
ordered-move=Déplacement : __1__ robot(s) en route.
rally-set=Ralliement de l'atelier fixé en (__1__, __2__).
desc-steam-trotter=Robot « Trotte-Vapeur » (âge 3) : un automate à quatre pattes et chaudière ronde, assaut léger.
name-scalehide=Écaille
desc-scalehide=Robot « Écaille » (âge 5) : une carapace inclinée aux fissures de braise, assaut lourd et lent.
name-coiler=Bobineur
desc-coiler=Robot « Bobineur » (âge 6) : des isolateurs et un arc électrique : tir en zone contre les essaims.
name-needle=Aiguille
desc-needle=Robot « Aiguille » (âge 7) : un trépied à pointe de cristal : tireur à longue portée (36 tuiles).
name-bellwether=Cloche
desc-bellwether=Robot « Cloche » (âge 8) : des bulbes de verre : ne tire pas, soigne en impulsion tous les robots alentour (rayon 12, 30 au plus).
name-mender=Rafistoleur
desc-mender=Variante « Rafistoleur » (âge 4) : une petite Cloche d'atelier : ne tire pas, soigne en impulsion les robots tout proches (rayon 8, 6 au plus).
name-skitter=Furet
desc-skitter=Variante « Furet » (âge 5) : un Trotte-Vapeur allégé : éclaireur rapide (0,22 tuile par tick), tir serré à 22 tuiles, peu de blindage.
name-lancer=Perce-Blindage
desc-lancer=Variante « Perce-Blindage » (âge 8) : une Aiguille alourdie : un coup physique lourd et lent à 42 tuiles, qui use moins la résistance des carapaces blindées qu'une rafale.
name-chamfer=Chanfrein
desc-chamfer=Robot « Chanfrein » (âge 9) : une caisse octogonale et un mortier : artillerie en zone, portée 45, tir impossible à moins de 12 tuiles.
name-trowel=Truelle
desc-trowel=Robot « Truelle » (âge 10) : un dôme et un bras outil : tire, ravive les fantômes de construction à 20 tuiles et répare les bâtiments.
name-finback=Aileron
desc-finback=Robot « Aileron » (âge 11) : une flèche blanche : assaut rapide.
name-levite=Lévite
desc-levite=Robot « Lévite » (âge 12) : un corps sur deux anneaux flottants : assaut lourd (il marche : l'essai RB0 E5 a montré qu'un masque réduit traverse aussi les murs).
name-toroid=Torique
desc-toroid=Robot « Torique » (âge 13) : un géant à six pattes, sphère et tore : expérimental d'assaut, portée 100.
name-heliast=Héliaste
desc-heliast=Robot « Héliaste » (âge 14) : un géant à ailes dorées et parabole : expérimental d'artillerie, tir en zone, portée 100.
name-crowned=Couronné
desc-crowned=Robot « Couronné » (âge 15) : un géant à base flottante et couronne : expérimental final, portée 100.
heal-pulse=Soin : __1__ robot(s) soigné(s)

