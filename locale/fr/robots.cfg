[item-description]
fo-robot-kit-steam-trotter=Pièces d'un robot « Trotte-Vapeur » (âge 3). Le balayage des usines en fait un robot dès qu'il reste de la place sous le plafond d'armée ; sinon le kit attend dans la sortie de la machine, qui s'arrête d'elle-même.
fo-robot-order=Glisser (bouton gauche) : choisir vos robots. Maj + glisser : marche-attaque des robots choisis vers la zone. Glisser avec le bouton droit : attaquer ce qui est encadré. Maj + bouton droit : aller à la zone. Un simple clic donne une petite zone.
fo-robot-rally=Cliquez ou glissez : le centre de la zone devient le point de ralliement de l'atelier ouvert. L'outil est ensuite rendu.
fo-robot-kit-scalehide=Pièces d'un robot « Écaille » (âge 5). Le balayage des usines en fait un robot dès qu'il reste de la place sous le plafond d'armée ; sinon le kit attend dans la sortie de la machine, qui s'arrête d'elle-même.
