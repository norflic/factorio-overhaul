[fo-robots]
name-steam-trotter=Trotte-Vapeur
unit-name=__1__ (robot, visuel provisoire)
unit-desc=Robot terrestre « __1__ » (âge 3) : un automate à quatre pattes, chaudière ronde, qui obéit à son propriétaire. Visuel PROVISOIRE : il reprend le corps du cracheur vanilla en gris acier jusqu'au lot de dessin des robots.

[item-subgroup-name]
fo-robots=Robots

[ammo-category-name]
fo-robot=Armes des robots

[entity-name]
fo-robot-workshop=Atelier d'automates

[entity-description]
fo-robot-workshop=Fabrique des KITS de robots de l'âge 3 (le Trotte-Vapeur) ; chaque kit devient un robot près de la machine, tant qu'il reste des points d'armée (plafond : 12 + 6 × l'âge de votre centre). Un coffre et un bras par ingrédient, jamais de coffre mixte. Visuel provisoire (assembleur teinté). Les modules de productivité sont refusés : le kit tient une case.

[item-name]
fo-robot-workshop=Atelier d'automates
fo-robot-kit-steam-trotter=Kit de Trotte-Vapeur

[item-description]
fo-robot-kit-steam-trotter=Pièces d'un Trotte-Vapeur. Le balayage des ateliers en fait un robot dès qu'il reste de la place sous le plafond d'armée ; sinon le kit attend dans la sortie de la machine, qui s'arrête d'elle-même.

[technology-name]
fo-robot-automata=Automates à vapeur

[technology-description]
fo-robot-automata=Débloque l'atelier d'automates et le Trotte-Vapeur, premier robot du mod (âge 3). Visuel provisoire.

[mod-setting-name]
fo-war-robots=Robots : fabriquer et commander
fo-war-robots-cap=Robots : plafond d'armée (points)

[mod-setting-description]
fo-war-robots=Allumé : les ateliers de robots transforment leurs kits en robots tant qu'il reste des points d'armée, et les ordres du joueur sont servis. Éteint : aucun robot n'est créé ni commandé (un kit reste dans la sortie de la machine, qui s'arrête) ; les robots déjà créés restent.
fo-war-robots-cap=Plafond d'armée de robots, en points, par force (petit robot 1, moyen 2, grand 4, géant 12). 0 = automatique : 12 + 6 × l'âge du centre de commandement (30 à l'âge 3, 102 à l'âge 15). Un robot mort libère ses points.
