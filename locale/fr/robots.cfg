[technology-description]
fo-robot-automata=Débloque l'atelier d'automates et le Trotte-Vapeur, premier robot du mod (âge 3).
fo-robot-heavy=Débloque l'Écaille, robot d'assaut lourd (âge 5).
fo-robot-coil=Débloque le Bobineur, robot de tir en zone contre les essaims (âge 6).
fo-robot-bay=Débloque le hall de montage et l'Aiguille, tireur à longue portée (âge 7).
fo-robot-bellwether=Débloque la Cloche, qui soigne les robots alentour (âge 8).
fo-robot-mender=Débloque le Rafistoleur, petit soigneur de l'atelier (âge 4).
fo-robot-skitter=Débloque le Furet, éclaireur rapide de l'atelier (âge 5).
fo-robot-lancer=Débloque le Perce-Blindage, tireur lourd anti-blindé du hall (âge 8).
fo-robot-mortar=Débloque le Chanfrein, artillerie en zone à portée 45 (âge 9).
fo-robot-dock=Débloque le dock de pilotage et la Truelle, robot ingénieur (âge 10).
fo-robot-finback=Débloque l'Aileron, robot d'assaut rapide (âge 11).
fo-robot-levite=Débloque le Lévite, robot d'assaut lourd (âge 12).
fo-robot-gantry=Débloque le portique, les segments et le Torique, premier géant (âge 13).
fo-robot-gantry-heliast=Débloque l'Héliaste, géant d'artillerie (âge 14).
fo-robot-gantry-crowned=Débloque le Couronné, géant final (âge 15).
fo-servo-mechanisms=Débloque le servomoteur, le capteur optique et le contrôleur programmable (âge 7).
fo-robot-guidance=Débloque le noyau de pilotage (âge 10).
fo-magnetic-drive=Débloque l'actionneur à aimants, le barreau Nd:YAG et le module laser (âge 12).

[mod-setting-name]
fo-war-robots=Robots : fabriquer et commander
fo-war-robots-cap=Robots : plafond d'armée (points)

[mod-setting-description]
fo-war-robots=Allumé : les ateliers de robots transforment leurs kits en robots tant qu'il reste des points d'armée, et les ordres du joueur sont servis. Éteint : aucun robot n'est créé ni commandé (un kit reste dans la sortie de la machine, qui s'arrête) ; les robots déjà créés restent.
fo-war-robots-cap=Plafond d'armée de robots, en points, par force (petit robot 1, moyen 2, grand 4, géant 12). 0 = automatique : 12 + 6 × l'âge du centre de commandement (30 à l'âge 3, 102 à l'âge 15). Un robot mort libère ses points.

