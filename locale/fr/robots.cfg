[entity-description]
fo-robot-workshop=Fabrique les kits des robots des âges 3 à 6 (Trotte-Vapeur, Écaille, Bobineur) ; chaque kit devient un robot près de la machine, tant qu'il reste des points d'armée. 3 × 3, 2 modules. Un coffre et un bras par ingrédient, jamais de coffre mixte.
fo-robotics-bay=Fabrique les kits des robots des âges 7 à 9 (Aiguille, Cloche, Chanfrein). 5 × 5, 4 modules. Un coffre et un bras par ingrédient.
fo-robot-dock=Fabrique les kits des robots des âges 10 à 12 (Truelle, Aileron, Lévite) et les 10 segments de chaque géant. 7 × 7, 4 modules.
fo-robot-gantry=Assemble un géant : 10 segments du dock plus l'assemblage final (120 s). 11 × 11, 6 modules, 30 MW. Un géant à la fois par force aux âges 13, 14 et 15 : 1, 2 puis 3.

