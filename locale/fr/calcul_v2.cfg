[recipe-description]
fo-dc-chilled-water=Le refroidissement du centre : 10 eau glacée par seconde, rendues en eau chaude. Chaque baie de refroidissement évacue alors 2 000 kW.
fo-dc-liquid-nitrogen=Grand centre seulement : 5 azote liquide par seconde. Chaque baie de refroidissement évacue alors 5 000 kW.
fo-dc-dilution=Grand centre seulement : eau glacée et mélange à dilution. Seul ce refroidissement fait calculer les baies quantiques.

[technology-name]
fo-wafer-fab=Fonderie de tranches
fo-data-centers-2=Grands centres de calcul

[technology-description]
fo-wafer-fab=Une machine par étape : tireuse de cristal, scie à fil, graveur-dopeur à plasma, banc de découpe et test, mise en boîtier. Puces logiques, mémoire, cache et flash NAND.
fo-data-centers-2=Le grand centre de calcul (12 baies) et son refroidissement à l'azote liquide.

[item-limitation]
fo-baie=Une baie ne se pose que dans un centre de calcul, sur une recette de refroidissement.

