[item-description]
fo-silicon-ingot=Un seul cristal de silicium, tiré lentement du bain.
fo-exposed-wafer=Tranche couverte de résine, insolée à travers le photomasque : le motif reste à graver.
fo-nand-die=Puce de mémoire qui garde ses données sans courant.
fo-flash-drive=Des puces NAND sur une carte : le stockage des baies.
fo-optical-fiber=Du verre étiré en fil : la lumière y porte les données.
fo-network-switch=Relie les serveurs entre eux et au reste de la base.
fo-memory-rack=Baie de centre de calcul. Offre 4 parts de mémoire (un CPU en demande 1, un GPU 3). 300 kW, 300 kW de chaleur.
fo-storage-rack=Baie de centre de calcul. Relève le plafond interne du calcul de 600 unités/s (200 sans baie). 300 kW, 300 kW de chaleur.
fo-network-rack=Baie de centre de calcul. Relève l'export du calcul vers la force de 1 000 unités/s (300 sans baie). 200 kW, 200 kW de chaleur.
fo-cooling-rack=Baie de centre de calcul. Évacue 2 000 kW de chaleur quand le centre tourne à l'eau glacée (5 000 à l'azote liquide). 150 kW.
fo-quantum-rack=Baie de centre de calcul (âge 13). 2 000 unités/s, mais seulement au grand centre en refroidissement à dilution, et pilotée chacune par une baie CPU. 1 500 kW, 500 kW de chaleur.

