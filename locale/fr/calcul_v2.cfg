[entity-description]
fo-crystal-puller=Tire un lingot de silicium monocristallin d'un bain de silicium pur (procédé de Czochralski).
fo-wire-saw=Scie le lingot en tranches minces au fil diamanté, à l'eau et à la poudre de cristal.
fo-plasma-etcher=Grave et dope au plasma les tranches insolées : elles deviennent des puces encore soudées entre elles.
fo-die-prober=Découpe la tranche gravée et teste chaque puce : logique, DRAM, SRAM ou flash NAND.
fo-packaging-line=Met les puces en boîtier : processeurs et disques flash.
fo-smt-line=Pose les composants sur les cartes imprimées : cartes mères, barrettes, commutateurs, cartes graphiques.
fo-fiber-tower=Étire le verre en fibre optique.
fo-rack-integrator=Monte les BAIES du centre de calcul : CPU, mémoire, stockage, réseau, refroidissement, GPU, quantique.
fo-chiller=Refroidit l'eau en eau glacée pour les centres de calcul.
fo-cooling-tower=Rend à l'eau la chaleur des centres : l'eau chaude redevient de l'eau, 2 % s'évaporent.
fo-data-center=Centre de calcul MODULAIRE : posez-y des baies (6 emplacements). CPU et GPU calculent, la mémoire les nourrit, le stockage et le réseau plafonnent ce qui sort, le refroidissement évacue la chaleur. Il lui faut de l'eau glacée (rendue en eau chaude) et du courant pour chaque baie. Le calcul ne se stocke pas : il accélère la recherche de votre force.
fo-data-center-2=Grand centre de calcul : 12 emplacements de baies, refroidissement passif doublé, azote liquide (âge 12) et dilution pour les baies quantiques (âge 13).
fo-dilution-fridge=Mélange l'hélium-3 et l'hélium-4 refroidi à l'azote : le froid des qubits.
fo-quantum-lab=Fabrique les puces à qubits et les processeurs quantiques.
fo-data-center-power=Courant tiré par les baies d'un centre de calcul.

