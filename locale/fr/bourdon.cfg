[entity-name]
fo-bourdon=Le Bourdon
fo-bourdon-flamme=Flamme du Glas

[item-description]
fo-bourdon-item=Le Bourdon, fabriqué au Portique des expérimentaux (âge 15). Posez-le là où il doit descendre : il compte pour un géant au plafond (1, 2 puis 3 aux âges 13, 14, 15). Plafond atteint ou robots éteints : il est rendu. La télécommande remise en main lui donne ses ordres ; Ctrl + Maj + G le fait sonner.

[technology-name]
fo-robot-bourdon=Le Bourdon

[technology-description]
fo-robot-bourdon=Cloche-cathédrale en lévitation : l'expérimental de l'âge 15, fabriqué au Portique des expérimentaux. Il sonne Le Glas, une onde de choc qui couche tout ce qui lui est hostile.

[entity-description]
fo-bourdon=Cloche-cathédrale en lévitation, âge 15. Elle sonne Le Glas : une onde de choc qui couche tout ce qui lui est hostile.

[controls]
fo-bourdon-glas=Le Bourdon : sonner Le Glas vers le curseur

[fo-bourdon]
aide=DÉMONSTRATION : fait descendre Le Bourdon près de vous (gratuit), puis le rappelle. « retirer » le renvoie. Il obéit à la télécommande remise en main.
aide-glas=DÉMONSTRATION : Le Bourdon sonne Le Glas vers ce que vise le curseur, sinon vers l'ennemi le plus proche ; trop loin, il y va d'abord.
demo=DÉMONSTRATION : Le Bourdon descend (gratuit, pas de la production). La télécommande en main lui donne ses ordres ; /fo-glas ou Ctrl + Maj + G le fait sonner.
vient=Le Bourdon lève ses ancres et vient.
retire=Le Bourdon remonte.
impossible=Le Bourdon ne peut pas descendre ici.
absent=Pas de Bourdon : /fo-bourdon le fait descendre.
route=Le Bourdon part : il sonnera en arrivant.
sonne=Le Glas : le battant recule.
sonne-seul=Le Glas, sans cible : le battant recule.
recharge=Le Bourdon résonne encore : __1__ s.
pose=Le Bourdon descend. La télécommande en main lui donne ses ordres ; Ctrl + Maj + G le fait sonner.
refuse=Le Bourdon ne descend pas : le plafond de géants est atteint (ou les robots sont éteints). Objet rendu.
