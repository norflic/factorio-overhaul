[technology-description]
fo-coking=Âge 2 (Forge) : le four à coke cuit le charbon en coke.
fo-blast-furnace=Âge 2 (Forge) : l'acier au coke, plus économe en fer ; son laitier se tasse en remblai.
fo-crushing=Âge 2 (Forge) : le concasseur fait du sable et du ciment de laitier.
fo-cement-concrete=Âge 3 (Vapeur) : du béton sans minerai de fer.
fo-arc-smelting=Âge 6 (Électricité) : le four à arc, le graphite et l'acier électrique.
fo-electrical-steel=Âge 6 (Électricité) : tôle magnétique, fil émaillé, bobine et moteur électrique bobiné.
fo-titanium-alloys=Âge 11 (Titane) : la plaque de titane fait du composite, et le composite des structures basse densité.
fo-glassworks=Âge 3 (Vapeur) : le sable fondu donne du verre, et le verre des manomètres.
fo-flaring=Âge 4 (Pétrole) : la torchère brûle un fluide en trop pour qu'aucune usine ne se bloque.
fo-steam-cracking=Âge 4 (Pétrole) : le vapocraqueur fait de l'éthylène, et l'éthylène un plastique plus économe en gaz.
fo-brine-byproducts=Âge 11 (Titane) : l'hydrogène, la soude et le chlorure de magnésium de la saumure trouvent un usage (hydrocraquage, béton de Sorel) ; torchères des fluides de la saumure.

[fluid-name]
