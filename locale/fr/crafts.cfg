[recipe-description]
fo-blast-furnace-steel=Acier au coke : 4 fers au lieu de 5, et du laitier en plus.
fo-sand=Pierre concassée en sable.
fo-slag-cement=Le laitier du haut fourneau, concassé avec de la pierre.
fo-cement-concrete=10 bétons pour 4 ciments, 6 sables et de l'eau, sans minerai de fer.
fo-arc-steel=Acier au four à arc : 3 fers et 1 graphite pour 1 acier.
fo-wound-electric-engine=Une bobine remplace le lubrifiant : moteur électrique sans fluide (écart au scénario X0, où elle n'en remplaçait qu'un tiers).
fo-titanium-composite=PROVISOIRE : le biopolymère (âge 8) n'est pas encore en jeu, le plastique le remplace.
fo-titanium-lds=2 structures basse densité pour 1 composite et 4 cuivres.
fo-slag-landfill=Hors du scénario X0 : le laitier dont on n'a pas l'usage se tasse en remblai.
fo-sorel-concrete=Hors du scénario X0 : ciment d'oxychlorure de magnésium. Consomme le chlorure de magnésium et la soude que laisse la saumure.
fo-hydrocracking=Hors du scénario X0 : l'hydrogène de la saumure craque l'huile lourde mieux que l'eau.
fo-glass=4 sables fondus en 1 verre, dans n'importe quel four.
fo-steam-cracking=Gaz de pétrole et vapeur : éthylène.
fo-polyethylene=3 plastiques pour 20 éthylènes et 1 charbon (vanilla : 2 plastiques pour 20 gaz).
fo-flare-ethylene=Brûle 100 éthylènes sans rien produire.
fo-flare-hydrogen=Brûle 100 hydrogènes sans rien produire.
fo-flare-chlorine=Brûle 100 chlores sans rien produire.
fo-flare-brine=Brûle 100 saumures sans rien produire.
fo-flare-titanium-tetrachloride=Brûle 100 tétrachlorures sans rien produire.
fo-methane-reforming=50 méthanes et 100 vapeurs : 200 hydrogènes et 50 dioxydes de carbone.
fo-slag-carbonation=Le dioxyde de carbone du reformage carbonate le laitier en ciment.
fo-flare-carbon-dioxide=Brûle 100 dioxydes de carbone sans rien produire.
fo-metallurgical-silicon=4 sables et 1 graphite au four à arc.
fo-pure-silicon=2 siliciums métallurgiques purifiés par 30 hydrogènes.
fo-silicon-wafer=Un silicium pur scié en 4 tranches.
fo-cleanroom-processor=Une tranche remplace 10 circuits verts sur 20 (écart au scénario X0, qui donnait 2 processeurs : le processeur est la monnaie de l'âge 10).
fo-siemens-silicon=Scénario X3 : le chlore tourne en boucle (2 perdus par fabrication) ; moins de silicium métallurgique, plus d'hydrogène.
fo-iron-concentrate=8 minerais de fer pour 1 concentré.
fo-copper-concentrate=8 minerais de cuivre pour 1 concentré.
fo-tungsten-concentrate=8 minerais de tungstène pour 1 concentré.
fo-iron-plate-r8=Un concentré fondu au four à arc : une billette, soit 8 plaques.
fo-copper-plate-r8=Un concentré fondu au four à arc : une billette, soit 8 plaques.
fo-tungsten-plate-r8=Un concentré fondu au four à arc : une billette, soit 8 plaques.
fo-iron-plate-r8-unpacking=Une billette découpée en 8 plaques de fer.
fo-copper-plate-r8-unpacking=Une billette découpée en 8 plaques de cuivre.
fo-tungsten-plate-r8-unpacking=Une billette découpée en 8 plaques de tungstène.
fo-asphalt=10 huiles lourdes et 5 sables : 10 asphaltes.
fo-crystal-cutting=2 cristaux de résonance et de l'eau : 1 cristal taillé et 1 poudre.
fo-resonance-lens=1 cristal taillé et 2 verres.
fo-crystal-oscillator=1 poudre, 1 circuit et 2 fils émaillés : 2 oscillateurs.

