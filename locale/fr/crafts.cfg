[item-description]
fo-slag=Sous-produit du haut fourneau. Se concasse en ciment, ou se tasse en remblai.
fo-cement=Ciment de laitier. Fait du béton avec du sable et de l'eau.
fo-sand=Pierre concassée. Sert au béton au ciment et à la tôle magnétique.
fo-graphite=Coke recuit au four à arc. Sert à l'acier électrique et au composite titane.
fo-magnetic-steel=Acier au silicium des bobines.
fo-enameled-wire=Fil de cuivre isolé des bobines.
fo-coil=Cœur du moteur électrique bobiné.
fo-titanium-composite=Titane, graphite et liant : fait des structures basse densité.
fo-glass=Sable fondu au four. Sert aux manomètres.
fo-manometer=Mesure la pression des chaudières et des colonnes : torchère, vapocraqueur.
fo-metallurgical-silicon=Sable réduit au graphite dans le four à arc.
fo-pure-silicon=Silicium purifié à l'hydrogène (ou au chlore, procédé Siemens).
fo-silicon-wafer=Tranche de silicium pur : la salle blanche en fait des processeurs avec moitié moins de circuits verts.
fo-iron-concentrate=8 minerais de fer concentrés : le four à arc en fait une billette.
fo-copper-concentrate=8 minerais de cuivre concentrés : le four à arc en fait une billette.
fo-tungsten-concentrate=8 minerais de tungstène concentrés : le four à arc en fait une billette.
fo-iron-plate-r8=Vaut 8 plaques de fer : se découpe à la main ou en assembleur.
fo-copper-plate-r8=Vaut 8 plaques de cuivre : se découpe à la main ou en assembleur.
fo-tungsten-plate-r8=Vaut 8 plaques de tungstène : se découpe à la main ou en assembleur.
fo-asphalt=Sol d'huile lourde et de sable : on y marche vite (comme le béton) et les véhicules y roulent mieux.
fo-cut-crystal=Cristal de résonance taillé : fait les lentilles.
fo-crystal-powder=Sous-produit de la taille : fait les oscillateurs.
fo-resonance-lens=Cristal taillé serti dans le verre : sert à l'amplificateur de résonance.
fo-crystal-oscillator=Horloge à quartz de cristal : sert à l'amplificateur de résonance.

