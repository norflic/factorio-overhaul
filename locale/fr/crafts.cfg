[entity-description]
fo-blast-furnace=Fait l'acier au coke : 4 plaques de fer et 1 coke pour 1 acier, plus du laitier. Visuel provisoire (four en acier vanilla teinté et agrandi) en attendant son modèle ; sans niveaux pour l'instant.
fo-crusher=Concasse la pierre en sable et le laitier en ciment. Visuel provisoire (assembleur vanilla teinté et réduit) en attendant son modèle ; sans niveaux pour l'instant.
fo-coil-winder=Émaille le fil de cuivre et enroule les bobines. Visuel provisoire (assembleur vanilla teinté et réduit) en attendant son modèle ; sans niveaux pour l'instant.
fo-flare-stack=Brûle un fluide dont on n'a pas l'usage (choisir la recette du fluide). Visuel provisoire (assembleur vanilla teinté et réduit) en attendant son modèle ; sans niveaux.
fo-steam-cracker=Craque le gaz de pétrole à la vapeur en éthylène. Visuel provisoire (usine chimique vanilla teintée) en attendant son modèle ; sans niveaux pour l'instant.
fo-reformer=Reforme le méthane à la vapeur : beaucoup d'hydrogène et du dioxyde de carbone. Visuel provisoire (usine chimique vanilla teintée) en attendant son modèle ; sans niveaux pour l'instant.
fo-cleanroom=Fait les tranches de silicium et les processeurs. Visuel provisoire (assembleur vanilla teinté et agrandi) en attendant son modèle ; sans niveaux pour l'instant.

