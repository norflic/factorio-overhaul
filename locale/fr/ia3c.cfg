fo-war-ia3-cerveau=PNJ : cerveau par besoins (essai IA3-c)

[mod-setting-description]
fo-war-ia3-cerveau=Essai du nouveau cerveau des PNJ, pour les factions et votre équipe. Plus d'échelle d'objectifs : chaque équipe mène plusieurs projets en même temps selon ce qui lui MANQUE (il lui manque du fer : elle fabrique des fours, mine le fer à plusieurs et le fond ; elle ne ramasse plus la pierre ni le charbon qu'elle a en trop ; elle cherche ce qu'elle ne trouve pas). Les factions font la vraie recherche avec des laboratoires posés près de leur coffre, selon leur caractère. Lu par chaque équipe à sa première pensée. Éteint par défaut tant que l'essai n'est pas mesuré.

