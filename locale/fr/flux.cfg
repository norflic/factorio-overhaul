[mod-setting-name]
fo-war-barils=PNJ : fluides jugés sur leurs barils
fo-war-soupape=PNJ : soupape des cuves de fluide
fo-war-quotas-pieces=PNJ : quotas des modules selon les machines posées

[mod-setting-description]
fo-war-barils=Allumé, le stock de chaque fluide que les factions jugent (manque, besoin net, fluide obtenable) compte les barils pleins de leur coffre : 50 unités de fluide par baril, lues dans les recettes de remplissage et de vidage du jeu. Éteint, un fluide n'a pas de stock. La ligne [FO-BARILS] du journal dit les unités comptées quand elles changent.
fo-war-soupape=Allumé, quand la cuve d'un fluide produit par un site fini (raffinerie, usines chimiques) reste pleine à plus de 90 % pendant 5 mesures de suite (toutes les 30 secondes) sans qu'aucune machine du site ne le consomme, une recette de surplus (fluide vers objet, par exemple du carburant solide) en prend dans la cuve, au plus ce que sa machine fait dans le temps écoulé, et dépose les objets au coffre de sortie du site, tant qu'il a de la place. La chaîne amont repart. Éteint, la cuve pleine arrête la chaîne. La ligne [FO-SOUPAPE] du journal dit l'ouverture, chaque conversion et la fermeture.
fo-war-quotas-pieces=Allumé, les quotas d'entrée et de sortie d'un module du plan directeur (taille des coffres, ingrédients portés par les PNJ) sont recalculés quand des machines du module manquent : le débit pris en compte est le débit nominal multiplié par la part de machines posées. Éteint, le quota suit toujours le débit nominal du gabarit. La ligne [FO-QUOTAS] du journal dit chaque recalcul.
