[mod-setting-name]
fo-war-electrique=Équipes : passer à l'électrique dès que possible

[mod-setting-description]
fo-war-electrique=Dès qu'une centrale est finie et que la foreuse électrique et un poteau sont fabricables, les équipes ne posent plus de foreuse thermique (ni agrandissement, ni nouvel avant-poste ; seule exception : le charbon d'une centrale à l'arrêt). Les champs thermiques passent à l'électrique un champ entier à la fois, aussi vite que la marge de courant le permet, et la puissance des foreuses électriques prévues est demandée à la centrale avant leur pose. Éteint : comportement d'avant.
