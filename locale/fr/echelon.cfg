[mod-setting-name]
fo-war-echelon=PNJ : échelonner les usines

[mod-setting-description]
fo-war-echelon=Le module qui fabrique un objet dont des chantiers manquent passe d'abord à la réserve (il exigeait lui-même cet objet pour être bâti et attendait derrière tous les chantiers plus anciens), et un chantier qui attend un objet depuis plus de 2 minutes devient une demande de fabrication à la machine, sans attendre trois fabrications à la main. Allumé par défaut. L'éteindre rend les anciennes règles.
