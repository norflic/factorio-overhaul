[mod-setting-name]
fo-war-industrie=PNJ : industrialiser

[mod-setting-description]
fo-war-industrie=Les équipes de PNJ évaluent leur besoin (défense, reconstruction, recrues, ce que le planificateur consomme) et investissent tout le reste de leur stock, au lieu d'en garder un pourcentage sans raison ; votre équipe ne retient plus sa réserve de fer de croissance tant que ce besoin est couvert. Sous menace du QG, la règle d'avant s'applique. Un PNJ sans tâche mine ou rapporte près du QG plutôt que d'attendre, et le treillis grandit d'un coup vers un gisement éloigné. Allumé par défaut. L'éteindre en cours de partie rend les anciennes règles.
