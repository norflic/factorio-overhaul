[mod-setting-name]
fo-war-rangee-dyn=PNJ : rangées d'assembleurs qui grandissent

[mod-setting-description]
fo-war-rangee-dyn=Une rangée d'assembleurs posée par la capitalisation garde la place de sa taille maximale et grandit sur place quand la demande monte (mêmes tapis, même entrée, même sortie) au lieu d'ouvrir un nouvel îlot ; les câbles sortent sur les deux voies du tapis. Allumé par défaut. L'éteindre n'agit que sur les nouvelles rangées.
