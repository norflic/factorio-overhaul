[mod-setting-name]
fo-war-repli-place=Plan directeur : place de repli pour un module sans lot

[mod-setting-description]
fo-war-repli-place=Allumé, un module (fonderie, usine, laboratoires, foreuses) que le plan directeur ne peut poser dans aucun lot du treillis, alors que le treillis ne peut plus grandir, est posé dans une fenêtre libre et sûre près du QG ou de son gisement, au lieu d'être abandonné. Éteint : le projet est refusé comme avant. Allumé par défaut ; la ligne [FO-REPLI-PLACE] du journal donne la cause de l'échec du plan et la place trouvée.
