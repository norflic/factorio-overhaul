[entity-name]
fo-bastion-1=Bastion I : mitrailleuse
fo-bastion-2=Bastion II : laser focalisé
fo-bastion-3=Bastion III : arcs en chaîne
fo-bastion-4=Bastion IV : artillerie plasma

[entity-description]
fo-bastion-1=Âge 1, tir cinétique : mitrailleuse d'acier à chargeurs, portée 20, cadence et dégâts ×1,25. Le premier mode de la lignée Bastion.
fo-bastion-2=Âge 2, laser focalisé : faisceau cyan continu, portée 28, dégâts ×3 pour 1,2 MJ le tir. Le mode d'attaque change : plus de munitions, de l'énergie.
fo-bastion-3=Âge 3, arcs en chaîne : l'arc frappe la cible, saute sur ses voisins (60 %), puis sur les voisins de ceux-ci (35 %). Redoutable contre les nuées.
fo-bastion-4=Âge 4, artillerie plasma : orbe guidée qui explose en zone (rayon 5), portée 36, angle mort de 6 tuiles, 6 MJ le tir. Le mode de siège de la lignée.

[item-name]
fo-singularity-launcher=Lanceur de singularités
fo-singularity-charge=Charge de singularité
fo-field-projector=Projecteur de champ
fo-field-projector-remote=Télécommande du projecteur de champ
fo-orbital-strike=Balise de frappe orbitale

[item-description]
fo-singularity-launcher=Lance une charge qui ouvre un champ de singularité : les ennemis pris dans le champ sont retenus (vitesse à 15 %) et rongés par des dégâts électriques pendant 6 secondes. Le champ retient, il n'attire pas.
fo-singularity-charge=Charge du lanceur de singularités : cristal de résonance et batterie. Une seule par tir.
fo-field-projector=Équipement de défense active (grille d'armure). Déclenché par sa télécommande : onde qui repousse et ralentit tout ennemi à 9 tuiles, puis anneau de flammes plasma autour du porteur pendant 8 secondes. Attention : l'anneau brûle aussi qui y marche.
fo-field-projector-remote=Déclenche tous les projecteurs de champ de l'armure portée.
fo-orbital-strike=Arme cataclysmique. Lance une balise sur la position visée ; trois secondes plus tard, la frappe orbitale s'abat : flash, brûlure et trois cercles de dégâts (8, 16 et 24 tuiles). Épargne les siens. Une par dix secondes.

