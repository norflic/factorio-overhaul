[technology-description]
fo-bastion-1=Première tourelle de la lignée Bastion : mitrailleuse d'acier à chargeurs (âge 1).
fo-bastion-2=La lignée Bastion change de mode : faisceau laser focalisé, alimenté par le réseau (âge 2).
fo-bastion-3=La lignée Bastion change de mode : arcs électriques qui sautent de cible en cible (âge 3).
fo-bastion-4=La lignée Bastion change de mode : artillerie plasma à zone, dernière technologie de l'âge 4.
fo-singularity-launcher=Lanceur de singularités et ses charges : un champ qui retient et ronge les ennemis.
fo-field-projector=Projecteur de champ (équipement d'armure) et sa télécommande : onde répulsive et anneau de flammes plasma.
fo-orbital-strike=Balise de frappe orbitale : l'arme cataclysmique, verrouillée derrière la dernière technologie de l'âge 4.
