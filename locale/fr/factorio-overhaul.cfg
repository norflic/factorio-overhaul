[technology-description]
fo-tungsten-processing=Fonte du tungstène (minerai extrait aux foreuses électriques).
fo-methane-processing=Craquage du méthane en gaz de pétrole. Le méthane est aussi un carburant de lance-flammes (+50 % de dégâts du jet).
fo-heavy-weapons=Munitions, tourelles et murs de nouvelle génération.
fo-siege-weapons=Tourelle-canon, mortier, lance-grenades et leurs munitions.
fo-arc-and-acid=Tour à arc électrique, pulvérisateur d'acide et arc portatif.
fo-railgun=Fusil à rail et balles en tungstène.

