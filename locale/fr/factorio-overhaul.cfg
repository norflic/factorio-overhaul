[item-description]
fo-tungsten-ore=Minerai dur : seules les foreuses électriques peuvent l'extraire.
fo-tungsten-plate=Métal dense pour munitions perforantes, murs blindés et modules de productivité.
fo-resonance-crystal=Combustible exotique : +50 % d'accélération et +30 % de vitesse de pointe pour les véhicules.
fo-tungsten-rounds-magazine=Perfore le blindage des déchiqueteurs blindés.
fo-explosive-rounds-magazine=Chaque balle explose (dégâts de zone).
fo-incendiary-rounds-magazine=Enflamme la cible. Sans effet sur les déchiqueteurs ignés.
fo-plasma-rounds-magazine=Dégâts physiques et laser : ignore une partie du blindage.
fo-heavy-machine-gun=Cadence doublée, portée 22. Ralentit davantage son porteur.
fo-mortar-shell=Munition du mortier. Explosion de zone.
fo-tungsten-cannon-shell=Obus perforant : traverse plusieurs cibles.
fo-launcher-grenade=Grenade tirée par le lance-grenades.
fo-rail-slug=Projectile magnétique en tungstène : traverse tout sur 40 tuiles.
fo-arc-cell=Batterie chargée pour l'arc portatif.
fo-grenade-launcher=Tire des grenades à 24 tuiles, en cloche.
fo-railgun=Un tir lent qui transperce toute une ligne d'ennemis.
fo-arc-gun=Arc électrique à courte portée qui frappe un groupe.

