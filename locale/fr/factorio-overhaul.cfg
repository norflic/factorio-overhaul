[entity-description]
fo-team-chest=Posez-le près de votre base : vos compagnons deviennent des ouvriers qui exploitent, fabriquent et construisent avec son contenu.
fo-companion=Compagnon autonome (prototype de R&D).
fo-faction-hq=Quartier général d'une faction IA. Le détruire anéantit la faction.
fo-heavy-gun-turret=Tourelle 3×3 : portée 24, cadence et dégâts ×1,5.
fo-heavy-laser-turret=Tourelle laser 3×3 : portée 32, dégâts ×2. Très gourmande en énergie.
fo-reinforced-wall=Mur 3,4 fois plus résistant que le mur de pierre.
fo-armored-wall=Mur 10 fois plus résistant que le mur de pierre, isolé contre l'électricité.
fo-cannon-turret=Tire des obus de char à 32 tuiles. Coups lourds et lents : la réponse aux déchiqueteurs blindés.
fo-mortar-turret=Obus en cloche jusqu'à 46 tuiles, explosion de zone. Aveugle à moins de 14 tuiles : à protéger.
fo-tesla-turret=Arc électrique qui frappe tous les ennemis autour de la cible. Redoutable contre les nuées, presque inutile contre les foudroyants.
fo-acid-sprayer=Jet d'acide sulfurique : ronge et ralentit. Les déchiqueteurs ignés, immunisés au feu, n'y résistent pas.
fo-command-center=L'hôtel de ville de votre base. Son niveau plafonne celui de tous vos bâtiments (2 × le niveau du centre) et fixe le nombre d'ouvriers d'amélioration (1 à 5). Les améliorations puisent d'abord dans son stock : alimentez-le avec votre usine.

