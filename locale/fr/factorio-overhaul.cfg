fo-level-time-factor=Niveaux : durée des chantiers (×)

[mod-setting-description]
fo-debug-render=Affiche l'état de chaque agent et trace ses chemins au sol.
fo-companion-steer-period=Tous les combien de ticks un agent en mouvement corrige sa direction. 1 = chaque tick (le plus coûteux).
fo-companion-brain-period=Tous les combien de ticks un agent prend une décision.
fo-path-max-inflight=Nombre maximal de requêtes de pathfinding du mod en cours simultanément. Le moteur n'en accepte que 10 nouvelles par tick, biters compris.
fo-level-time-factor=Multiplie la durée des chantiers d'amélioration. 0 = instantané.

