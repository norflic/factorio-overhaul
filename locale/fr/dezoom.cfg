[controls]
fo-dezoom-down=Dézoomer au-delà de la molette (un cran de plus)
fo-dezoom-up=Remonter d'un cran (revient à la molette au cran 0)

[fo-dezoom]
cran=Dézoom étendu : cran __1__ sur __2__ (vue environ __3__ % de la limite de la molette)
normal=Dézoom étendu : terminé, la molette reprend la main
