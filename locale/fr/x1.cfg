[entity-description]
fo-ilmenite=Minerai de titane des champs de cratères. Minerai dur : seules les foreuses électriques l'extraient.
fo-brine=Saumure des fonds de cratère : chlore, soude, magnésium. Gisement inépuisable (au moins 20 % de rendement).
fo-coke-oven=Cuit le charbon en coke. Visuel provisoire (assembleur vanilla teinté) en attendant son modèle ; sans niveaux pour l'instant.
fo-arc-furnace=Fond le concentré d'ilménite et refond l'éponge de titane. Visuel provisoire (assembleur vanilla teinté et agrandi) en attendant son modèle ; sans niveaux pour l'instant.
fo-electrolyzer=Électrolyse la saumure et le chlorure de magnésium. Visuel provisoire (usine chimique vanilla teintée) en attendant son modèle ; sans niveaux pour l'instant.
fo-ore-concentrator=Concentre le minerai d'ilménite (8 pour 1). Visuel provisoire (assembleur vanilla teinté et réduit) en attendant son modèle ; sans niveaux pour l'instant.
fo-kroll-reactor=Réduit le tétrachlorure de titane par le magnésium : éponge de titane. Visuel provisoire (centrifugeuse vanilla teintée et agrandie) en attendant son modèle ; sans niveaux pour l'instant.

