[technology-description]
fo-titanium-processing=Ilménite des champs de cratères et saumure : concentré, laitier, chloration, réduction de Kroll, plaque de titane. Ouvre aussi le four à coke, le four à arc, l'électrolyseur et le concentrateur.
fo-wet-tungsten=La soude et l'hydrogène de la saumure dissolvent le minerai de tungstène : 4 plaques pour 5 minerais.
