[item-description]
fo-ilmenite-ore=Oxyde de fer et de titane, noir, à croûte crème de leucoxène. Se concentre avant la fusion.
fo-ilmenite-concentrate=8 minerais d'ilménite. Se fond au four à arc avec du coke.
fo-titanium-slag=Laitier riche en titane. Se chlore à l'usine chimique.
fo-titanium-sponge=Titane brut du réacteur de Kroll. Se refond au four à arc.
fo-titanium-plate=Matériau de l'âge 11 (Titane) : il paie les niveaux de cet âge.
fo-caustic-soda=Sous-produit de l'électrolyse de la saumure. Sert au tungstène par voie humide.
fo-magnesium-chloride=Sous-produit de la saumure et du réacteur de Kroll. S'électrolyse en magnésium et en chlore.
fo-magnesium=Réducteur du réacteur de Kroll, recyclé en boucle.
fo-coke=Charbon cuit. Réducteur de la fusion de l'ilménite et de la chloration ; combustible.

