[entity-description]
fo-titan-juggernaut=Titan allié de la famille des géants : Jaeger lourd bipède à pattes propulsées. Il ÉVOLUE avec l'âge de sa force : plaques de blindage, masse, points de vie, et une arme de plus par palier : griffes d'énergie (zone courte), canon rotatif à focalisation annulaire (palier 2), salve de zone des géants (palier 4), résonance : cadence doublée (palier 6). Il flotte : rien ne l'arrête.
fo-titan-sentinelle=Titan allié hexapode qui lévite sur ses tuyères, une singularité au cœur. Il ÉVOLUE avec l'âge de sa force : plaques, masse, points de vie, et une arme de plus par palier : rayon de singularité (dégâts de zone et ralentissement de tout ce qui bouge autour de lui), canon annulaire (palier 2), salve de zone des géants (palier 4), résonance : cadence doublée (palier 6).
fo-titan-leviathan=Titan allié serpentin qui flotte au-dessus du sol, vortex frontal et drones d'escorte en orbite. Il ÉVOLUE avec l'âge de sa force : plaques, masse, points de vie, et une arme de plus par palier : salve de drones (2 drones, 3 dès le palier 4), vortex frontal en canon (palier 3), salve de zone des géants (palier 5), résonance : cadence doublée (palier 6).
fo-titan-kaiju=Titan ennemi : reptile colossal cyber-organique aux épines de cristal. Son ère suit l'âge de la partie : plus lourd, plus blindé, plus lumineux ; morsure, puis griffes de zone (ère II), puis impulsion de la gueule-canon (ère III et plus).

[item-description]
fo-titan-juggernaut=Titan de l'âge 10 : 10 segments assemblés au Dock de pilotage. Plafond des géants. Posé au palier de l'âge de votre force, il évolue à chaque âge franchi. La télécommande vous est remise à la pose.
fo-titan-segment-juggernaut=Un dixième du Juggernaut, fabriqué au Dock de pilotage.
fo-titan-sentinelle=Titan de l'âge 11 : 10 segments assemblés au Dock de pilotage. Plafond des géants. Posée au palier de l'âge de votre force, elle évolue à chaque âge franchi. La télécommande vous est remise à la pose.
fo-titan-segment-sentinelle=Un dixième de la Sentinelle, fabriqué au Dock de pilotage.
fo-titan-leviathan=Titan de l'âge 12 : 10 segments assemblés au Dock de pilotage. Plafond des géants. Posé au palier de l'âge de votre force, il évolue à chaque âge franchi. La télécommande vous est remise à la pose.
fo-titan-segment-leviathan=Un dixième du Léviathan, fabriqué au Dock de pilotage.

