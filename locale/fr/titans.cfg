[entity-description]
fo-titan-ravageur=Méga-robot d'assaut allié, bipède élancé à tête-orbe et ailes-lames. Il ÉVOLUE avec l'âge de sa force : plaques, masse, points de vie, et une arme de plus par palier : mitraille du gatling (rafale de six projectiles), lames de cristal en zone courte (palier 2), salve de zone des géants (palier 4), résonance : cadence doublée (palier 6). Il flotte : rien ne l'arrête.
fo-titan-ecorcheur=Titan ennemi : bipède charnel écorché à bras-canon, pondu par les nids les plus anciens. Son ère suit l'âge de la partie : plus lourd, plus blindé, plus lumineux ; morsure, puis tir du bras-canon (ère II), puis PONTE (ère III et plus) : quand un ennemi est à portée, des Écorchés sortent de son sac ventral et rejoignent sa meute.
fo-titan-ecorche-rodeur=Mordeur mutant pondu par l'Écorcheur : fin, haut sur pattes, le plus rapide de la lignée.
fo-titan-ecorche-porteur=Mordeur mutant pondu par l'Écorcheur : trapu, dos chargé de cristaux et de plaques, le plus blindé de la lignée.
fo-titan-ecorche-hurleur=Mordeur mutant pondu par l'Écorcheur : tête énorme à gueule béante ; son cri frappe tout ce qui l'entoure.

[item-description]
