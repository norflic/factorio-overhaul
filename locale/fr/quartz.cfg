[entity-name]
fo-vein-quartz=Quartz filonien
fo-crystal-puller=Tireuse de cristal
fo-crystal-lithograph=Lithographe à cristal

[entity-description]
fo-vein-quartz=Veines de quartz blanc laiteux en gerbes de prismes. Deux veines posées au bord d'une plaine de cristal, à 400 à 800 tuiles du départ. Toutes les foreuses l'extraient, la main aussi (lentement).
fo-crystal-puller=Tire un lingot de silicium monocristallin d'un bain de silicium pur, dans un creuset de quartz perdu à chaque tirage (procédé Czochralski).
fo-crystal-lithograph=Insole, grave et découpe les tranches de silicium. L'ultraviolet vient d'un laser à cristal, par conversion de fréquence dans le cristal taillé.

[item-name]
fo-vein-quartz=Quartz filonien
fo-quartz-crucible=Creuset de quartz
fo-silicon-ingot=Lingot de silicium monocristallin
fo-photomask=Photomasque
fo-etched-wafer=Tranche gravée
fo-crystal-laser=Laser à cristal

[item-description]
fo-vein-quartz=Minerai de l'âge 10. Fondu au four à arc, il donne le creuset de la tireuse de cristal.
fo-quartz-crucible=Quartz fondu. Perdu à chaque tirage de lingot, comme en usine.
fo-silicon-ingot=Un seul cristal de silicium. Scié à la taillerie, il donne 40 tranches.
fo-photomask=Le motif des puces sur verre, absorbeur en tungstène. S'use à la lithographie.
fo-etched-wafer=Tranche insolée, gravée et découpée : les puces du processeur gravé.
fo-crystal-laser=La lentille de résonance sert enfin à un laser. Le cœur du lithographe à cristal.

[fluid-name]
fo-photoresist=Résine photosensible

[recipe-name]
fo-quartz-crucible=Creuset de quartz fondu
fo-silicon-ingot=Tirage Czochralski
fo-wafer-sawing=Tranches sciées dans le lingot
fo-etched-wafer=Lithographie et gravure
fo-etched-processor=Processeur gravé

[technology-name]
fo-chip-foundry=Fonderie de puces

[technology-description]
fo-chip-foundry=Le quartz filonien devient creuset, le silicium pur devient lingot puis tranches sciées ; le lithographe à cristal grave les tranches, et le processeur gravé se monte sur deux cartes imprimées. La salle blanche reste.
