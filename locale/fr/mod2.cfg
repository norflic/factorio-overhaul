[fo-lots]
lot-name=__1__ (lot × __2__)
lot-desc=Recette par lots × __1__ : ingrédients, produits et durée × __1__, même rendement. Choisie AUTOMATIQUEMENT quand une machine trop rapide dépasserait le plafond du jeu (60 fabrications par seconde) ; elle revient seule à la recette normale quand la machine ralentit.
panel-lot-1=Recette normale : __1__,__2__ fabrication(s)/s (plafond du jeu : 60/s)
panel-lot=Recette par lots × __1__ : __2__,__3__ lot(s)/s, soit __4__ fabrications/s
panel-lot-cap=Plafond atteint même au lot × __1__ : 60 lots/s (__2__ fabrications/s voulues)
panel-lot-tooltip=Au-delà de 60 fabrications par seconde, la machine passe seule aux recettes par lots (× 10, puis × 100) et revient à la recette normale sous 45 par seconde. Ingrédients et produits présents sont repris au changement.
