[mod-setting-name]
fo-war-fonderie-tapis=Équipes : fonderies des champs à tapis (charbon par tapis)

[mod-setting-description]
fo-war-fonderie-tapis=Les fonderies des champs de minerai des équipes sont des colonnes nourries par tapis : une voie de minerai et une voie de charbon, un bras par four, les plaques sur un tapis jusqu'à un quai de coffres au bout. Le charbon arrive par tapis depuis des foreuses posées sur le gisement de charbon le plus proche, avec des tapis souterrains seulement si la recherche les a débloqués. Plus aucun coffre de charbon à remplir entre deux fours (sauf si aucun charbon n'est joignable : un coffre en tête de colonne). Une partie créée avant cette version garde l'ancienne fonderie à coffres.
