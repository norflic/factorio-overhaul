[mod-setting-name]
fo-war-petrole-champ=PNJ : équiper tous les puits d'un champ de pétrole

[mod-setting-description]
fo-war-petrole-champ=Un site de pétrole fini grandit tant qu'il reste des puits atteignables dans son champ : chevalets sur chaque puits, un collecteur droit qui traverse le champ, des embranchements droits ou en L, et une ligne principale vers le brut du site. Un puits impossible (eau, falaise, place) est écrit au journal avec sa cause. Éteint, aucune extension nouvelle n'est demandée (les chantiers posés restent).
