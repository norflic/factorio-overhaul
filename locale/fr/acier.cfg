[mod-setting-name]
fo-war-acier=PNJ : fonderie d'acier automatisée

[mod-setting-description]
fo-war-acier=L'acier est fait par une rangée de fours qui grandit avec la demande (tapis d'entrée de plaques de fer, tapis de sortie vers un coffre tampon), comme les rangées d'assembleurs. Dès qu'une telle fonderie finie produit au moins ce que l'équipe demande, plus aucun PNJ ne charge de four d'acier à la main (reprise si le débit tombe sous la moitié ; jamais coupé en mode survie). Allumé par défaut. L'éteindre rend l'acier aux tournées de fonte des PNJ.
