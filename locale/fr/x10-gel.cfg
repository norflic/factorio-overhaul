[mod-setting-name]
fo-war-gel=PNJ : figer les usines des factions loin de vous

[mod-setting-description]
fo-war-gel=Pour que le jeu tourne plus vite, les avant-postes et les fours des factions (pas votre équipe) qu'aucun joueur ne voit (à plus de 256 tuiles) s'arrêtent, et leur production est comptée comme s'ils tournaient : minerai retiré du gisement, charbon brûlé, plaques dans leurs coffres, pollution. Ils repartent dès qu'un joueur approche (224 tuiles), ou qu'une faction est attaquée, perd un bâtiment, est menacée ou sort son armée. Leurs soldats au repos en garnison sont figés de la même façon. Éteint : tout tourne au moteur, comme avant. Avant de retirer le mod d'une partie, éteignez ce réglage et laissez tourner une seconde, sinon les machines figées le resteraient.
