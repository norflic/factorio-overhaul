[mod-setting-name]
fo-war-ia3e=PNJ : automatiser ce qui revient

[mod-setting-description]
fo-war-ia3e=Les factions mesurent le temps que leurs PNJ passent à la main sur chaque objet (tournées, fonte, minage, fabrication) et, quand une machine se rembourse en moins de 20 minutes (5 sous menace), demandent au plan directeur une fonderie électrique (foreuses et tapis sur le gisement) ou une rangée d'assembleurs, avec leur centrale à vapeur. Une recherche ouverte passe avant (sauf si le module la sert). Votre équipe n'automatise pas. L'éteindre en cours de partie arrête les nouvelles demandes ; les modules posés restent.
