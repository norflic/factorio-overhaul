fo-war-ia3-recherche=Factions : recherche d'abord (essai IA3-a)

[mod-setting-description]
fo-war-ia3-recherche=Essai du nouveau cerveau des PNJ. Les factions fabriquent leurs packs de science dès le départ, avec une priorité qui dépend de leur caractère (le technocrate cherche avant de s'armer, le conquérant l'inverse), sans jamais fabriquer les packs d'une recherche qu'elles ne peuvent pas payer (pack chimique sans pétrole) et sans toucher aux plaques de leur prochain avant-poste de fer. Lu à la fondation de chaque faction. Éteint par défaut tant que l'essai n'est pas mesuré.
