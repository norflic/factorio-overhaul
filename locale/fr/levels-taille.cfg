[fo-levels-taille]
resize-line=Taille : __1__ → __2__ (agrandissement sur place, le bâtiment garde ce qu'il contient)
regrid-line=Hors grille depuis une mise à jour du mod (__1__) : l'amélioration le remet sur la grille en __2__, à une demi-tuile au plus (il garde ce qu'il contient)
room-free=Place : libre autour du bâtiment (carré vert au sol).
room-free-moved=Place : la position habituelle est prise ; le bâtiment s'étendra vers __1__ (carré vert au sol).
room-blocked=Place : insuffisante (contour orange au sol). Gêne : __1__
reason-no-room=Pas assez de place pour la taille __1__ : libérez le contour affiché. Gêne : __2__
dir-n=le nord
dir-s=le sud
dir-e=l'est
dir-w=l'ouest
dir-ne=le nord-est
dir-nw=le nord-ouest
dir-se=le sud-est
dir-sw=le sud-ouest
points-moved=Point de sortie ou raccord : à cette position, __1__ ne serait plus servi (la sortie de la foreuse ou le raccord du tuyau changerait de tuile). Libérez une autre position, ou retirez-le.
migration-kept=Mise à jour du mod : __1__ bâtiment(s) n'ont pas pu prendre leur nouvelle taille faute de place. Ils restent en service, à cheval sur la grille (sprites superposés d'une demi-tuile). Pour les agrandir : libérez le contour que montre l'amélioration, ou ramassez-les puis reposez-les. __2__
migration-stacked=Mise à jour du mod : __1__ paire(s) de bâtiments superposés trouvée(s) (défaut corrigé en 0.4.3 : un bâtiment hors grille amélioré était posé par-dessus l'ancien). Rien n'a été retiré : ramassez celui que vous ne voulez pas garder. __2__
free-button=Libérer la place
free-tooltip=Marque à démonter ce qui gêne le contour orange (par les robots de construction, ou à la main) et pose des fantômes pour le reconstruire décalé. Le bâtiment grandit tout seul dès que la place est libre ; le coût est payé à ce moment-là.
free-cancel-button=Annuler l'agrandissement
free-pending=Agrandissement en attente : __1__ gêneur(s) marqué(s) à démonter, __2__ fantôme(s) à construire, __3__ à retirer à la main. Il se fera dès que le contour orange sera libre (délai : __4__ min au plus).
free-started=Libérer la place pour __1__ (__2__) : __3__ gêneur(s) marqué(s) à démonter (robots, ou à la main), __4__ fantôme(s) posé(s) pour les reconstruire décalés. Le bâtiment grandira dès que le contour orange sera libre.
free-signalled=À retirer à la main (le mod ne sait pas les reposer, contour rouge) : __1__
free-wall-open=Une ligne de murs n'a pas pu être refermée autour de la place libérée : vérifiez-la.
free-wired=__1__ gêneur(s) marqué(s) portent des fils de circuit : à refaire après leur reconstruction.
free-done=Place libérée : __1__ a grandi ([gps=__2__,__3__]).
free-no-resources=La place de __1__ est libre, mais le coût manque : la demande attend encore (30 min au plus).
free-cancelled=Agrandissement annulé : __1__ marque(s) de démontage retirée(s), __2__ fantôme(s) retiré(s).
free-expired=Agrandissement abandonné (30 min sans place libre) : __1__ marque(s) de démontage retirée(s), __2__ fantôme(s) retiré(s).
free-gone=Agrandissement annulé (le bâtiment a disparu ou changé) : __1__ marque(s) de démontage retirée(s), __2__ fantôme(s) retiré(s).
free-kept=__1__ fantôme(s) gardé(s) : ce qu'ils remplacent est déjà démonté, les robots le reconstruiront décalé.
free-refused-room-free=La place est déjà libre : améliorez directement.
free-refused-already=Une demande d'agrandissement attend déjà pour ce bâtiment.
free-refused-too-many=Trop de gêneurs pour un seul clic : libérez-en une partie à la main.
free-refused-other=Impossible de libérer la place ici (voir le motif dans le panneau).
