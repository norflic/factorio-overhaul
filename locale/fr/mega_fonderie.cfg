[mod-setting-name]
fo-war-mega-fonderie=Équipes : méga-fonderies (bus de minerai et blocs de fonte)

[mod-setting-description]
fo-war-mega-fonderie=Sur un gisement assez grand pour remplir au moins deux lignes de tapis, les équipes (factions et votre équipe) décident une méga-fonderie : des bandes de foreuses électriques qui extraient en masse, un bus de minerai à plusieurs lignes, et un bloc rectangulaire de fours dédié à la fonte, une colonne par ligne du bus. La décision, sa taille (lignes, colonnes, fours) et chaque refus avec sa cause sont écrits au journal [FO-MEGA]. Cette version décide et dimensionne seulement ; la pose du bloc viendra ensuite.
