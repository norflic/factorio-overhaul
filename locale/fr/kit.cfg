fo-war-kit-genereux=Factions : kit de départ généreux (tests)

[mod-setting-description]
fo-war-kit-genereux=Désactivé (par défaut) : une faction démarre avec le même kit que votre équipe (coffre vide, aucun four, seulement des ouvriers armés) et récolte elle-même tout le reste. Activé : l'ancien kit généreux (12 foreuses, 8 fours, 4 coffres, 150 charbon, 200 plaques de fer, 60 de cuivre, 80 pierres, 40 chargeurs), pour les tests. Lu à la fondation d'un QG : sans effet sur une partie en cours.
