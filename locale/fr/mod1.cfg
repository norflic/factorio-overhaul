[fo-mm]
module-desc-speed=Les modules d'une même machine se MULTIPLIENT : vitesse × (1 + bonus) par module, énergie × (1 + 60 % du bonus) par module, jusqu'au plafond du jeu (× 328,67). Au plafond, l'énergie ne paie que la part utile des modules : elle reste plus basse que le gain.
module-desc-productivity=Les modules d'une même machine se MULTIPLIENT : productivité × (1 + bonus) par module, énergie × (1 + 60 % du bonus) par module, vitesse × (1 + malus), jusqu'au plafond du jeu (× 328,67).
module-desc-effectivity=Les modules d'une même machine se MULTIPLIENT pour la vitesse, l'énergie et la productivité, jusqu'au plafond du jeu (× 328,67) ; l'énergie ne descend pas sous 20 %.
effect-speed=vitesse
effect-consumption=énergie
effect-productivity=productivité
complement-name=Complément caché (__1__, __2__ centièmes)
complement-desc=Module interne de la règle multiplicative : jamais dans un inventaire.
beacon-name=Balise de complément (cachée)
beacon-desc=Entité interne : porte, pour une machine, l'écart entre le produit de ses modules et leur somme.
panel-title=Modules (multipliés)
panel-speed=Vitesse : × __1__,__2__ (__3__)
panel-energy=Énergie : × __1__,__2__ (__3__)
panel-prod-add=Productivité : __1__ % (additionnée)
panel-prod-mult=Productivité : __1__ % (multipliée)
panel-cap=Plafond du jeu atteint : × 328,67
panel-cap-gap=Plafond du jeu atteint : × 328,67. L'énergie ne paie que la part utile des modules (l'écart est gardé).
panel-note=Calculé sur les modules de la machine. Les balises posées autour ajoutent leurs effets en plus.
panel-tooltip=__1__ module(s) dans la machine ; chaque module multiplie la vitesse, l'énergie et la productivité.
