[mod-setting-name]
fo-war-capi=PNJ : capitaliser

[mod-setting-description]
fo-war-capi=Les factions (pas votre équipe) réinvestissent ce qu'elles produisent : elles couvrent leurs gisements de foreuses, en ouvrent d'autres, posent autant de fours que leur minerai en nourrit, montent des rangées d'assembleurs et des laboratoires. N'agit qu'avec « PNJ : automatiser ce qui revient » allumé. Éteint par défaut. L'éteindre en cours de partie arrête les nouveaux ordres ; ce qui est posé reste.
