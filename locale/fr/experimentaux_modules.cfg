[item-description]
fo-xp-module-portee-1=Se pose dans la grille d'un géant expérimental (Cairn, Stylet, Trombe, Ixion, Tournesol). Portée de son attaque : +__1__ %. Les modules de portée s'additionnent, jusqu'à +__2__ % en tout. Une cible que seul ce surplus atteint est marquée d'un trait de visée violet.
fo-xp-module-portee-2=Se pose dans la grille d'un géant expérimental (Cairn, Stylet, Trombe, Ixion, Tournesol). Portée de son attaque : +__1__ %. Les modules de portée s'additionnent, jusqu'à +__2__ % en tout. Une cible que seul ce surplus atteint est marquée d'un trait de visée violet.
fo-xp-module-portee-3=Se pose dans la grille d'un géant expérimental (Cairn, Stylet, Trombe, Ixion, Tournesol). Portée de son attaque : +__1__ %. Les modules de portée s'additionnent, jusqu'à +__2__ % en tout. Une cible que seul ce surplus atteint est marquée d'un trait de visée violet.
fo-xp-module-puissance-1=Se pose dans la grille d'un géant expérimental (Cairn, Stylet, Trombe, Ixion, Tournesol). Dégâts de chaque coup : +__1__ %. Les modules de puissance s'additionnent, jusqu'à +__2__ % en tout. Le géant s'embrase en cramoisi à chaque coup.
fo-xp-module-puissance-2=Se pose dans la grille d'un géant expérimental (Cairn, Stylet, Trombe, Ixion, Tournesol). Dégâts de chaque coup : +__1__ %. Les modules de puissance s'additionnent, jusqu'à +__2__ % en tout. Le géant s'embrase en cramoisi à chaque coup.
fo-xp-module-puissance-3=Se pose dans la grille d'un géant expérimental (Cairn, Stylet, Trombe, Ixion, Tournesol). Dégâts de chaque coup : +__1__ %. Les modules de puissance s'additionnent, jusqu'à +__2__ % en tout. Le géant s'embrase en cramoisi à chaque coup.

