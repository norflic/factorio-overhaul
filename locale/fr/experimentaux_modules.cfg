[item-description]
fo-xp-module-portee-1=Se pose dans la grille d'un géant expérimental. Portée de son attaque, selon le géant qui le porte (un module vaut toujours la même part de sa valeur : plus fort sur un géant jeune, plus faible sur un vieux) : Cairn +__1__ %, Stylet +__2__ %, Trombe +__3__ %, Ixion +__4__ %, Tournesol +__5__ %. Les modules de portée s'additionnent, jusqu'à +__6__ % en tout. Une cible que seul ce surplus atteint est marquée d'un trait de visée violet.
fo-xp-module-portee-2=Se pose dans la grille d'un géant expérimental. Portée de son attaque, selon le géant qui le porte (un module vaut toujours la même part de sa valeur : plus fort sur un géant jeune, plus faible sur un vieux) : Cairn +__1__ %, Stylet +__2__ %, Trombe +__3__ %, Ixion +__4__ %, Tournesol +__5__ %. Les modules de portée s'additionnent, jusqu'à +__6__ % en tout. Une cible que seul ce surplus atteint est marquée d'un trait de visée violet.
fo-xp-module-portee-3=Se pose dans la grille d'un géant expérimental. Portée de son attaque, selon le géant qui le porte (un module vaut toujours la même part de sa valeur : plus fort sur un géant jeune, plus faible sur un vieux) : Cairn +__1__ %, Stylet +__2__ %, Trombe +__3__ %, Ixion +__4__ %, Tournesol +__5__ %. Les modules de portée s'additionnent, jusqu'à +__6__ % en tout. Une cible que seul ce surplus atteint est marquée d'un trait de visée violet.
fo-xp-module-puissance-1=Se pose dans la grille d'un géant expérimental. Dégâts de chaque coup, selon le géant qui le porte (un module vaut toujours la même part de sa valeur : plus fort sur un géant jeune, plus faible sur un vieux) : Cairn +__1__ %, Stylet +__2__ %, Trombe +__3__ %, Ixion +__4__ %, Tournesol +__5__ %. Les modules de puissance s'additionnent, jusqu'à +__6__ % en tout. Le géant s'embrase en cramoisi à chaque coup.
fo-xp-module-puissance-2=Se pose dans la grille d'un géant expérimental. Dégâts de chaque coup, selon le géant qui le porte (un module vaut toujours la même part de sa valeur : plus fort sur un géant jeune, plus faible sur un vieux) : Cairn +__1__ %, Stylet +__2__ %, Trombe +__3__ %, Ixion +__4__ %, Tournesol +__5__ %. Les modules de puissance s'additionnent, jusqu'à +__6__ % en tout. Le géant s'embrase en cramoisi à chaque coup.
fo-xp-module-puissance-3=Se pose dans la grille d'un géant expérimental. Dégâts de chaque coup, selon le géant qui le porte (un module vaut toujours la même part de sa valeur : plus fort sur un géant jeune, plus faible sur un vieux) : Cairn +__1__ %, Stylet +__2__ %, Trombe +__3__ %, Ixion +__4__ %, Tournesol +__5__ %. Les modules de puissance s'additionnent, jusqu'à +__6__ % en tout. Le géant s'embrase en cramoisi à chaque coup.

