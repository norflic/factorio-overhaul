fo-war-ia3-comportement=PNJ : comportements visibles (peur, détours, escortes)

[mod-setting-description]
fo-war-ia3-comportement=Les PNJ se souviennent des endroits dangereux (ennemis vus, attaques, morts), choisissent des trajets qui les évitent et qui varient d'une tournée à l'autre, s'arrêtent ou se détournent quand ils voient un ennemi sur leur route, fuient blessés ou sans munitions vers la tourelle ou le QG le plus proche, et ne repartent pas seuls là où des camarades sont morts. Les soldats des factions patrouillent, gardent, escortent et nettoient les nids proches des routes. Un état court s'affiche au-dessus du PNJ à chaque changement. Éteint : comportement d'avant.

