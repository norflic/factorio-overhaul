[mod-setting-name]
fo-war-nids=Factions : détruire les nids qui les menacent

[mod-setting-description]
fo-war-nids=Une faction dont l'armée est assez grosse et libre (une garnison reste au QG) détruit le nid de biters qu'elle connaît par ses éclaireurs et qui menace le plus son QG et ses avant-postes, surtout s'il a déjà détruit des bâtiments ou tué des soldats. Après un échec ou un repli, elle attend 5, 10, 20 puis 40 minutes avant d'y retourner avec plus de soldats. Éteint : seuls les nids proches des routes sont nettoyés, comme avant.
