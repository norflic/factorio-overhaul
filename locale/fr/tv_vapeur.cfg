[mod-setting-name]
fo-war-degradation=Équipes : espacer les travaux non urgents quand le jeu est chargé
fo-war-vapeur-tampon=Équipes : remplir le charbon de la centrale aussi quand la vapeur baisse

[mod-setting-description]
fo-war-degradation=Quand la file des travaux lourds s'allonge (grande usine), les travaux qui ne pressent pas, la pensée des factions lointaines et calmes et le relevé de l'alimentation des centrales, s'espacent par paliers (jusqu'à trois fois plus rares). La défense, le courant et votre équipe ne sont jamais ralentis. Éteint : cadence d'avant.
fo-war-vapeur-tampon=Le coffre de charbon de la centrale est rempli en urgence non seulement quand il passe sous le seuil de consommation, mais aussi quand la vapeur des machines tombe sous 30 % (retour à 60 %) et que le coffre est sous les trois quarts de sa cible. Éteint : seule la consommation déclenche.
