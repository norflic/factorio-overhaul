[fo-journal]
command-help=Journal d'époque : /fo-journal pour l'époque actuelle, /fo-journal <1-15> pour relire une époque atteinte.
title=Journal d'époque : époque __1__, __2__
intro-title=Arche-5
intro=L'Arche-5 s'est écrasée sur Érèbe. Son noyau devient votre centre de commandement : nourrissez-le, et il vous fera traverser les époques.\n\nL'époque se lit dans ce journal : /fo-journal pour le rouvrir.
intro-repair=Premier objectif : réparer l'épave du centre de commandement (ouvrez son panneau ou visez-la et appuyez sur U). Le coût est affiché dans le panneau.
act-line=Acte __1__ : __2__
objectives=Objectifs de l'époque
obj-centre=Passer le centre à l'époque __1__ (__2__). Dans le centre et sur vous :
obj-cap=Plafond des bâtiments : niveau __1__.
obj-resource=Gisement de l'époque : __1__ __2__.
obj-chart=Cartographier __2__ chunks (aujourd'hui : __1__ sur cette surface).
obj-research=Rechercher __2__ des __3__ technologies de cette époque (faites : __1__).
obj-defense=Détruire __2__ nids pendant cette époque (détruits : __1__).
obj-gate=La Porte d'Érèbe : pas encore construite dans cette version. Montez tout au niveau 30.
obj-threat=Menace : __1__
prev=< Époque précédente
next=Époque suivante >
close=Fermer
hint=/fo-journal [époque] rouvre ce journal.
chat-epoch=Journal d'époque : époque __1__, __2__. Codex et objectifs : /fo-journal
migrated=Nouveau : le journal d'époque (Codex et objectifs de chaque époque). Tapez /fo-journal pour le lire.
command-none=Aucune époque atteinte : réparez d'abord l'épave du centre.
command-invalid=Époque inconnue : donnez un nombre de 1 à __1__.
command-not-reached=Votre centre n'a pas encore atteint cette époque.
codex-1=Jour 1. L'Arche-5 est une épave ; son noyau tient encore. Les gravimètres de bord affichent des anomalies que rien n'explique : la chute les aurait-elle faussés ?
codex-2=Quatre balises répondent sur la fréquence du Convoi. Les autres équipages ont survécu, et ils s'arment.
codex-3=Le bilan thermique ne ferme pas : Érèbe rayonne plus de chaleur que son étoile ne lui en donne. Quelque chose chauffe la planète par en dessous.
codex-4=Le pétrole d'Érèbe est jeune : il se forme encore, à quelques kilomètres sous nos pieds. Les géologues de l'Arche refusent d'y croire.
codex-5=Le flux géothermique est quarante fois trop fort. Le manteau est chauffé de l'intérieur, comme par un cœur.
codex-6=Les orages magnétiques ne suivent pas les vents : ils suivent les anomalies gravimétriques. Nos réseaux les attirent.
codex-7=Les cristaux chantent sans source. La Ligue Azur publie une hypothèse : Érèbe traverse une caustique de matière noire.
codex-8=La vie d'Érèbe respire le méthane qu'exhale un sous-sol chauffé. Tout ici se nourrit de la même chaleur.
codex-9=Le cuivre irradié émet des positons : nous avons piégé notre premier grain d'antimatière. L'Ordre Écarlate y voit déjà une arme.
codex-10=Un réseau de cristal gravé oscille sans énergie : un cristal temporel. La Dynastie Ambre y voit l'éternité.
codex-11=Les inclusions de la brèche sont bien trop denses : de la matière étrange, venue d'une météorite que quelque chose a attirée. Le Consortium Émeraude veut tout transmuter.
codex-12=L'haloscope capte enfin le champ d'axions. La Caustique a une marée, et cette marée suit la rotation du noyau.
codex-13=Antimatière en quantité, strangelets en cuve : la Caustique ne tolère qu'une seule grande perturbation. Il faut choisir sa doctrine : le Serment.
codex-14=Les archives orbitales de l'Arche parlent enfin : le Convoi venait ancrer une Porte sur le trou noir du Cœur. Sans elle, personne ne rentre.
codex-15=Le Cœur s'éveille. Des failles s'ouvrent sur la plaine, gardées par des nids que personne n'a jamais vus. La Porte se construit ici, ou nulle part.
threat-1=petits déchiqueteurs ; les factions vous laissent un délai de grâce.
threat-2=premières patrouilles des factions autour de la base.
threat-3=raids de déchiqueteurs plus gros, attirés par la pollution de la vapeur.
threat-4=premières attaques organisées des factions (Normal) ; les avant-postes pétroliers isolés sont visés.
threat-5=déchiqueteurs blindés et ignés dans les cendres : les balles ordinaires rebondissent, prenez du tungstène.
threat-6=déchiqueteurs foudroyants, attirés par les réseaux électriques.
threat-7=foudroyants renforcés ; la Ligue Azur convoite la plaine de cristal.
threat-8=couvées du marais, qui se multiplient vite ; le marais empoisonne.
threat-9=l'Ordre Écarlate cherche l'arme absolue.
threat-10=fantassins des factions mieux armés.
threat-11=nids de famille plus loin et plus gros autour des cratères.
threat-12=les factions rattrapent votre époque selon la difficulté.
threat-13=la rivale jurée de votre doctrine attaque davantage.
threat-14=pluies de météorites ; les factions courent à la Porte.
threat-15=la Marée du Cœur : le siège final.
act-1=Survivre
act-2=La planète est étrange
act-3=Dompter les nouvelles physiques
act-4=La vérité et la Porte
