[mod-setting-name]
fo-war-capital=PNJ : améliorer leurs bâtiments et monter les époques
fo-war-remplacer=PNJ : remplacer leurs fours et assembleurs par la machine supérieure

[mod-setting-description]
fo-war-capital=Les factions (pas votre équipe) posent leur centre de commandement près de leur QG, puis montent leurs bâtiments à niveaux et leur centre (l'époque suivante) quand cela vaut son coût, payé avec le coffre de leur QG comme vous le payez. Éteint par défaut : allumé, il retarde aujourd'hui la recherche des factions. L'éteindre en cours de partie arrête les nouvelles améliorations ; les bâtiments montés restent.
fo-war-remplacer=Les PNJ (factions et votre équipe) remplacent sur place leurs fours et leurs assembleurs par la machine supérieure dès qu'elle est débloquée (four de pierre vers four en acier, par exemple), payée avec leur coffre ; l'ancienne machine y retourne. Ne touche ni centre ni tourelles et ne réclame jamais de recherche. L'éteindre arrête les nouveaux remplacements.
