[mod-setting-name]
fo-war-capital=PNJ : améliorer leurs bâtiments et monter les époques

[mod-setting-description]
fo-war-capital=Les factions (pas votre équipe) posent leur centre de commandement près de leur QG, puis montent leurs bâtiments à niveaux et leur centre (l'époque suivante) quand cela vaut son coût, payé avec le coffre de leur QG comme vous le payez. Éteint par défaut : allumé, il retarde aujourd'hui la recherche des factions. L'éteindre en cours de partie arrête les nouvelles améliorations ; les bâtiments montés restent.
