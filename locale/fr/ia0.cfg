[mod-setting-description]
fo-pvp-difficulty=Les factions IA vous attaquent-elles d'elles-mêmes ?\n- Paisible : jamais, sauf si vous détruisez quelque chose leur appartenant (cessez-le-feu rompu).\n- Facile : après 45 min de grâce, petites attaques, au plus une toutes les 15 min par faction.\n- Normal : après 30 min de grâce, au plus une attaque toutes les 8 min par faction.\n- Difficile : après 18 min, attaques plus nombreuses, toutes les 5 min.\n- Impitoyable : après 10 min, attaques massives, toutes les 3 min.\nLa grâce part du lancement de la guerre et dépend du caractère de la faction (le conquérant attaque plus tôt, le bâtisseur plus tard).\nFace à une base défendue, une faction n'attaque qu'avec assez de soldats (Facile : prudente, se laisse dissuader ; Normal à Impitoyable : elle masse ses troupes jusqu'à 20, 30 ou 45 min, de plus en plus téméraire). En Difficile et Impitoyable, les factions coordonnent leurs assauts. Modifiable en cours de partie.
fo-war-autostart=Coché, la guerre des factions IA démarre toute seule quelques secondes après le début de la partie, autour de votre point de départ (QG à environ 480 tuiles), avec les nombres ci-dessous. Une seule fois par partie : /fo-war stop ne la relance pas. Décoché : rien ne se passe, la commande /fo-war start reste possible.
fo-war-factions=Nombre de factions IA lancées automatiquement (2 à 4).
fo-war-soldiers=Soldats au plus par faction, lancement automatique (5 à 100).
fo-war-workers=Ouvriers au plus par faction, lancement automatique (1 à 10).

