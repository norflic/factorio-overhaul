[mod-setting-name]
fo-war-mall=Plan directeur : mall centralisé

[mod-setting-description]
fo-war-mall=Allumé, chaque équipe (factions et votre équipe) choisit tôt, d'après le terrain seul, un secteur près du QG (ni eau, ni minerai, ni bâtiment) et le réserve au mall : le plan directeur n'y pose plus de module isolé. Le mall y regroupera les rangées d'assembleurs sur un bus d'entrée commun. La ligne [FO-MALL] du journal donne le secteur choisi, ou la cause quand aucun ne convient, et quand l'équipe est prête (centrale qui produit, fer et cuivre fondus automatiquement, pas de crise, un assembleur). Éteint en cours de partie, la réservation est rendue.
