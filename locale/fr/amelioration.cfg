[mod-setting-description]
fo-war-amelioration=Les PNJ (factions et votre équipe) montent leurs fours, foreuses et assembleurs PAR BLOC (module du plan directeur, avant-poste, quartier du QG) : tout un bloc passe d'un niveau avant qu'un seul bâtiment passe de deux, dans la limite du stock, du plafond du centre et de l emprise. Votre équipe ne monte que les bâtiments de ses projets, payés avec son coffre. Éteint : un bâtiment par pensée, autour du QG (règle d'avant).
