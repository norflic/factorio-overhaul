[mod-setting-name]
fo-war-rapatriement=Plan directeur : rapatrier les sorties lointaines par tapis

[mod-setting-description]
fo-war-rapatriement=Allumé, un coffre de sortie lointain (champ de minerai, fonderie, site), à 56 tuiles du QG ou plus, est relié par un tapis long à un coffre tampon placé près des quais qui consomment son objet : bras, tapis, bras, tampon. Le PNJ ne porte plus la jambe lointaine (sortie vers le QG) ; il ne vide le tampon, près du QG, que si le stock du QG est bas. La ligne est un projet du plan directeur, décidée par le prix (travail de PNJ économisé contre pièces et pose, retour en 120 min au plus). Le repli est l'ancien : tapis coupé ou tampon plein, la sortie remonte au seuil de collecte et le PNJ reprend. Exige aussi le réglage maître de l'industrie. La ligne [FO-RAPATRIEMENT] du journal donne chaque ligne demandée, finie, coupée ou refusée, avec sa cause, et les trajets de PNJ économisés par heure.
