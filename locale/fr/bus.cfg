[mod-setting-name]
fo-war-bus=Plan directeur : bus de produits par tapis

[mod-setting-description]
fo-war-bus=Allumé, une équipe relie par un tapis long (jusqu'à 220 tuiles, souterrains aux obstacles) un coffre de sortie lointain au quai d'un module qui consomme le même objet, là où la liaison de quai d'avant (40 tuiles) ne va pas, au lieu de le faire porter par ses PNJ. La règle (graphe producteurs-consommateurs, k files) choisit l'objet et la paire ; la ligne [FO-BUS] du journal donne chaque décision et sa raison. Éteint, seule la liaison de quai d'avant reste.
