[item-description]
fo-commande-outil=Glisser sur un gisement : votre équipe le colonise tout de suite.\nMaj + glisser : liaison prioritaire dans la zone.\nBouton droit : annuler les ordres de la zone.

fo-cmd-gisement=Glisser sur un gisement : votre équipe le colonise tout de suite.\nBouton droit : annuler les ordres de la zone.\nRaccourci : Maj + A.
fo-cmd-amelioration=Glisser sur une zone : les bâtiments de l'équipe qui ont une version supérieure y sont améliorés en premier.\nBouton droit : annuler les ordres de la zone.\nRaccourci : Maj + Z.
fo-cmd-liaison=Premier glisser : point A (départ). Second glisser : point B (arrivée). Les deux sont reliés en priorité.\nBouton droit : annuler les ordres de la zone.\nRaccourci : Maj + E.
fo-cmd-bastion=Glisser sur une zone : les tourelles en stock de l'équipe y sont posées d'abord, comme sur un lieu attaqué.\nBouton droit : annuler les ordres de la zone.\nRaccourci : Maj + R.

