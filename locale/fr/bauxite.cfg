[entity-name]
fo-bauxite=Bauxite
fo-reduction-cell=Cuve d'électrolyse ignée
fo-ht-pylon=Pylône haute tension

[entity-description]
fo-bauxite=Pisolithes brique-ocre du climat du désert rouge, à plus de 300 tuiles du départ. Toutes les foreuses l'extraient.
fo-reduction-cell=Électrolyse de l'alumine fondue sur anode de graphite (procédé Hall-Héroult). 6 MW : la machine la plus gourmande de l'âge 6. Visuel provisoire (four électrique teinté) en attendant son modèle.
fo-ht-pylon=Porte le courant sur 64 tuiles, mais n'alimente rien autour de lui : un pylône de transport. Visuel provisoire (grand poteau teinté).

[item-name]
fo-bauxite=Bauxite
fo-alumina=Alumine
fo-red-mud=Boue rouge
fo-aluminium-plate=Plaque d'aluminium

[item-description]
fo-bauxite=Minerai d'aluminium (âge 6). Frittée à la chaux dans l'usine chimique : alumine et boue rouge.
fo-alumina=Oxyde d'aluminium. La cuve d'électrolyse ignée en tire l'aluminium.
fo-red-mud=Sous-produit du frittage. Deux débouchés : ciment (concasseur) ou fer (four à arc).
fo-aluminium-plate=Léger et conducteur : pylônes à conducteur aluminium-acier.

[recipe-name]
fo-lime-sinter-alumina=Frittage de la bauxite à la chaux
fo-hall-heroult=Électrolyse ignée (Hall-Héroult)
fo-red-mud-cement=Ciment de boue rouge
fo-red-mud-iron=Fer de la boue rouge
fo-ht-pylon-aluminium=Pylône à conducteur aluminium-acier

[technology-name]
fo-high-voltage=Haute tension
fo-aluminium=Aluminium

[technology-description]
fo-high-voltage=Le pylône haute tension porte le courant sur 64 tuiles d'un seul fil.
fo-aluminium=La bauxite frittée à la chaux donne l'alumine ; la cuve d'électrolyse ignée en tire l'aluminium. La boue rouge n'est jamais perdue : ciment ou fer. Le pylône à conducteur aluminium-acier économise acier et cuivre (la voie classique reste).
