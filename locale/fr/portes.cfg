[mod-setting-name]
fo-war-portes=PNJ : portes avant d'étendre

[mod-setting-description]
fo-war-portes=Allumé, les factions et votre équipe attendent avant d'ajouter des chantiers et des tournées quand leurs PNJ sont débordés : quand trop peu de PNJ sont libres ou que les tâches libres s'accumulent, aucun nouvel ordre qui ajoute des tournées (un tapis reste permis) ; jamais plus de chantiers ouverts à la fois que la taille de la base n'en porte ; une seule unité de plus quand le transport est tendu ou que le manque est mesuré. Survivre, réparer et protéger ne sont jamais retenus. Éteint par défaut ; la ligne [FO-PORTES] du journal dit ce qui est retenu et pourquoi.
