[entity-description]
fo-xp-mat-foudre=Expérimental de l'âge 6, défense posée. La tête se charge, puis un arc saute d'une cible à l'autre (trois cibles au plus). Consomme de l'électricité.
fo-xp-geode=Expérimental de l'âge 7, attaquant lancé. Le sol crache une ligne de pointes violettes qui court jusqu'à la cible : elle ouvre un mur sans s'en approcher.
fo-xp-sarracenie=Expérimental de l'âge 8, défense posée. Trois urnes lancent trois jets d'acide en cloche ; les flaques rongent la vague qui passe.
fo-xp-demi-vie=Expérimental de l'âge 9, usage unique. Elle fonce sur l'ennemi le plus proche et fond sur place : boule verte, zone contaminée longtemps.
fo-xp-veilleuse=Expérimental de l'âge 13, défense posée. Le soleil captif lâche une goutte qui retombe en cloche : éclair magenta, plaque de verre.
fo-xp-cairn=Géant expérimental de l'âge 10. Le Balayage : un secteur radar marque jusqu'à 8 cibles, puis chaque antenne tire un arc bleu sur sa marque (le coup est partagé). Il flotte : rien ne l'arrête.
fo-xp-stylet=Géant expérimental de l'âge 11. L'Écriture : la pointe touche le sol, un circuit à angles droits court sous la base ennemie ; chaque nœud tire un pilier bleu-blanc.
fo-xp-trombe=Géant expérimental de l'âge 12. Le Gel : le sol blanchit sur 44 tuiles, les machines et les ennemis s'arrêtent, puis des pics de glace les font éclater.
fo-xp-ixion=Géant expérimental de l'âge 13, la roue de feu. La Tranchée : une fissure brûlante court vers la cible et au-delà, des geysers jaillissent tout du long.
fo-xp-tournesol=Géant expérimental de l'âge 14. Le Foyer : ses miroirs regardent le soleil et rendent un trait blanc-or qui laisse du verre fondu. La nuit, il ne tire pas.

[item-description]
fo-xp-mat-foudre=Défense posée de l'âge 6 (Atelier d'automates). Arc électrique qui saute d'une cible à l'autre.
fo-xp-geode=Capsule de l'âge 7 (Hall de montage) : lancez-la, la Géode se pose là et part vers l'ennemi le plus proche.
fo-xp-sarracenie=Défense posée de l'âge 8 (Hall de montage). Trois jets d'acide, flaques qui rongent.
fo-xp-demi-vie=Capsule de l'âge 9 (Hall de montage), usage unique : lancez-la, la Demi-Vie fonce sur l'ennemi le plus proche et fond sur place.
fo-xp-veilleuse=Défense posée de l'âge 13 (Portique des expérimentaux). Une goutte de plasma en cloche, qui éclate.
fo-xp-cairn=Géant de l'âge 10 : 10 segments assemblés au Dock de pilotage. Un géant de plus seulement sous le plafond des géants. Se pose comme une araignée ; la télécommande vous est remise.
fo-xp-stylet=Géant de l'âge 11 : 10 segments assemblés au Dock de pilotage. Plafond des géants. La télécommande vous est remise à la pose.
fo-xp-trombe=Géant de l'âge 12 : 10 segments assemblés au Dock de pilotage. Plafond des géants. La télécommande vous est remise à la pose.
fo-xp-ixion=Géant de l'âge 13 : 10 segments assemblés au Portique des expérimentaux. Plafond des géants. La télécommande vous est remise à la pose.
fo-xp-tournesol=Géant de l'âge 14 : 10 segments assemblés au Portique des expérimentaux. Plafond des géants. La télécommande vous est remise à la pose.
fo-xp-segment-cairn=Un dixième du Cairn, fabriqué au Dock de pilotage.
fo-xp-segment-stylet=Un dixième du Stylet, fabriqué au Dock de pilotage.
fo-xp-segment-trombe=Un dixième de la Trombe, fabriqué au Dock de pilotage.
fo-xp-segment-ixion=Un dixième d'Ixion, fabriqué au Dock de pilotage.
fo-xp-segment-tournesol=Un dixième du Tournesol, fabriqué au Dock de pilotage.

