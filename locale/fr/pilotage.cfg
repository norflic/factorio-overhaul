[mod-setting-name]
fo-war-armee-famille=PNJ : part réservée de l'armée
fo-war-plafonds=PNJ : plafonds de sûreté des machines

[mod-setting-description]
fo-war-armee-famille=Allumé, les munitions et l'équipement des soldats forment une seule famille « armée » qui garde sa part (défense + armée de la capitalisation) du stock de matières contre les autres projets de la faction : tant que la famille a un besoin non servi, les autres projets voient le stock moins cette part ; les premiers soldats et la réserve de munitions passent d'abord. L'armée de votre équipe n'en profite pas (elle reste servie après son économie). Éteint, le stock est servi dans l'ordre d'avant, sans part réservée.
fo-war-plafonds=Allumé, une faction ne pose jamais plus de 192 fours, 96 machines de chaîne ou 96 machines de packs pour un même objet (un garde-fou contre un emballement : la partie du joueur n'en demande pas la moitié) ; au plafond, le refus est écrit au journal. Éteint, seuls les plafonds relatifs à la demande restent.
