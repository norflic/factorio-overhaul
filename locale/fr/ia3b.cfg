fo-war-ia3-marche=PNJ : personne n'attend, personne n'arrache

[mod-setting-description]
fo-war-ia3-marche=Les PNJ des factions et de votre équipe s'organisent : un PNJ libre prend la tâche la plus utile qu'il sait faire, même hors de son pôle (le pôle l'oriente, il ne l'interdit plus) ; une tâche prise réserve sa matière au coffre, personne ne la lui prend ; quand une plaque manque, plusieurs PNJ minent le minerai et le fondent au QG. Lu à la première pensée de chaque équipe. Allumé par défaut depuis la version 0.5.0.
