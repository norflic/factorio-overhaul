[mod-setting-name]
fo-war-relais=PNJ : relais des chaînes faites à la main

[mod-setting-description]
fo-war-relais=Une chaîne ordonnée dont les PNJ font déjà la fabrication à la main (au moins 0,25 PNJ) passe la porte du transport saturé : c’est cette fabrication à la main qui sature les PNJ. Les portes des chantiers, du rang, du budget et du courant restent. Décoché : la porte retient la chaîne tant que le transport est saturé.
