[shortcut-name]
fo-dbg-cerveau=Vue « Cerveau » (décisions de l'IA)

[shortcut-description]
fo-dbg-cerveau=Montre sur la carte et dans un panneau les zones que le cerveau d'une équipe gère, leur état réel, ce que l'IA en sait et ses décisions.

[controls]
fo-dbg-cerveau=Vue « Cerveau » (ouvrir ou fermer)

[mod-setting-name]
fo-dbg-cerveau-textes=Vue Cerveau : textes sur la carte
fo-dbg-cerveau-ecarts-seuls=Vue Cerveau : seulement les zones à écart

[mod-setting-description]
fo-dbg-cerveau-textes=Écrit sur la carte, au-dessus de chaque zone, la production, le débit lu et visé, la cause d'arrêt et ce que l'IA en sait.
fo-dbg-cerveau-ecarts-seuls=Ne dessine que les zones où l'IA se trompe, ne les a pas relues depuis longtemps ou ne les lit jamais.

