[mod-setting-name]
fo-war-adopte=Équipe : adopter vos machines posées

fo-war-fantomes=Équipe : montrer où les PNJ vont poser

[mod-setting-description]
fo-war-adopte=Votre équipe fait servir par ses PNJ les fours à combustion que vous posez à la main, à condition qu'ils soient isolés (ni bras, ni tapis, ni foreuse à côté) et proches de son coffre : ses tournées de fonte les chargent, les vident (les plaques vont au coffre) et les ravitaillent en combustible. Une machine qui reçoit ensuite un bras, un tapis ou une foreuse vous est rendue. Rien n'est jamais démoli. Éteint : plus aucune adoption.
fo-war-fantomes=Quand un PNJ de votre équipe part construire ou agrandir un avant-poste, les foreuses et réceptacles qu'il va poser sont montrés en fantômes sur le gisement pendant son trajet. Un aperçu : à son arrivée le PNJ pose ses vrais bâtiments, et les fantômes partent (aussi quand la tâche est abandonnée ou que le PNJ meurt).
