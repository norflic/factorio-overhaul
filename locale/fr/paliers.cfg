[mod-setting-name]
fo-war-paliers=PNJ : croître par marches après stabilité

[mod-setting-description]
fo-war-paliers=Allumé, les factions et votre équipe ne font grandir leur demande (le stock qui dort devient une demande) qu'après 5 minutes de suite sans aucun manque, sans crise et avec des bras libres, puis attendent qu'une nouvelle pose ait eu lieu avant la marche suivante ; toute pose relance le compte. Éteint par défaut : la croissance d'avant (un peu plus à chaque décision tant que le stock dort). Variante à comparer sur plusieurs graines avant d'en faire la règle.
