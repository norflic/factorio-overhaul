[mod-setting-description]
fo-factions=Nombre de factions IA lancées par « /fo-war start » sans argument (2 à 4).
fo-team-npc-max=Effectif maximal de chaque faction IA, atteignable dès l'époque 1. La montée est freinée par le stock (chaque recrue paie un pistolet, 10 chargeurs et 10 plaques de fer plus une par PNJ déjà présent) et par le travail (voir « Recruter si au plus N PNJ inactifs »). S'applique aussi en cours de partie à une guerre lancée sans nombre d'ouvriers.
fo-player-team-npc-max=Effectif maximal de votre équipe (coffre d'équipe). Même règle que les factions : les recrues se paient avec le contenu du coffre, et seulement quand l'équipe a du travail pour elles.
fo-npc-start=PNJ offerts à la fondation d'une équipe (QG d'une faction, ou pose de votre coffre d'équipe), dans la limite de l'effectif maximal.
fo-agents-max=Garde de performance : au-delà de ce nombre de personnages pilotés par le mod (PNJ et compagnons), plus aucune recrue payée. Les PNJ offerts à la fondation et l'embauche de secours d'une équipe vide restent permis.
fo-path-issue-per-tick=Demandes de chemin envoyées au moteur à chaque tick par tout le mod (lissage des pointes). La limite des demandes en cours reste « fo-path-max-inflight ».
fo-recruit-idle-max=Une équipe (faction ou la vôtre) ne recrute que si au plus ce nombre de ses PNJ sont sans tâche : une recrue sans travail resterait inactive et coûterait du fer pris à l'armée ou à votre coffre. 0 : on recrute quand tout le monde travaille. 60 : aucun frein, seul le stock freine.
