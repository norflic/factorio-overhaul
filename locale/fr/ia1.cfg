[mod-setting-name]
fo-factions=Factions de la guerre
fo-team-npc-max=PNJ par faction
fo-player-team-npc-max=PNJ de votre équipe
fo-npc-start=PNJ au départ d'une équipe
fo-agents-max=Garde : agents au plus
fo-path-issue-per-tick=Chemins demandés par tick

[mod-setting-description]
fo-factions=Nombre de factions IA lancées par « /fo-war start » sans argument (2 à 4).
fo-team-npc-max=Effectif maximal de chaque faction IA. Atteignable dès l'époque 1 : seul le stock de la faction freine la montée (chaque recrue paie un pistolet, 10 chargeurs et 10 plaques de fer plus une par PNJ déjà présent). S'applique aussi en cours de partie à une guerre lancée sans nombre d'ouvriers.
fo-player-team-npc-max=Effectif maximal de votre équipe (coffre d'équipe). Même règle que les factions : les recrues se paient avec le contenu du coffre.
fo-npc-start=PNJ offerts à la fondation d'une équipe (QG d'une faction, ou pose de votre coffre d'équipe), dans la limite de l'effectif maximal.
fo-agents-max=Garde de performance : au-delà de ce nombre de personnages pilotés par le mod (PNJ et compagnons), plus aucune équipe ne recrute.
fo-path-issue-per-tick=Demandes de chemin envoyées au moteur à chaque tick par tout le mod (lissage des pointes). La limite des demandes en cours reste « fo-path-max-inflight ».
