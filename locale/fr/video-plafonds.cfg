[mod-setting-name]
fo-war-exclusion=PNJ : objets exclus de la demande

[mod-setting-description]
fo-war-exclusion=Liste de noms d'objets (séparés par des virgules ou des espaces, par exemple « decider-combinator, lab ») que les factions et votre équipe ne fabriquent, ne posent et ne demandent jamais : un objet exclu n'apparaît dans aucun puits ni aucune option de la capitalisation, et chaque refus est écrit dans la ligne [FO-EXCLU] du journal. Les ordres déjà ouverts se terminent. Vide par défaut : rien n'est exclu.
