[mod-setting-name]
fo-levels-panneau=Panneau « Évolution » : ouverture

[mod-setting-description]
fo-levels-panneau=Quand le panneau « Évolution » d'un bâtiment à niveaux s'ouvre-t-il ?\n- Au clic (défaut) : quand vous ouvrez l'interface du bâtiment (clic gauche), et il se ferme avec elle. Le survol n'ouvre rien. U améliore le bâtiment survolé sans ouvrir le panneau ; Maj+U ouvre ou ferme le panneau du bâtiment survolé (murs et autres bâtiments sans interface).\n- Au survol : dès que le curseur passe sur le bâtiment (ou avec U), et il reste affiché (comportement d'avant).\nRéglage propre à chaque joueur, modifiable en cours de partie.

[string-mod-setting]
fo-levels-panneau-clic=Au clic (interface du bâtiment)
fo-levels-panneau-survol=Au survol (comportement d'avant)

[controls]
fo-level-panel=Ouvrir ou fermer le panneau « Évolution » du bâtiment survolé
