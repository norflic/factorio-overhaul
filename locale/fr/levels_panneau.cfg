[mod-setting-name]
fo-levels-panneau=Panneau « Évolution » : ouverture

[mod-setting-description]
fo-levels-panneau=Quand le panneau « Évolution » d'un bâtiment à niveaux s'ouvre-t-il ?\n- Au clic (défaut) : quand vous cliquez sur le bâtiment (clic gauche, murs et tourelles laser compris). Ouvert avec l'interface du bâtiment, il se ferme avec elle. Le survol n'ouvre rien. U améliore le bâtiment survolé sans ouvrir le panneau ; Maj+U ouvre ou ferme le panneau du bâtiment survolé.\n- Au survol : dès que le curseur passe sur le bâtiment (ou avec U), et il reste affiché (comportement d'avant).\nRéglage propre à chaque joueur, modifiable en cours de partie.

[string-mod-setting]
fo-levels-panneau-clic=Au clic sur le bâtiment
fo-levels-panneau-survol=Au survol (comportement d'avant)

[controls]
fo-level-panel=Ouvrir ou fermer le panneau « Évolution » du bâtiment survolé
fo-level-open=Ouvrir le panneau « Évolution » du bâtiment cliqué
