[item-description]
fo-monazite-ore=Grains de monazite miel et brun-rouge mêlés de magnétite. Se concentre avant le lessivage.
fo-monazite-concentrate=8 minerais de monazite. Se lessive à l'acide sulfurique.
fo-rare-earth-concentrate=Terres rares dissoutes de la monazite. Se sépare par solvant.
fo-thorium-oxide=Sous-produit du lessivage de la monazite. Combustible du réacteur à sels fondus (pas encore en jeu) : à stocker.
fo-neodymium=Sous-produit de l'extraction par solvant. Sert aux aimants permanents.
fo-yttrium=Terre rare du ruban supraconducteur.
fo-superconducting-tape=Ruban d'oxyde d'yttrium, de baryum et de cuivre.
fo-permanent-magnet=Aimant au néodyme et au fer.
fo-cryostat=Enceinte isolée sous vide. ÉCART provisoire : du plastique remplace le biopolymère du scénario (âge 8, pas encore en jeu).
fo-superconducting-coil=Matériau de l'âge 12 (Supraconducteurs) : il paie les niveaux de cet âge.

