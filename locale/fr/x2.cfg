[technology-description]
fo-cryostat=Enceinte isolée sous vide en titane : elle garde l'azote liquide autour d'une bobine.
fo-superconductors=Monazite des sables noirs : concentré, lessivage, extraction par solvant, yttrium, ruban supraconducteur, bobine. Ouvre l'unité cryogénique, la colonne d'extraction, le four de frittage, la bobineuse et l'électrolyse de l'eau.
