[entity-description]
fo-monazite=Sable lourd des sables noirs, riche en terres rares et en thorium. Toutes les foreuses l'extraient.
fo-cryogenic-unit=Distille l'air en azote et en oxygène liquides. Visuel provisoire (raffinerie vanilla teintée) en attendant son modèle ; sans niveaux pour l'instant.
fo-extraction-column=Sépare les terres rares par solvant : néodyme et yttrium. Visuel provisoire (usine chimique vanilla teintée) en attendant son modèle ; sans niveaux pour l'instant.
fo-sintering-furnace=Fritte le ruban supraconducteur et les aimants permanents. Visuel provisoire (assembleur vanilla teinté) en attendant son modèle ; sans niveaux pour l'instant.
fo-coil-winder=Enroule le ruban supraconducteur en bobines. Visuel provisoire (assembleur vanilla teinté et réduit) en attendant son modèle ; sans niveaux pour l'instant.

