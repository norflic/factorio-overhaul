[mod-setting-name]
fo-debug-trace-carte=Débogage : décisions des factions sur la carte

[mod-setting-description]
fo-debug-trace-carte=Pose aussi sur VOTRE carte les étiquettes des factions : une par module décidé ou posé (icône du produit, rang, raison), 12 au plus par faction, les plus anciennes retirées. Les étiquettes de votre équipe sont toujours sur votre carte. Allumé par défaut depuis la 0.6.60 ; l'éteindre retire ces copies à la décision suivante.
