[item-description]
fo-photomask=Motif des circuits sur verre, absorbeur en tungstène. S'use à la lithographie.
fo-etched-wafer=Tranche insolée, gravée et dopée : des puces encore soudées entre elles.
fo-crystal-laser=La lentille de résonance sert enfin à un laser : la source du lithographe.
fo-logic-die=Cœur de calcul découpé dans une tranche gravée : le futur processeur.
fo-dram-die=Puce de mémoire vive, découpée dans une tranche gravée.
fo-sram-die=Puce de mémoire cache, rapide et chère, collée au processeur.
fo-heat-sink=Ailettes d'aluminium sur semelle de cuivre : sans lui, une puce brûle.
fo-memory-module=Des puces DRAM sur une carte imprimée : la mémoire vive des serveurs.
fo-motherboard=Cartes imprimées, circuits et l'horloge à cristal qui cadence tout le reste.
fo-server-blade=Baie de centre de calcul (CPU) : 100 unités/s, demande 1 part de mémoire. 1 000 kW, 1 000 kW de chaleur. Ne s'use plus (calcul v2).
fo-graphics-card=Quatre puces logiques et leur mémoire, refroidies, sous blindage de titane : des milliers de calculs en parallèle.
fo-gpu-blade=Baie de centre de calcul (GPU, âge 11) : 400 unités/s, demande 3 parts de mémoire. 2 500 kW, 2 500 kW de chaleur.
fo-degassed-ilmenite=Ilménite chauffée qui a rendu ses gaz piégés, dont l'hélium-3. Se fond au four à arc.
fo-qubit-chip=Circuits supraconducteurs gravés : des qubits, qui ne vivent qu'au voisinage du zéro absolu.
fo-dilution-stage=Cryostat à mélange d'hélium-3 et d'hélium-4 : descend à quelques millièmes de degré.
fo-quantum-processor=Puces à qubits dans leur étage à dilution, pilotées par des puces logiques classiques.

[fluid-name]
fo-photoresist=Résine photosensible
fo-helium-3=Hélium-3

[recipe-name]
fo-chip-processor=Processeur gravé (puces découpées)
fo-compute-classic=Calcul classique
fo-compute-accelerated=Calcul accéléré
fo-compute-quantum=Calcul quantique
fo-regolith-degassing=Dégazage du régolithe
fo-degassed-ilmenite-smelting=Fusion de l'ilménite dégazée

[recipe-description]
fo-compute-classic=100 unités de calcul par seconde. 10 eau par seconde, une baie de serveurs usée toutes les 5 minutes, 10 MW.
fo-compute-accelerated=400 unités de calcul par seconde. 10 eau par seconde, une baie d'accélérateurs usée toutes les 5 minutes, 10 MW.
fo-compute-quantum=2 000 unités de calcul par seconde. 10 eau et 0,5 hélium-3 par seconde, un processeur quantique usé toutes les 10 minutes, 10 MW.

[technology-name]
fo-chip-foundry=Fonderie de puces
fo-data-centers=Centres de calcul
fo-gpu-computing=Calcul accéléré
fo-regolith-degassing=Dégazage du régolithe
fo-quantum-computing=Calcul quantique

[technology-description]
fo-chip-foundry=Lithographie des tranches de silicium, découpe en puces logiques, de mémoire et de cache, et un processeur monté à partir de ces puces.
fo-data-centers=Pose CMS, fibre, atelier d'intégration des baies, groupe froid, tour de refroidissement et le centre de calcul modulaire. Le calcul ne se stocke pas : il accélère la recherche tant que les centres tournent.
fo-gpu-computing=Cartes graphiques et baies GPU : 4 fois le calcul d'une baie CPU, mais 3 parts de mémoire chacune.
fo-regolith-degassing=Chauffer l'ilménite libère l'hélium-3 piégé ; l'ilménite dégazée se fond ensuite au four à arc.
fo-quantum-computing=Réfrigérateur à dilution, labo quantique, baie quantique et refroidissement à dilution du grand centre.
