[entity-name]
fo-crystal-lithograph=Lithographe à cristal
fo-data-center=Centre de calcul

[entity-description]
fo-crystal-lithograph=Insole les tranches de silicium à travers le photomasque, en ultraviolet tiré du cristal taillé. Visuel provisoire (assembleur vanilla teinté) en attendant son modèle.
fo-data-center=Produit le CALCUL de votre force : il consomme du courant (10 MW), de l'eau de refroidissement et use une baie toutes les 5 minutes. Le calcul ne se stocke pas : tant que le centre tourne, vos laboratoires cherchent plus vite. Visuel provisoire (assembleur vanilla teinté) en attendant son modèle.

