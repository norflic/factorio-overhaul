fo-chip-foundry=Fonderie de puces
fo-data-centers=Centres de calcul
fo-gpu-computing=Calcul accéléré
fo-regolith-degassing=Dégazage du régolithe
fo-quantum-computing=Calcul quantique

[technology-description]
fo-chip-foundry=Lithographie des tranches de silicium, découpe en puces logiques, de mémoire et de cache, et un processeur monté à partir de ces puces.
fo-data-centers=Mémoire vive, carte mère, baie de serveurs et centre de calcul. Le calcul ne se stocke pas : il accélère la recherche tant que les centres tournent.
fo-gpu-computing=Cartes graphiques et baies d'accélérateurs : 4 fois plus de calcul par centre.
fo-regolith-degassing=Chauffer l'ilménite libère l'hélium-3 piégé ; l'ilménite dégazée se fond ensuite au four à arc.
fo-quantum-computing=Puces à qubits, étage à dilution à l'hélium-3 et processeur quantique : 20 fois le calcul d'un centre classique.
