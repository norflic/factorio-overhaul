[mod-setting-name]
fo-war-petrole=PNJ : aller au pétrole

[mod-setting-description]
fo-war-petrole=Les factions et votre équipe savent poser ce que la main ne sait pas faire : chevalets sur un gisement de pétrole, raffinerie, usines chimiques, pompe de rive (un étang est posé au gisement quand aucune rive n'est proche, comme pour la centrale), tuyaux et poteaux jusqu'à leur réseau. Elles cherchent alors le pétrole quand leur recherche en a besoin, puis y bâtissent leur site pour le plastique, le soufre et le pack chimique. Allumé par défaut depuis la 0.6.60 ; dans une partie lancée avant, l'allumer en cours de partie suffit (aucune nouvelle partie nécessaire). L'éteindre arrête les nouvelles demandes, les sites posés restent.
