[mod-setting-name]
fo-war-petrole=PNJ : aller au pétrole

[mod-setting-description]
fo-war-petrole=Les factions (pas votre équipe) savent poser ce que la main ne sait pas faire : chevalets sur un gisement de pétrole, raffinerie, usines chimiques, pompe de rive, tuyaux et poteaux jusqu'à leur réseau. Elles cherchent alors le pétrole quand leur recherche en a besoin, puis y bâtissent leur site. Éteint par défaut : pas encore prouvé jusqu'au pack chimique. L'éteindre en cours de partie arrête les nouvelles demandes ; les sites posés restent.
