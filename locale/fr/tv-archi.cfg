[mod-setting-name]
fo-war-enveloppe=Plan directeur : ouvrir les quartiers d'avance
fo-war-quartiers=Plan directeur : dépôt de quartier

[mod-setting-description]
fo-war-enveloppe=Allumé, une équipe prépare le quartier suivant (3 × 3 lots) AVANT que ses modules ne manquent de place : un poteau relié au réseau, deux coffres de dépôt et le lot central défriché, rues comprises. Il s'ouvre quand les lots libres des quartiers déjà ouverts passent sous le besoin anticipé (lots pris par les modules en 15 min, ramenés à 10 min d'avance, entre 2 et 4), avec au moins un PNJ inactif, sans retenue de la pile ni mode survie. Allumé par défaut ; la ligne [FO-ENVELOPPE] du journal donne chaque décision et sa raison. Éteint, rien de nouveau ne s'ouvre ; un quartier déjà commencé finit son chantier.
fo-war-quartiers=Allumé, les deux coffres de dépôt d'un quartier ouvert sont remplis depuis le QG avec les objets que demandent le plus les quais de ses modules ; une tournée « remplir » d'un quai du quartier prend alors au dépôt, quand il a tout le lot, au lieu de faire l'aller-retour au QG. Allumé par défaut ; la ligne [FO-QUARTIER] du journal donne les objets des dépôts toutes les 5 min. Sans quartier ouvert (réglage précédent), rien ne change.
