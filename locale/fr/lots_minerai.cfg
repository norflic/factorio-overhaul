[mod-setting-name]
fo-war-lots-minerai=Plan directeur : réserver les gisements au minerai

[mod-setting-description]
fo-war-lots-minerai=Allumé, un module sans ressource (chaîne d'assembleurs, mall, laboratoires) ne se pose plus sur un lot de gisement du treillis quand aucun lot libre ne le prend : le treillis grandit à la place. Les fonderies et les foreuses gardent leur repli sur le minerai. Allumé par défaut depuis la 0.6.60 ; la ligne [FO-LOTS-MINERAI] du journal mesure combien de modules sans ressource sont posés sur un gisement.
