[mod-setting-name]
fo-war-sonde-30=Plan directeur : sonde de gisement de 30 x 30
fo-war-sites-10=Factions : sites sondés en fenêtres de 10 x 10
fo-war-defrichage-prev=Plan directeur : défrichage préventif de 50 x 50
fo-war-place-simple=Plan directeur : repli de placement simple

[mod-setting-description]
fo-war-sonde-30=Allumé, la zone sondée autour d'un lot du treillis passe de 24 x 24 à 30 x 30 pour le minerai (le treillis ne change pas). Un lot sans minerai à lui mais au bord d'un gisement n'est plus donné aux fabriques (chaîne, mall, laboratoires) : il reste ouvert à la fonte et aux foreuses. La ligne [FO-SONDE] du journal dit chaque lot en bord de gisement. Allumé par défaut depuis la 0.6.65.
fo-war-sites-10=Allumé, la prospection des sites des factions relit aussi, en fenêtres de 10 x 10, un chunk qui n'atteint pas 24 tuiles de ressource : un gisement coupé par la frontière de deux chunks est retenu. Ce qui était trouvé par chunk l'est toujours. La ligne [FO-SITES-10] du journal dit chaque gisement retenu ainsi. Allumé par défaut depuis la 0.6.65.
fo-war-defrichage-prev=Allumé, un lot à défricher proche du QG est défriché d'avance sur 50 x 50 (quatre quarts), un lot à la fois par équipe, à la priorité la plus basse du tableau, sous le budget des travaux lourds, jamais pendant le défrichage d'un projet. Le lot est relevé de nouveau à la fin. La ligne [FO-DEFRICHAGE-PREV] du journal dit chaque lot. Allumé par défaut depuis la 0.6.65.
fo-war-place-simple=Allumé, quand le plan directeur ne trouve de place à un module (hors foreuses et centrale) dans aucun des lots qu'il essaie, il tente la règle la plus petite avant de faire grandir le treillis : jusqu'à 6 lots dans l'ordre de la spirale du treillis, marge 0, sans autre option, mêmes états de lots permis. La ligne [FO-PLACE-SIMPLE] du journal dit le résultat. Allumé par défaut depuis la 0.6.65.
